  ]));
  body.appendChild(listBox);
  body.appendChild(el('div', { class: 'hint',
    text: 'השיבוץ מדלג על שעות שכבר תפוסות בפגישות, בעבודות ובלוח הזמנים, וממלא רק חלונות פנויים.' }));
  openModal('תכנון אוטומטי של ' + fromISO(iso).toLocaleDateString('he-IL'), body, [
    el('button', { class: 'btn primary', onclick: () => {
      if (!plan.length) return closeModal();
      const w = dayW(iso);
      w.schedule = w.schedule || {};
      plan.forEach(p => { w.schedule[p.slot] = p.todo.t; });
      saveDB(); closeModal(); renderAll(true);
      toast(`שובצו ${plan.length} משימות`);
    } }, 'שיבוץ בלוח'),
    el('button', { class: 'btn', onclick: closeModal }, 'ביטול')
  ]);
}

/* ==================== 18. לוח קנבן ==================== */
const KANBAN_COLS = [
  { id: '',    name: 'לעשות',  cls: 'kb-todo' },
  { id: 'wip', name: 'בתהליך', cls: 'kb-wip' },
  { id: 'done', name: 'הושלם', cls: 'kb-done' }
];

function kanbanItems(days){
  const out = [];
  const from = isoOf(addDays(new Date(), -(days || 30)));
  const to   = isoOf(addDays(new Date(), days || 30));
  Object.keys(DB.days).forEach(iso => {
    if (iso < from || iso > to) return;
    (DB.days[iso].todos || []).forEach(t => {
      if (t && (t.t || '').trim()) out.push({ t, iso });
    });
  });
  return out;
}

function openKanban(){
  const body = el('div', { style: 'display:flex;flex-direction:column;gap:10px' });
  const board = el('div', { class: 'kb-board' });
  let range = 30, catFilter = '';
  let dragged = null;

  const draw = () => {
    board.innerHTML = '';
    let items = kanbanItems(range);
    if (catFilter) items = items.filter(x => x.t.cat === catFilter);
    KANBAN_COLS.forEach(col => {
      const rows = items.filter(x => col.id === 'done' ? x.t.d : (!x.t.d && (x.t.st || '') === col.id));
      const c = el('div', { class: 'kb-col ' + col.cls });
      c.appendChild(el('h5', {}, [ el('span', { text: col.name }),
                                   el('span', { class: 'cnt', text: String(rows.length) }) ]));
      const drop = el('div', { class: 'kb-drop' });
      drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
      drop.addEventListener('dragleave', () => drop.classList.remove('over'));
      drop.addEventListener('drop', e => {
        e.preventDefault(); drop.classList.remove('over');
        if (!dragged) return;
        if (col.id === 'done'){ dragged.t.d = true; dragged.t.doneAt = Date.now(); dragged.t.st = ''; }
        else { dragged.t.d = false; dragged.t.doneAt = 0; dragged.t.st = col.id; }
        saveDB(); dragged = null; draw();
      });
      rows.sort((a, b) => a.iso.localeCompare(b.iso));
      rows.forEach(x => {
        const cat = catById(x.t.cat);

/* ==================== 19. אזהרת מזג אוויר לצילומי חוץ ==================== */
function rainWarnings(fromIso, days){
  const out = [];
  const limit = DB.settings.rainWarnPct || 40;
  for (let i = 0; i < (days || 10); i++){
    const iso = isoOf(addDays(fromISO(fromIso || todayISO()), i));
    const w = wxFor(iso);
    if (!w || w.rain == null || w.rain < limit) continue;
    jobsForISO(iso).forEach(j => {
      if (j.outdoor) out.push({ iso, job: j, rain: w.rain, code: w.code });
    });
  }
  return out;
}
function rainChipFor(job){
  if (!job.outdoor || !job.iso) return null;
  const w = wxFor(job.iso);
  if (!w || w.rain == null || w.rain < (DB.settings.rainWarnPct || 40)) return null;
  return el('span', { class: 'rain-warn', title: `סיכוי משקעים ${w.rain}% — צילום חוץ`,
                      text: `☔ ${w.rain}%` });
}

/* ============ מעבר שעון קיץ/חורף ומעבר יום — אוטומטי לחלוטין ============
   כל הזמנים ביישום כבר מחושבים לפי אזור הזמן של המיקום:
     · Hebcal מקבל tzid ומחזיר שעון מקומי כולל שעון קיץ
     · ייבוא היומן ממיר דרך Intl.DateTimeFormat לפי אזור הזמן
     · השעון הפנימי הוא שעון המכשיר, שמתעדכן לבד
   מה שנשאר הוא המקרה של יישום שנשאר פתוח ברציפות — למשל על מסך בסטודיו —
   ואז צריך לזהות שהשעון או התאריך השתנו ולרענן בלי שאף אחד ייגע. */
const ClockWatch = {
  offset: null, day: null, timer: null,
  start(){
    this.offset = new Date().getTimezoneOffset();
    this.day = todayISO();
    clearInterval(this.timer);
    this.timer = setInterval(() => this.tick(), 60000);
    // גם חזרה מרדמה של המכשיר או מעבר ללשונית מפעילה בדיקה מיידית
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.tick(); });
    window.addEventListener('focus', () => this.tick());
  },
  tick(){
    const off = new Date().getTimezoneOffset();
    const day = todayISO();
    const offChanged = off !== this.offset;
    const dayChanged = day !== this.day;
    if (!offChanged && !dayChanged) return;
    this.offset = off; this.day = day;

    if (offChanged){
      // שעון קיץ/חורף התחלף בזמן שהיישום היה פתוח — מרעננים את כל מקורות הזמן
      CACHE.zmanim = {};                 // הזמנים ייטענו מחדש לפי השעון החדש
      try { localStorage.removeItem('planner_wx_v1'); } catch(e){}
      WX.data = null; WX.at = 0;
      refreshData(true);
      loadWeather(true).then(() => renderAll(true));
      _autoDarkApplied = null;
      toast('שעון הקיץ/חורף התחלף — הזמנים עודכנו');
    }
    if (dayChanged && !offChanged) refreshData(false);

    applyAutoDark();
    applyShabbatMode();
    renderAll(true);
    if ($('#wallScreen').classList.contains('open')) Wall.paint();
  }
};

/* ============ בדיקת זמני שבת מול המיקום שהוגדר ============
   מציג את השקיעה האמיתית לצד הזמנים שהיישום מחשב, כדי שאפשר יהיה
   להשוות ללוח המקומי ולכוון את מספר הדקות. */
async function openZmanimCheck(){
  const L = DB.settings.location, S = DB.settings;
  const body = el('div', { style: 'display:flex;flex-direction:column;gap:12px' });
  body.appendChild(el('div', { class: 'hint',
    text: `מיקום: ${L.name} · הדלקת נרות ${S.candleMinutes} דק׳ לפני השקיעה · צאת שבת ${S.havdalahMinutes} דק׳ אחרי השקיעה` }));
  const box = el('div', { class: 'imp-scroll' });
  body.appendChild(box);
  box.appendChild(el('div', { class: 'empty-note', text: 'טוען זמנים…' }));

  const foot = el('div', { class: 'hint',
    html: 'למנהג עדות המזרח בארץ: הדלקת נרות 20 דק׳ לפני השקיעה, וצאת השבת בין 20 ל-30 דק׳ אחרי השקיעה ' +
          '(הרב עובדיה יוסף זצ״ל — 20 דק׳). <b>יש לאמת מול הלוח של הרב שלך.</b>' });

  openModal('בדיקת זמני שבת', body, [ el('button', { class: 'btn', onclick: closeModal }, 'סגירה') ]);

  /* שש שבתות קדימה */
  const rows = [];
  const base = new Date();
  for (let i = 0; i < 42 && rows.length < 6; i++){
    const d = addDays(base, i);
    if (d.getDay() === 5) rows.push(isoOf(d));
  }
  const data = [];
  for (const iso of rows){
    try {
      const url = `https://www.hebcal.com/zmanim?cfg=json&latitude=${L.lat}&longitude=${L.lon}` +
                  `&tzid=${encodeURIComponent(L.tz)}&date=${iso}`;
      const j = await fetch(url).then(r => r.json());
      const cut = s => s ? String(s).slice(11, 16) : '—';
      const sunFri = cut(j.times && j.times.sunset);
      const satIso = isoOf(addDays(fromISO(iso), 1));
      const j2 = await fetch(url.replace(iso, satIso)).then(r => r.json());
      const sunSat = cut(j2.times && j2.times.sunset);
      const shift = (hhmm, mins) => {
        const m = toMin(hhmm); if (m == null) return '—';
        const t = (m + mins + 1440) % 1440;
        return pad2(Math.floor(t / 60)) + ':' + pad2(t % 60);
      };
      data.push({ iso, sunFri, sunSat,
                  candles: shift(sunFri, -S.candleMinutes),
                  exit: shift(sunSat, S.havdalahMinutes),
                  tzeit: cut(j2.times && j2.times.tzeit7083deg) });
    } catch(e){ /* אין רשת — מדלגים */ }
  }
  box.innerHTML = '';
  if (!data.length){
    box.appendChild(el('div', { class: 'empty-note', text: 'לא ניתן לטעון זמנים — נדרש חיבור לאינטרנט.' }));
  } else {
    box.appendChild(el('table', { class: 'imp-table' }, [
      el('thead', {}, el('tr', {}, ['שבת', 'שקיעה ו׳', 'הדלקת נרות', 'שקיעה ש׳', 'צאת שבת', 'צה״כ 7.083°']
        .map(t => el('th', { text: t })))),
      el('tbody', {}, data.map(r => el('tr', {}, [
        el('td', { text: fromISO(r.iso).toLocaleDateString('he-IL') }),
        el('td', { class: 'd', text: r.sunFri }),
        el('td', { class: 'd', style: 'font-weight:700;color:var(--accent-ink)', text: r.candles }),
        el('td', { class: 'd', text: r.sunSat }),
        el('td', { class: 'd', style: 'font-weight:700;color:var(--accent-ink)', text: r.exit }),
        el('td', { class: 'd', text: r.tzeit })
      ])))
    ]));
  }
  body.appendChild(foot);
}

/* ==================== 23. ערכה כהה בשקיעה ==================== */
let _autoDarkApplied = null;
function applyAutoDark(){
  if (!DB.settings.autoDarkSunset) return;
  const z = zmanimForISO(todayISO());
  if (!z || !z.sunset || !z.sunrise) return;
  const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
  const dark = nowMin >= (toMin(z.sunset) || 1e6) || nowMin < (toMin(z.sunrise) || 0);
  if (_autoDarkApplied === dark) return;
  _autoDarkApplied = dark;
  const want = dark ? 'night' : (DB.settings.dayTheme || 'cream');
  if (DB.settings.theme !== want){
    if (!dark && !DB.settings.dayTheme) return;
    DB.settings.theme = want; saveDB(); applyTheme();
  }
}

/** בגרסת המחשב הגיבוי נשמר לתיקיית הנתונים פעם ביום, בלי לשאול כלום */
async function desktopRollingBackup(){
  const D = (typeof DESKTOP !== 'undefined' && DESKTOP) ? window.plannerDesktop : null;

/* ==================== 28. ייבוא עבודות מקובץ ==================== */
function importJobsFile(){
  const inp = el('input', { type: 'file', accept: '.csv,.txt,.xls,.xlsx', style: 'display:none' });
  document.body.appendChild(inp);
  inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0];
    inp.remove();
    if (!f) return;
    const text = await readTextSmart(f);
    let rows = parseCSV(text);
    if (rows.length < 2 && /\t/.test(text))
      rows = text.split(/\r?\n/).filter(Boolean).map(l => l.split('\t'));
    if (rows.length < 2) return alert('לא נמצאו שורות. שמור את הגיליון כ-CSV ונסה שוב.');
    openJobsImportDialog(rows);
  });
  inp.click();
}

function openJobsImportDialog(rows){
  const head = rows[0].map(h => String(h).trim());
  const data = rows.slice(1);
  const FIELDS = [
    ['title', 'שם העבודה'], ['iso', 'תאריך'], ['time', 'שעה'], ['kind', 'סוג'],
    ['client', 'לקוח'], ['where', 'מיקום'], ['price', 'מחיר'], ['paid', 'שולם'], ['note', 'הערות']
  ];
  const guess = {
    title: /שם|עבודה|title|event|אירוע/i, iso: /תאריך|date/i, time: /שעה|time/i,
    kind: /סוג|kind|type|קטגור/i, client: /לקוח|client|customer|שם הלקוח/i,
    where: /מיקום|כתובת|אולם|location|where/i, price: /מחיר|סכום|price|amount/i,
    paid: /שול|paid/i, note: /הער|note|comment/i
  };
  const map = {};
  FIELDS.forEach(([k]) => {
    const i = head.findIndex(h => guess[k] && guess[k].test(h));
    map[k] = i >= 0 ? i : -1;
  });

  const body = el('div', { style: 'display:flex;flex-direction:column;gap:11px' });
  const prev = el('div', { class: 'imp-scroll' });
  let plan = [];

  const normDate = v => {
    const s = String(v || '').trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    let m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/);
    if (m){
      const y = m[3].length === 2 ? 2000 + +m[3] : +m[3];
      return `${y}-${pad2(+m[2])}-${pad2(+m[1])}`;
    }
    m = s.match(/^(\d{4})[./-](\d{1,2})[./-](\d{1,2})$/);
    if (m) return `${m[1]}-${pad2(+m[2])}-${pad2(+m[3])}`;
    return '';
  };
  const num = v => Number(String(v || '').replace(/[^\d.\-]/g, '')) || 0;

  const compute = () => {
    plan = [];
    data.forEach(r => {
      const g = k => map[k] >= 0 ? String(r[map[k]] || '').trim() : '';
      const title = g('title');
      const iso = normDate(g('iso'));
      if (!title && !iso) return;
      const exists = DB.jobs.some(j => j.title === title && j.iso === iso);
      plan.push({ title: title || '(ללא שם)', iso, time: g('time'), kind: g('kind'),
                  client: g('client'), where: g('where'),
                  price: num(g('price')), paid: num(g('paid')), note: g('note'), exists });
    });
    const fresh = plan.filter(p => !p.exists).length;
    prev.innerHTML = '';
    prev.appendChild(el('table', { class: 'imp-table' }, [
      el('thead', {}, el('tr', {}, ['תאריך', 'עבודה', 'לקוח', 'מחיר', 'מצב'].map(t => el('th', { text: t })))),
      el('tbody', {}, plan.slice(0, 60).map(p => el('tr', {}, [
        el('td', { class: 'd', text: p.iso ? p.iso.split('-').reverse().join('/') : '—' }),
        el('td', { text: p.title }), el('td', { text: p.client || '—' }),
        el('td', { class: 'd', text: p.price ? money(p.price) : '—' }),
        el('td', { text: p.exists ? 'קיים' : 'חדש' })
      ])))
    ]));
    impBtn.textContent = fresh ? `ייבוא ${fresh} עבודות` : 'אין מה לייבא';
    impBtn.disabled = !fresh;
  };

  const impBtn = el('button', { class: 'btn primary', onclick: () => {
    let n = 0;
    plan.filter(p => !p.exists).forEach(p => {
      let who = '';
      if (p.client){
        let c = DB.contacts.find(x => (x.name || '').trim() === p.client);
        if (!c){ c = { id: uid(), name: p.client, phone: '', email: '', note: '', tags: '', bday: '', bdayHeb: null };
                 DB.contacts.push(c); }
        who = c.id;
      }
      const job = Object.assign(JOB_DEFAULT(), {
        title: p.title, iso: p.iso, time: p.time, kind: p.kind, where: p.where,
        who, price: p.price, paid: p.paid, note: p.note,
        status: p.paid && p.paid >= p.price && p.price ? 'paid' : 'booked'
      });
      if (job.iso && DB.settings.deliveryDays)
        job.deliverBy = isoOf(addDays(fromISO(job.iso), DB.settings.deliveryDays));
      DB.jobs.push(job); n++;
    });
    invalidateContactCache();
    saveDB(); closeModal(); renderAll(true);
    toast(`יובאו ${n} עבודות`);
  } }, 'ייבוא');

  const mapRow = el('div', { class: 'field-row', style: 'flex-wrap:wrap' });
  FIELDS.forEach(([k, label]) => {
    mapRow.appendChild(field(label, mkSelect(
      [[-1, '— לא בשימוש —']].concat(head.map((h, i) => [i, h || 'עמודה ' + (i + 1)])),
      map[k], v => { map[k] = Number(v); compute(); })));
  });

  body.appendChild(el('div', { class: 'hint',
    text: `נמצאו ${data.length} שורות. ודא שהעמודות משויכות נכון — הזיהוי אוטומטי לפי הכותרות.` }));
  body.appendChild(mapRow);
  body.appendChild(prev);
  compute();
  openModal('ייבוא עבודות מקובץ', body, [ impBtn, el('button', { class: 'btn', onclick: closeModal }, 'ביטול') ]);
}

/* ==================== 29. בדיקת תקינות נתונים ==================== */
function scanIntegrity(){
  const issues = [];
  const add = (id, title, detail, fix) => issues.push({ id, title, detail, fix });

  // פגישות ריקות לגמרי
  let emptyAppts = 0;
  Object.values(DB.days).forEach(r => {
    (r.appts || []).forEach(a => { if (a && !a.time && !(a.what || '').trim() && !a.where) emptyAppts++; });
  });
  if (emptyAppts) add('emptyAppts', `${emptyAppts} שורות פגישה ריקות`,
    'שורות בלי שעה, בלי כותרת ובלי מיקום.',
    () => { Object.values(DB.days).forEach(r => {
      r.appts = (r.appts || []).filter(a => a && (a.time || (a.what || '').trim() || a.where)); }); });

  // פגישות כפולות באותו יום
  let dupes = 0;
  Object.values(DB.days).forEach(r => {
    const seen = new Set();
    (r.appts || []).forEach(a => {
      if (!a) return;
      const k = (a.time || '') + '|' + (a.what || '') + '|' + (a.uid || '');
      if (a.uid && seen.has(k)) dupes++;
      seen.add(k);
    });
  });
  if (dupes) add('dupes', `${dupes} פגישות כפולות`,
    'אותו אירוע מיובא נכנס יותר מפעם אחת.',
    () => { Object.values(DB.days).forEach(r => {
      const seen = new Set();
      r.appts = (r.appts || []).filter(a => {
        if (!a || !a.uid) return true;
        const k = (a.time || '') + '|' + (a.what || '') + '|' + a.uid;
        if (seen.has(k)) return false;
        seen.add(k); return true;
      }); }); });

  // משימות בלי מזהה
  const noId = [];
  Object.values(DB.days).forEach(r => (r.todos || []).forEach(t => { if (t && !t.id) noId.push(t); }));
  if (noId.length) add('noId', `${noId.length} משימות בלי מזהה`,
    'נדרש לתלויות בין משימות.', () => noId.forEach(t => { t.id = uid(); }));

  // עבודות ללא תאריך
  const noDate = DB.jobs.filter(j => !j.iso);
  if (noDate.length) add('noDate', `${noDate.length} עבודות בלי תאריך`,
    'לא יופיעו ביומן ולא ייכנסו לתזרים. יש לקבוע להן תאריך ידנית.', null);

  // לקוחות שנמחקו אך עדיין משויכים
  const ids = new Set(DB.contacts.map(c => c.id));
  const orphanJobs = DB.jobs.filter(j => j.who && !ids.has(j.who));
  const orphanDocs = DB.docs.filter(d => d.who && !ids.has(d.who));
  if (orphanJobs.length + orphanDocs.length)
    add('orphan', `${orphanJobs.length + orphanDocs.length} שיוכים ללקוח שנמחק`,
      'העבודה או המסמך מפנים ללקוח שכבר לא קיים.',
      () => { orphanJobs.forEach(j => { j.who = ''; }); orphanDocs.forEach(d => { d.who = ''; }); });

  // תלות במשימה שנמחקה
  const allIds = new Set();
  Object.values(DB.days).forEach(r => (r.todos || []).forEach(t => t && t.id && allIds.add(t.id)));
  const badDeps = [];
  Object.values(DB.days).forEach(r => (r.todos || []).forEach(t => {
    if (t && t.dep && !allIds.has(t.dep)) badDeps.push(t); }));
  if (badDeps.length) add('badDeps', `${badDeps.length} תלויות שבורות`,
    'משימה ממתינה למשימה שכבר נמחקה — והיא תישאר נעולה לנצח.',
    () => badDeps.forEach(t => { t.dep = ''; }));

  // ימים ריקים לגמרי
  const emptyDays = Object.keys(DB.days).filter(k => isEmptyDay(DB.days[k]));
  if (emptyDays.length > 20) add('emptyDays', `${emptyDays.length} ימים ריקים שמורים`,
    'רשומות בלי תוכן שמנפחות את הקובץ.',
    () => emptyDays.forEach(k => { delete DB.days[k]; }));

  // פגישות עם שעה לא תקינה
  const badTime = [];
  Object.values(DB.days).forEach(r => (r.appts || []).forEach(a => {
    if (a && a.time && !/^\d{1,2}:\d{2}$/.test(a.time)) badTime.push(a); }));
  if (badTime.length) add('badTime', `${badTime.length} שעות בפורמט שגוי`,
    'שעה שאינה בצורת HH:MM לא תופיע בלוח הזמנים.',
    () => badTime.forEach(a => {
      const m = String(a.time).match(/(\d{1,2})\D+(\d{2})/);
      a.time = m ? pad2(+m[1]) + ':' + m[2] : '';
    }));

  return issues;
}

function openIntegrity(){
  const body = el('div', { style: 'display:flex;flex-direction:column;gap:11px' });
  const box = el('div', { style: 'display:flex;flex-direction:column;gap:8px' });
  const draw = () => {
    const issues = scanIntegrity();
    box.innerHTML = '';
    if (!issues.length){
      box.appendChild(el('div', { class: 'ok-banner', text: '✅ לא נמצאו בעיות. הנתונים תקינים.' }));
      return;
    }
    issues.forEach(is => {
      box.appendChild(el('div', { class: 'int-card' }, [
        el('div', { class: 'ttl', text: is.title }),
        el('div', { class: 'hint', text: is.detail }),
        is.fix ? el('button', { class: 'btn sm primary', onclick: () => {
          is.fix(); saveDB(); renderAll(true); draw(); toast('תוקן');
        } }, 'תיקון') : el('div', { class: 'hint', style: 'font-style:italic', text: 'דורש טיפול ידני' })
      ]));
    });
  };
  draw();
  body.appendChild(el('div', { class: 'hint',
    text: 'הבדיקה רק סורקת. שום דבר לא משתנה עד שתלחץ "תיקון", וכל תיקון ניתן לביטול ב-Ctrl+Z.' }));
  body.appendChild(box);
  openModal('בדיקת תקינות נתונים', body, [
    el('button', { class: 'btn', onclick: draw }, '↻ סריקה מחדש'),
    el('button', { class: 'btn', onclick: closeModal }, 'סגירה')
  ]);
}

/* ==================== 30. היום לפני שנה ==================== */
function onThisDayItems(iso){
  const out = [];
  const d = fromISO(iso), h = hebOf(d);
  for (let back = 1; back <= 6; back++){
    // לפי הלוח הלועזי
    const g = new Date(d.getFullYear() - back, d.getMonth(), d.getDate());
    const gi = isoOf(g), rg = DB.days[gi];
    const bits = [];
    if (rg){
      (rg.appts || []).forEach(a => { if (a && (a.what || '').trim()) bits.push('📌 ' + a.what); });
      (rg.todos || []).forEach(t => { if (t && t.d && (t.t || '').trim()) bits.push('✓ ' + t.t); });
      if ((rg.notes || '').trim()) bits.push('📝 ' + rg.notes.split('\n')[0].slice(0, 60));
    }
    jobsForISO(gi).forEach(j => bits.push('📷 ' + (j.title || 'עבודה')));
    if (bits.length) out.push({ years: back, iso: gi, kind: 'greg', bits: bits.slice(0, 4) });

    // לפי הלוח העברי — אותו תאריך עברי בשנה קודמת
    const hd = hebDateInYear(h.y - back, h.m, h.d), hi = isoOf(hd);
    if (hi === isoOf(g)) continue;             // חופף ללועזי, לא כופלים
    const rh = DB.days[hi], hbits = [];
    if (rh){
      (rh.appts || []).forEach(a => { if (a && (a.what || '').trim()) hbits.push('📌 ' + a.what); });
      (rh.todos || []).forEach(t => { if (t && t.d && (t.t || '').trim()) hbits.push('✓ ' + t.t); });
    }
    jobsForISO(hi).forEach(j => hbits.push('📷 ' + (j.title || 'עבודה')));
    if (hbits.length) out.push({ years: back, iso: hi, kind: 'heb', bits: hbits.slice(0, 3) });
  }
  return out;
}

function onThisDayCard(iso){
  const box = el('div');
  const items = onThisDayItems(iso);
  if (!items.length){
    box.appendChild(el('div', { class: 'empty-note', text: 'אין רשומות בתאריך הזה בשנים קודמות' }));
    return box;
  }
  items.forEach(it => {
    box.appendChild(el('div', { class: 'otd-row', onclick: () => { State.cursor = fromISO(it.iso); renderAll(); } }, [
      el('div', { class: 'otd-head' }, [
        el('b', { text: it.years === 1 ? 'לפני שנה' : `לפני ${it.years} שנים` }),
        el('span', { class: 'hint', text: (it.kind === 'heb' ? 'לוח עברי · ' : '') +
                                          fromISO(it.iso).toLocaleDateString('he-IL') })
      ]),
      el('div', { class: 'otd-bits' }, it.bits.map(b => el('div', { text: b })))
    ]));
  });
  return box;
}

/* ==========================================================================
   33. סנכרון ברשת המקומית — כמה מחשבים
   --------------------------------------------------------------------------
   כל מחשב (למשל בית וסטודיו) מריץ שרת קטן ברשת שלו. המכשיר הנייד מחזיק
   רשימת מחשבים מוכרים, ובכל רגע מסתנכרן עם כל מי שנמצא איתו כרגע באותה
   רשת — בלי לדעת איפה אתה, ובלי שהמחשבים צריכים לדבר ביניהם בכלל.
   המחשבים עצמם אף פעם לא מתקשרים זה עם זה; המכשיר הנייד הוא ש"נוסע" ביניהם
   ומעביר את השינויים הלאה בפעם הבאה שהוא נפגש עם המחשב השני.

   המיזוג הוא מיזוג-שלושה, **בנפרד לכל מחשב**: משווים את המצב שלי ואת המצב
   שבמחשב מול תמונת המצב מהסנכרון האחרון *מול אותו מחשב בדיוק*. כך יודעים
   מי שינה מה:
     · רק אני שיניתי        ⟵ נשמר שלי
     · רק המחשב הזה שינה    ⟵ נלקח משם
     · שנינו שינינו אותו דבר ⟵ סתירה, ואתה בוחר
   תמונת בסיס אחת גלובלית הייתה שוברת את הזיהוי הזה ברגע שעוברים בין
   מחשב לחברו — בדיוק כמו שקורה כשמערבבים שתי היסטוריות גיט לא קשורות.
   ========================================================================== */
const SYNC_CFG_KEY      = 'planner_synccfg_v2';   // { remotes: [ {id,name,host,port,token,auto,everyMin,lastAt} ] }
const SYNC_BASE_KEY     = 'planner_syncbase_v2';  // { [remoteId]: bundleObj }
const SYNC_CFG_KEY_OLD  = 'planner_synccfg_v1';   // גרסה קודמת — מחשב יחיד
const SYNC_BASE_KEY_OLD = 'planner_syncbase_v1';

const Sync = {
  busy: false, timer: null,

  /** רשימת המחשבים המוכרים. בקריאה הראשונה מהגרה הגדרת מחשב-יחיד ישנה, אם הייתה. */
  remotes(){
    try {
      const c = JSON.parse(localStorage.getItem(SYNC_CFG_KEY) || 'null');
      if (c && Array.isArray(c.remotes)) return c.remotes;
    } catch(e){}
    try {
      const old = JSON.parse(localStorage.getItem(SYNC_CFG_KEY_OLD) || 'null');
      if (old && old.host){
        const oldBase = (() => { try { return JSON.parse(localStorage.getItem(SYNC_BASE_KEY_OLD) || 'null'); }
                                  catch(e){ return null; } })();
        const remote = { id: uid(), name: 'מחשב', host: old.host, port: old.port || 8790,
                         token: old.token || '', auto: old.auto !== false, everyMin: old.everyMin || 5,
                         lastAt: old.lastAt || 0 };
        this.setRemotes([remote]);
        if (oldBase) this.setBaseFor(remote.id, oldBase);
        localStorage.removeItem(SYNC_CFG_KEY_OLD);
        localStorage.removeItem(SYNC_BASE_KEY_OLD);
        return [remote];
      }
    } catch(e){}
    return [];
  },
  setRemotes(list){ try { localStorage.setItem(SYNC_CFG_KEY, JSON.stringify({ remotes: list })); } catch(e){} },
  addRemote(r){ const list = this.remotes(); list.push(r); this.setRemotes(list); return r; },
  updateRemote(id, patch){
    const list = this.remotes();
    const i = list.findIndex(x => x.id === id);
    if (i >= 0) list[i] = Object.assign({}, list[i], patch);
    this.setRemotes(list);
  },
  removeRemote(id){
    this.setRemotes(this.remotes().filter(x => x.id !== id));
    const all = this.allBases(); delete all[id]; this.setAllBases(all);
  },

  allBases(){ try { return JSON.parse(localStorage.getItem(SYNC_BASE_KEY) || '{}'); } catch(e){ return {}; } },
  setAllBases(obj){ try { localStorage.setItem(SYNC_BASE_KEY, JSON.stringify(obj)); } catch(e){} },
  baseFor(id){ return this.allBases()[id] || null; },
  setBaseFor(id, obj){ const all = this.allBases(); all[id] = obj; this.setAllBases(all); },

  originFor(remote){ return `http://${remote.host}:${remote.port}`; },

  async pingRemote(remote){
    const o = this.originFor(remote);
    try {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 2500);
      const r = await fetch(o + '/sync/ping', { signal: ctrl.signal, cache: 'no-store' });
      clearTimeout(t);
      if (!r.ok) return null;
      const j = await r.json();
      return j && j.app === 'planner' ? j : null;
    } catch(e){ return null; }
  },

  /** https חוסם כל פנייה ל-http פרטי, לא משנה לאיזה מחשב */
  blockedByHttps(){ return location.protocol === 'https:'; },

  async pullFrom(remote){
    const o = this.originFor(remote);
    const r = await fetch(`${o}/sync/pull?token=${encodeURIComponent(remote.token)}`, { cache: 'no-store' });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || ('שגיאה בקריאה מ' + (remote.name || 'המחשב')));
    return j.bundle;
  },
  async pushTo(remote, bundle){
    const o = this.originFor(remote);
    const r = await fetch(`${o}/sync/push?token=${encodeURIComponent(remote.token)}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bundle })
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || ('שגיאה בכתיבה ל' + (remote.name || 'המחשב')));
    return j;
  },

  /** החבילה המקומית — כל מפתחות היישום */
  localBundle(){
    const out = {};
    const keys = ['planner_profiles_v1'];
    try {
      for (let i = 0; i < localStorage.length; i++){
        const k = localStorage.key(i);
        if (k && k.indexOf('planner_') === 0 &&
            k !== SYNC_BASE_KEY && k !== SYNC_CFG_KEY &&
            k !== SYNC_BASE_KEY_OLD && k !== SYNC_CFG_KEY_OLD && k !== 'planner_wx_v1') keys.push(k);
      }
    } catch(e){}
    Array.from(new Set(keys)).forEach(k => { const v = localStorage.getItem(k); if (v != null) out[k] = v; });
    return out;
  },

  parse(raw){ try { return raw == null ? null : JSON.parse(raw); } catch(e){ return null; } },

  /* ---------------- מיזוג ---------------- */
  /** משווה שלושה מצבים ומחזיר { merged, conflicts[] } */
  merge(mine, theirs, base){
    const conflicts = [];
    const merged = {};
    const keys = new Set([...Object.keys(mine || {}), ...Object.keys(theirs || {})]);
    keys.forEach(k => {
      const a = mine[k], b = theirs[k], c = base ? base[k] : undefined;
      if (a === b){ merged[k] = a; return; }
      if (a === undefined){ merged[k] = b; return; }
      if (b === undefined){ merged[k] = a; return; }
      if (c !== undefined && a === c){ merged[k] = b; return; }   // רק המחשב שינה
      if (c !== undefined && b === c){ merged[k] = a; return; }   // רק אני שיניתי
      // שנינו שינינו — יורדים לרזולוציה של רשומות בתוך המסד
      if (/^planner_v1/.test(k)){
        const r = this.mergeDB(this.parse(a), this.parse(b), this.parse(c), k);
        merged[k] = JSON.stringify(r.db);
        conflicts.push(...r.conflicts);
      } else {
        conflicts.push({ key: k, scope: k, id: k, label: k, mine: a, theirs: b, kind: 'raw' });
        merged[k] = a;
      }
    });
    return { merged, conflicts };
  },

  /** מיזוג ברמת הרשומה: ימים לפי תאריך, ושאר האוספים לפי מזהה */
  mergeDB(mine, theirs, base, storeKeyName){
    const conflicts = [];
    if (!mine)   return { db: theirs, conflicts };
    if (!theirs) return { db: mine, conflicts };
    base = base || {};
    const db = JSON.parse(JSON.stringify(mine));
    const S = s => JSON.stringify(s === undefined ? null : s);

    /* --- ימים --- */
    db.days = db.days || {};
    const dayKeys = new Set([...Object.keys(mine.days || {}), ...Object.keys(theirs.days || {})]);
    dayKeys.forEach(iso => {
      const a = (mine.days || {})[iso], b = (theirs.days || {})[iso], c = (base.days || {})[iso];
      if (S(a) === S(b)) return;
      if (a === undefined){ db.days[iso] = b; return; }
      if (b === undefined){ return; }
      if (S(a) === S(c)){ db.days[iso] = b; return; }
      if (S(b) === S(c)){ return; }
      conflicts.push({ key: storeKeyName, scope: 'days', id: iso, kind: 'day',
        label: fromISO(iso).toLocaleDateString('he-IL') + ' · ' + DOW_LONG[fromISO(iso).getDay()],
        mine: a, theirs: b, summary: { mine: this.dayText(a), theirs: this.dayText(b) } });
    });

    /* --- אוספים עם מזהה --- */
    const LISTS = {
      jobs: 'עבודה', contacts: 'איש קשר', docs: 'מסמך', finance: 'תנועה כספית',
      timeLogs: 'רישום שעות', leads: 'פנייה', crew: 'איש צוות', priceItems: 'פריט מחירון',
      azkarot: 'אזכרה', checklists: 'צ׳קליסט', events: 'אירוע', recurring: 'משימה קבועה',
      templates: 'תבנית', weekTemplates: 'תבנית שבוע', layers: 'שכבה', bigGoals: 'יעד',
      gearLists: 'רשימת ציוד', zmanReminders: 'תזכורת זמן'
    };
    Object.entries(LISTS).forEach(([list, noun]) => {
      const A = mine[list] || [], B = theirs[list] || [], C = base[list] || [];
      const byId = arr => { const m = {}; (arr || []).forEach(x => { if (x && x.id) m[x.id] = x; }); return m; };
      const ma = byId(A), mb = byId(B), mc = byId(C);
      const out = [];
      const ids = new Set([...Object.keys(ma), ...Object.keys(mb)]);
      ids.forEach(id => {
        const a = ma[id], b = mb[id], c = mc[id];
        if (S(a) === S(b)){ if (a) out.push(a); return; }
        if (!a){ out.push(b); return; }                       // נוסף במחשב
        if (!b){ if (!c) out.push(a); return; }               // נוסף אצלי / נמחק במחשב
        if (S(a) === S(c)){ out.push(b); return; }
        if (S(b) === S(c)){ out.push(a); return; }
        out.push(a);
        conflicts.push({ key: storeKeyName, scope: list, id, kind: 'item', noun,
          label: noun + ': ' + (a.title || a.name || a.what || a.desc || a.number || id),
          mine: a, theirs: b,
          summary: { mine: this.itemText(a), theirs: this.itemText(b) } });
      });
      db[list] = out;
    });

    /* --- הגדרות: כל שדה בנפרד --- */
    db.settings = Object.assign({}, mine.settings);
    const sKeys = new Set([...Object.keys(mine.settings || {}), ...Object.keys(theirs.settings || {})]);
    sKeys.forEach(k => {
      const a = (mine.settings || {})[k], b = (theirs.settings || {})[k], c = (base.settings || {})[k];
      if (S(a) === S(b)) return;
      if (S(a) === S(c)){ db.settings[k] = b; return; }
      if (S(b) === S(c)) return;
      conflicts.push({ key: storeKeyName, scope: 'settings', id: k, kind: 'setting',
        label: 'הגדרה: ' + k, mine: a, theirs: b,
        summary: { mine: String(a), theirs: String(b) } });
    });

    /* --- תקופות (שבוע/חודש/שנה) — לפי מפתח --- */
    ['weeks', 'months', 'hmonths', 'years', 'hyears'].forEach(bucket => {
      db[bucket] = Object.assign({}, mine[bucket]);
      const ks = new Set([...Object.keys(mine[bucket] || {}), ...Object.keys(theirs[bucket] || {})]);
      ks.forEach(k => {
        const a = (mine[bucket] || {})[k], b = (theirs[bucket] || {})[k], c = (base[bucket] || {})[k];
        if (S(a) === S(b)) return;
        if (a === undefined){ db[bucket][k] = b; return; }
        if (b === undefined) return;
        if (S(a) === S(c)){ db[bucket][k] = b; return; }
        if (S(b) === S(c)) return;
        conflicts.push({ key: storeKeyName, scope: bucket, id: k, kind: 'period',
          label: 'תקופה: ' + k, mine: a, theirs: b,
          summary: { mine: this.dayText(a), theirs: this.dayText(b) } });
      });
    });

    /* --- רישום הייבוא: איחוד, אף פעם לא סתירה --- */
    db.importLog = Object.assign({}, theirs.importLog || {}, mine.importLog || {});
    return { db, conflicts };
  },

  dayText(r){
    if (!r) return '(ריק)';
    const bits = [];
    const ap = (r.appts || []).filter(a => a && (a.what || '').trim());
    if (ap.length) bits.push(ap.map(a => (a.time ? a.time + ' ' : '') + a.what).join(' · '));
    const td = (r.todos || []).filter(t => t && (t.t || '').trim());
    if (td.length) bits.push(td.length + ' משימות: ' + td.slice(0, 3).map(t => t.t).join(', '));
    if ((r.notes || '').trim()) bits.push('הערות: ' + r.notes.slice(0, 40));
    return bits.join(' | ') || '(ריק)';
  },
  itemText(x){
    if (!x) return '(אין)';
    const bits = [];
    if (x.iso) bits.push(x.iso.split('-').reverse().join('/'));
    if (x.time) bits.push(x.time);
    if (x.status) bits.push(String(x.status));
    if (x.price != null && x.price !== 0) bits.push(money(x.price));
    if (x.paid != null && x.paid !== 0) bits.push('שולם ' + money(x.paid));
    if (x.phone) bits.push(x.phone);
    if (x.note) bits.push(String(x.note).slice(0, 30));
    return bits.join(' · ') || '—';
  },

  /* ---------------- ההרצה — מול מחשב בודד ---------------- */
  /** מחזיר 'ok' | 'conflict' | 'unreachable' */
  async runOne(remote, opts){
    opts = opts || {};
    const alive = await this.pingRemote(remote);
    if (!alive) return 'unreachable';

    /* saveDB() is debounced (350ms) — without a synchronous flush here, a sync that fires
       right after an edit could read localStorage BEFORE the debounce writes it, push the
       stale version, and then have commitTo's loadDB() overwrite the in-memory edit with
       that stale merge result. Flushing first makes localBundle() always see the true
       current state, no matter how recently something changed. */
    try { persistNow(); } catch(e){}

    const theirs = await this.pullFrom(remote);
    const mine = this.localBundle();
    const base = this.baseFor(remote.id);
    const { merged, conflicts } = this.merge(mine, theirs, base);

    if (conflicts.length){
      openConflictDialog(remote, conflicts, merged, theirs);
      return 'conflict';
    }
    await this.commitTo(remote, merged);
    return 'ok';
  },

  /** כותב את התוצאה לשני הצדדים ומעדכן את תמונת הבסיס — של המחשב הזה בלבד */
  async commitTo(remote, merged){
    await this.pushTo(remote, merged);
    Object.entries(merged).forEach(([k, v]) => { try { localStorage.setItem(k, v); } catch(e){} });
    this.setBaseFor(remote.id, merged);
    this.updateRemote(remote.id, { lastAt: Date.now() });
    loadProfiles();
    loadDB();
    pruneDB();
    invalidateContactCache(); invalidatePlacesCache(); _evCache.key = null;
    _prevState = JSON.stringify(DB);
    applyTheme(); renderAll(true);
  },

  /* ---------------- ההרצה — כל המחשבים המוכרים ----------------
     עוברים על כל מחשב מוגדר ומנסים; מי שלא נמצא ברשת הנוכחית פשוט מדולג
     בשקט (זה הצפוי — אתה לא יכול להיות פיזית בשתי הרשתות בבת אחת).
     נעצרים בסתירה הראשונה כדי לא לערום כמה חלונות בחירה זה על זה —
     המחשבים הנותרים ינסו שוב בפעם הבאה. */
  async run(opts){
    opts = opts || {};
    if (this.busy) return;
    const remotes = this.remotes();
    if (!remotes.length){ if (opts.manual) openSyncSetup(); return; }
    if (this.blockedByHttps()){ if (opts.manual) openSyncSetup(true); return; }

    this.busy = true;
    this.paintChip('בודק…');
    const done = [];
    let hadConflict = false, hadError = false;
    for (const remote of remotes){
      if (!opts.manual && remote.auto === false) continue;
      try {
        const res = await this.runOne(remote, opts);
        if (res === 'ok') done.push(remote.name || 'מחשב');
        else if (res === 'conflict'){ hadConflict = true; break; }
        // 'unreachable' — לא באותה רשת כרגע, מדלגים בשקט
      } catch(e){ hadError = true; }
    }
    this.busy = false;
    if (hadConflict) return;   // מסך הסתירות כבר פתוח ומטפל בהמשך בעצמו

    if (done.length){
      this.paintChip('מסונכרן: ' + done.join(', '));
      if (opts.manual) toast('הסתנכרן עם ' + done.join(', '));
    } else if (hadError){
      this.paintChip('שגיאה');
      if (opts.manual) alert('הסנכרון נכשל.');
    } else {
      this.paintChip('');
      if (opts.manual) toast('לא נמצא אף מחשב מוכר ברשת הנוכחית');
    }
  },

  /** הכפתור נשאר תמיד עם אייקון 🔄 — הטקסט זז ל-title, והמצב מסומן בצבע ובסיבוב */
  paintChip(text){
    const chip = $('#syncChip2');
    if (!chip) return;
    const remotes = this.remotes();
    chip.hidden = false;
    const spinning = text === 'בודק…';
    chip.className = 'btn icon sync-chip' +
      (spinning ? ' spinning' : '') +
      (/שגיאה/.test(text || '') ? ' bad' : /מסונכרן/.test(text || '') ? ' ok' : '');
    let summary;
    if (!remotes.length) summary = 'אין מחשבים מוגדרים';
    else {
      const withTime = remotes.filter(r => r.lastAt).sort((a, b) => b.lastAt - a.lastAt);
      summary = withTime.length
        ? withTime.map(r => (r.name || 'מחשב') + ': ' + new Date(r.lastAt).toLocaleString('he-IL')).join(' · ')
        : 'טרם סונכרן';
    }
    chip.title = remotes.length
      ? (text ? text + ' · ' + summary : 'לחיצה לסנכרון מיידי · ' + summary)
      : 'לחיצה להוספת מחשב לסנכרון';
  },

  start(){
    // המחשב הוא השרת של הסנכרון, לא לקוח שלו — אין צורך בכפתור או בבדיקות תקופתיות בגרסתו
    if (typeof DESKTOP !== 'undefined' && DESKTOP){
      if (window.plannerDesktop.onSyncChanged)
        window.plannerDesktop.onSyncChanged(() => {
          loadDB(); renderAll(true); toast('הנתונים עודכנו ממכשיר אחר');
        });
      return;
    }
    this.paintChip();
    const remotes = this.remotes().filter(r => r.auto !== false);
    if (!remotes.length) return;
    const minEvery = Math.max(1, Math.min(...remotes.map(r => r.everyMin || 5)));
    clearInterval(this.timer);
    this.timer = setInterval(() => this.run(), minEvery * 60000);
    setTimeout(() => this.run(), 3000);
    window.addEventListener('online', () => this.run());
    document.addEventListener('visibilitychange', () => { if (!document.hidden) this.run(); });
  }
};

/* ---------------- מסך ההגדרה ---------------- */
/** מסך הניהול — רשימת המחשבים המוכרים. תומך במספר בלתי מוגבל (בית, סטודיו, ...) */
function openSyncSetup(httpsWarning){
  const body = el('div', { style: 'display:flex;flex-direction:column;gap:12px' });

  if (httpsWarning || Sync.blockedByHttps()){
    body.appendChild(el('div', { class: 'sync-warn' }, [
      el('b', { text: '⚠ הדף הזה נטען מהאינטרנט (https), ולכן אינו יכול לפנות למחשבים שברשת המקומית.' }),
      el('div', { text: 'זו חסימת אבטחה של הדפדפן, לא תקלה. הפתרון: פתח את הדשבורד ישירות מהכתובת של ' +
                        'המחשב ברשת — היא מופיעה בגרסת המחשב תחת "סנכרון". משם הסנכרון עובד מלא, ' +
                        'וגם אפשר להתקין את האפליקציה לטלפון.' })
    ]));
  }

  const list = el('div', { style: 'display:flex;flex-direction:column;gap:8px' });
  const draw = () => {
    list.innerHTML = '';
    const remotes = Sync.remotes();
    if (!remotes.length){
      list.appendChild(el('div', { class: 'empty-note',
        text: 'אין עדיין מחשבים מוגדרים. הוסף מחשב לכל רשת קבועה — למשל בית וסטודיו.' }));
    }
    remotes.forEach(r => {
      list.appendChild(el('div', { class: 'sync-remote-row' }, [
        el('div', { class: 'grow' }, [
          el('div', { class: 'ttl', text: r.name || 'מחשב' }),
          el('div', { class: 'meta', text: `${r.host}:${r.port}` +
            (r.lastAt ? ' · סנכרון אחרון: ' + new Date(r.lastAt).toLocaleString('he-IL') : ' · טרם סונכרן') })
        ]),
        el('button', { class: 'btn sm', title: 'סנכרון מיידי מול המחשב הזה', onclick: async () => {
          const res = await Sync.runOne(r, { manual: true });
          if (res === 'ok') toast('הסתנכרן עם ' + (r.name || 'המחשב'));
          else if (res === 'unreachable') toast((r.name || 'המחשב') + ' לא נמצא ברשת הנוכחית');
          draw();
        } }, '🔄'),
        el('button', { class: 'btn sm', onclick: () => openRemoteEditor(r) }, '✎ עריכה')
      ]));
    });
  };
  draw();
  body.appendChild(list);
  body.appendChild(el('button', { class: 'add-row', onclick: () => openRemoteEditor(null) }, '＋ הוספת מחשב'));
  body.appendChild(el('div', { class: 'hint',
    text: 'לכל מחשב יש אסימון וכתובת משלו — מוצאים אותם בגרסת המחשב, בהגדרות ← סנכרון ברשת המקומית. ' +
          'האפליקציה בודקת בכל רגע איזה מהמחשבים המוכרים נמצא איתך באותה רשת, ומסתנכרנת מולו — בלי שתצטרך לבחור.' }));

  openModal('סנכרון ברשת המקומית', body, [ el('button', { class: 'btn', onclick: closeModal }, 'סגירה') ]);
}

/** הוספה/עריכה של מחשב יחיד ברשימת הסנכרון */
/** existing=null להוספה. חוזר תמיד אל מסך הרשימה (openModal מחליף תוכן על אותו modal פתוח —
    אין צורך ב-closeModal() בין המסכים, וזה מונע "היעלמות" של הדיאלוג באמצע פעולה). */
function openRemoteEditor(existing){
  const isNew = !existing;
  const r = existing ? Object.assign({}, existing) :
    { id: uid(), name: '', host: '', port: 8790, token: '', auto: true, everyMin: 5, lastAt: 0 };

  const nm = el('input', { type: 'text', value: r.name, placeholder: 'למשל: בית / סטודיו' });
  const host = el('input', { type: 'text', value: r.host, placeholder: '192.168.1.20', dir: 'ltr' });
  const port = el('input', { type: 'number', value: r.port || 8790, placeholder: '8790', dir: 'ltr' });
  const token = el('input', { type: 'text', value: r.token, placeholder: 'האסימון מגרסת המחשב', dir: 'ltr' });
  const auto = mkSwitch(r.auto !== false, v => { r.auto = v; });
  const every = mkSelect([[2, 'כל 2 דקות'], [5, 'כל 5 דקות'], [15, 'כל רבע שעה'], [60, 'כל שעה']],
    r.everyMin || 5, v => { r.everyMin = Number(v); });
  const status = el('div', { class: 'hint',
    text: existing && existing.lastAt ? 'סנכרון אחרון: ' + new Date(existing.lastAt).toLocaleString('he-IL')
                                       : 'טרם סונכרן' });

  const grab = () => {
    r.name = nm.value.trim();
    r.host = host.value.trim();
    r.port = Number(port.value) || 8790;
    r.token = token.value.trim();
  };

  openModal(isNew ? 'מחשב חדש' : 'עריכת ' + (existing.name || 'מחשב'), [
    field('שם — לזיהוי בלבד', nm),
    el('div', { class: 'field-row' }, [ field('כתובת ברשת', host), field('פורט', port) ]),
    field('אסימון חיבור', token),
    el('div', { class: 'field-row' }, [
      el('div', { class: 'field' }, [ el('label', { text: 'סנכרון אוטומטי כשהמחשב נמצא ברשת' }), auto ]),
      field('תדירות בדיקה', every)
    ]),
    status
  ], [
    el('button', { class: 'btn', onclick: async () => {
      grab();
      status.textContent = 'בודק…';
      const p = await Sync.pingRemote(r);
      status.textContent = p ? `✅ נמצא: ${p.hostname} (גרסה ${p.version})` : '❌ אין מענה בכתובת הזו כרגע';
    } }, '🔌 בדיקת חיבור'),
    el('button', { class: 'btn primary', onclick: async () => {
      grab();
      if (!r.host || !r.token){ toast('נא למלא כתובת ואסימון'); return; }
      if (!r.name) r.name = 'מחשב ' + (Sync.remotes().length + 1);
      if (isNew) Sync.addRemote(r); else Sync.updateRemote(r.id, r);
      const res = await Sync.runOne(r, { manual: true });
      if (res === 'ok') toast('הסתנכרן עם ' + r.name);
      else if (res === 'unreachable') toast(r.name + ' נשמר — יסתנכרן כשתהיה איתו באותה רשת');
      openSyncSetup();
    } }, 'שמירה וסנכרון'),
    !isNew ? el('button', { class: 'btn danger', onclick: () => {
      if (!confirm('להסיר את "' + (existing.name || 'המחשב') + '" מרשימת הסנכרון?')) return;
      Sync.removeRemote(existing.id);
      openSyncSetup();
    } }, 'הסרה') : null,
    el('button', { class: 'btn', onclick: openSyncSetup }, 'ביטול')
  ]);
}

/* ---------------- מסך הסתירות ---------------- */
function openConflictDialog(remote, conflicts, merged, theirs){
  const choice = {};                       // id → 'mine' | 'theirs' | 'both'
  conflicts.forEach(c => { choice[c.scope + '|' + c.id] = 'mine'; });
  const whom = remote.name || 'המחשב';

  const body = el('div', { style: 'display:flex;flex-direction:column;gap:11px' });
  body.appendChild(el('div', { class: 'hint',
    text: `נמצאו ${conflicts.length} פריטים ששונו גם כאן וגם ב${whom}. בחר מה לשמור בכל אחד. ` +
          'שום דבר לא נכתב עד שתאשר, ושם נשמר גיבוי לפני הכתיבה.' }));

  const bulk = el('div', { class: 'filters' }, [
    el('button', { class: 'btn sm', onclick: () => setAll('mine') }, 'הכול שלי'),
    el('button', { class: 'btn sm', onclick: () => setAll('theirs') }, 'הכול מהמחשב'),
    el('button', { class: 'btn sm', onclick: () => setAll('both') }, 'לשמור את שניהם')
  ]);
  body.appendChild(bulk);

  const list = el('div', { class: 'imp-scroll', style: 'display:flex;flex-direction:column;gap:8px' });
  const rows = [];
  conflicts.forEach(c => {
    const key = c.scope + '|' + c.id;
    const canBoth = c.kind === 'item' || c.kind === 'day';
    const mk = (val, label, text) => {
      const b = el('button', { class: 'cf-opt', onclick: () => { choice[key] = val; paint(); } }, [
        el('div', { class: 'cf-lbl', text: label }),
        el('div', { class: 'cf-txt', text: text })
      ]);
      b.dataset.val = val;
      return b;
    };
    const opts = [
      mk('mine', '📱 מה שיש כאן', (c.summary && c.summary.mine) || '—'),
      mk('theirs', '💻 מה שיש ב' + whom, (c.summary && c.summary.theirs) || '—')
    ];
    if (canBoth) opts.push(mk('both', '➕ לשמור את שניהם',
      c.kind === 'day' ? 'הפגישות והמשימות מהשניים יאוחדו' : 'ייווצר עותק נוסף'));
    const row = el('div', { class: 'cf-row' }, [
      el('div', { class: 'cf-head', text: c.label }),
      el('div', { class: 'cf-opts' }, opts)
    ]);
    rows.push({ c, key, row, opts });
    list.appendChild(row);
  });
  body.appendChild(list);

  const paint = () => rows.forEach(r => r.opts.forEach(o =>
    o.classList.toggle('on', choice[r.key] === o.dataset.val)));
  const setAll = v => { rows.forEach(r => {
    if (v === 'both' && !r.opts.some(o => o.dataset.val === 'both')) choice[r.key] = 'mine';
    else choice[r.key] = v;
  }); paint(); };
  paint();

  openModal('בחירה בין גרסאות — ' + whom, body, [
    el('button', { class: 'btn primary', onclick: async () => {
      const out = JSON.parse(JSON.stringify(merged));
      conflicts.forEach(c => {
        const v = choice[c.scope + '|' + c.id];
        applyConflictChoice(out, c, v);
      });
      closeModal();
      Sync.busy = false;
      try {
        await Sync.commitTo(remote, out);
        Sync.paintChip('מסונכרן: ' + whom);
        toast('הסתנכרן עם ' + whom);
      } catch(e){ alert('הכתיבה נכשלה: ' + (e.message || e)); }
    } }, 'אישור וסנכרון'),
    el('button', { class: 'btn', onclick: () => { closeModal(); Sync.busy = false; Sync.paintChip(''); } },
      'ביטול')
  ]);
}

/** מחיל בחירה אחת על החבילה הממוזגת */
function applyConflictChoice(bundle, c, v){
  const raw = bundle[c.key];
  if (c.kind === 'raw'){ if (v === 'theirs') bundle[c.key] = c.theirs; return; }
  let db; try { db = JSON.parse(raw); } catch(e){ return; }

  if (c.kind === 'day'){
    if (v === 'theirs') db.days[c.id] = c.theirs;
    else if (v === 'both'){
      const a = JSON.parse(JSON.stringify(c.mine)), b = c.theirs;
      const sig = x => JSON.stringify(x);
      const have = new Set((a.appts || []).map(sig));
      (b.appts || []).forEach(x => { if (x && !have.has(sig(x))) (a.appts = a.appts || []).push(x); });
      const haveT = new Set((a.todos || []).map(t => (t && t.t) || ''));
      (b.todos || []).forEach(t => { if (t && !haveT.has(t.t || '')) (a.todos = a.todos || []).push(t); });
      if ((b.notes || '').trim() && b.notes !== a.notes)
        a.notes = [(a.notes || '').trim(), b.notes.trim()].filter(Boolean).join('\n— — —\n');
      sortAppts(a.appts);
      db.days[c.id] = a;
    }
  } else if (c.kind === 'item'){
    const arr = db[c.scope] || (db[c.scope] = []);
    const i = arr.findIndex(x => x && x.id === c.id);
    if (v === 'theirs'){ if (i >= 0) arr[i] = c.theirs; else arr.push(c.theirs); }
    else if (v === 'both'){
      const copy = JSON.parse(JSON.stringify(c.theirs));
      copy.id = uid();
      const nm = copy.title !== undefined ? 'title' : copy.name !== undefined ? 'name' : null;
      if (nm) copy[nm] = (copy[nm] || '') + ' (מהמחשב)';
      arr.push(copy);
    }
  } else if (c.kind === 'setting'){
    if (v === 'theirs') (db.settings = db.settings || {})[c.id] = c.theirs;
  } else if (c.kind === 'period'){
    if (v === 'theirs') (db[c.scope] = db[c.scope] || {})[c.id] = c.theirs;
  }
  bundle[c.key] = JSON.stringify(db);
}

/** אילו שנים/חודשים דרושים לתצוגה הנוכחית */
function neededData(){
  const S = DB.settings, c = State.cursor;
  const years = new Set([c.getFullYear()]);
  const months = new Set();
  const addMonth = d => months.add(`${d.getFullYear()}-${pad2(d.getMonth() + 1)}`);

  if (State.view === 'day' || State.view === 'agenda' || State.view === 'tasks'){ addMonth(c); }
  if (State.view === 'agenda'){
    const end = addDays(c, DB.settings.agendaDays || 21);
    years.add(end.getFullYear()); addMonth(end);
  }
  if (State.view === 'week'){
    const s = startOfWeek(c), e = addDays(s, 6);
    years.add(s.getFullYear()); years.add(e.getFullYear());
    addMonth(s); addMonth(e);
  }
  if (State.view === 'month'){
    if (S.monthCalendar === 'hebrew'){
      const h = hebOf(c);
      const a = dateFromHeb(h.y, h.m, 1), b = dateFromHeb(h.y, h.m, daysInHebMonth(h.m, h.y));
      years.add(a.getFullYear()); years.add(b.getFullYear());
    } else {
      const a = new Date(c.getFullYear(), c.getMonth(), 1);
      years.add(a.getFullYear());
    }
  }
  if (State.view === 'year'){
    if (S.yearCalendar === 'hebrew'){
      const hy = hebOf(c).y;
      years.add(rdToGregorian(hebrewToRD(hy, 7, 1)).y);
      years.add(rdToGregorian(hebrewToRD(hy, 6, 29)).y);
    }
  }
  return { years: [...years], months: [...months] };
}

let _fetching = false;
async function refreshData(force){
  if (_fetching) return;
  const need = neededData();
  const missingYears  = need.years.filter(y => force || !CACHE.events['y' + y]);
  const missingMonths = need.months.filter(m => force || !CACHE.zmanim[m]);
  if (!missingYears.length && !missingMonths.length){
    pumpNet(NET_STATE === 'offline' ? 'cache' : 'live');
    return;
  }
  _fetching = true;
  let ok = false;
  try {
    for (const y of missingYears) if (await getYearEvents(y)) ok = true;
    for (const m of missingMonths){
      const [gy, gm] = m.split('-').map(Number);
      if (await getMonthZmanim(gy, gm)) ok = true;
    }
  } finally { _fetching = false; }
  if (ok) renderAll(true);
  else pumpNet('offline');
}

function step(dir){
  const S = DB.settings, c = State.cursor;
  if (State.view === 'day' || State.view === 'tasks') State.cursor = addDays(c, dir);
  if (State.view === 'agenda') State.cursor = addDays(c, dir * (S.agendaDays || 21));
  if (State.view === 'week') State.cursor = addDays(c, dir * 7);
  if (State.view === 'month'){
    if (S.monthCalendar === 'hebrew'){
      const h = hebOf(c);
      let m = h.m, y = h.y;
      const order = hebMonthOrder(y);
      let idx = order.indexOf(m) + dir;
      if (idx < 0){ y -= 1; const o = hebMonthOrder(y); m = o[o.length - 1]; }
      else if (idx >= order.length){ y += 1; m = 7; }
      else m = order[idx];
      const len = daysInHebMonth(m, y);
      State.cursor = dateFromHeb(y, m, Math.min(h.d, len));
    } else {
      const d = new Date(c.getFullYear(), c.getMonth() + dir, 1);
      const len = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      d.setDate(Math.min(c.getDate(), len));
      State.cursor = d;
    }
  }
  if (State.view === 'year'){
    if (S.yearCalendar === 'hebrew'){
      const h = hebOf(c), y = h.y + dir;
      const m = (h.m === 13 && !isHebrewLeapYear(y)) ? 12 : h.m;
      State.cursor = dateFromHeb(y, m, Math.min(h.d, daysInHebMonth(m, y)));
    } else {
      const d = new Date(c.getTime()); d.setFullYear(c.getFullYear() + dir);
      State.cursor = d;
    }
  }
  renderAll();
}

  $('#paletteInput').addEventListener('input', e => { PALETTE_SEL = 0; renderPalette(e.target.value); });
  $('#paletteInput').addEventListener('keydown', e => {
    if (e.key === 'ArrowDown'){ PALETTE_SEL++; renderPalette(e.target.value); e.preventDefault(); }
    if (e.key === 'ArrowUp'){ PALETTE_SEL = Math.max(0, PALETTE_SEL - 1); renderPalette(e.target.value); e.preventDefault(); }

      const c = PALETTE_ITEMS[PALETTE_SEL];

    }
  });
  document.addEventListener('fullscreenchange', paintFullscreenBtn);

  setupInstall();

  $('#pomoStart').addEventListener('click', () => Pomo.toggle());
  $('#pomoReset').addEventListener('click', () => Pomo.reset());
  $('#pomoClose').addEventListener('click', () => Pomo.close());

  // זיהוי עט: מסמן את המסמך ברגע שנוגע עט כלשהו, לצורך דחיית כף יד
  document.addEventListener('pointerdown', e => {
    if (e.pointerType === 'pen'){
      PEN_SEEN_AT = Date.now();
      document.body.classList.add('pen-active');
      const st = $('#penStatus');
      if (st) st.textContent = 'זוהה עט פעיל במכשיר הזה ✓';
    }
  }, true);

  document.addEventListener('keydown', e => {
    const ctrl = e.ctrlKey || e.metaKey;
    if (ctrl && (e.key === 'k' || e.key === 'ל')){ e.preventDefault(); openSearch(); return; }
    if (ctrl && (e.key === 'n' || e.key === 'מ')){ e.preventDefault(); openQuickAdd(); return; }
    if (ctrl && (e.key === 's' || e.key === 'ד')){ e.preventDefault(); exportData(); markBackupDone(); return; }
    if (ctrl && (e.key === 'p' || e.key === 'פ')){ e.preventDefault(); openPalette(); return; }
    if (ctrl && (e.key === 'z' || e.key === 'ז') && !e.shiftKey){ e.preventDefault(); History.undo(); return; }
    if (ctrl && ((e.key === 'y' || e.key === 'ט') || ((e.key === 'z' || e.key === 'ז') && e.shiftKey))){
      e.preventDefault(); History.redo(); return;
    }
    if (e.key === 'Escape'){
      if ($('#wallScreen').classList.contains('open')){ Wall.close(); return; }
      if ($('#focusScreen').classList.contains('open')){ Focus.close(); return; }
      closeModal(); closeSearch(); closePalette(); closeDrawer();
    }
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
    if (e.key === '?'){ openShortcuts(); return; }
    if (e.key === 'e' || e.key === 'ק'){ LayoutEdit.toggle(); return; }
    if (e.key === 'w' || e.key === '׳'){ Wall.open(); return; }
    if (e.key === 'd' || e.key === 'ג'){ Split.toggle(); return; }
    if (e.key === 'g' || e.key === 'ע'){ Focus.open(); return; }
    if (e.key === 'ArrowRight'){ step(-1); e.preventDefault(); }
    if (e.key === 'ArrowLeft'){  step(1);  e.preventDefault(); }
    if (e.key === 't' || e.key === 'ט'){ State.cursor = new Date(); State.cursor.setHours(0,0,0,0); renderAll(); }
    if (e.key === 'f' || e.key === 'כ'){ toggleFullscreen(); }
    const map = { '1': 'day', '2': 'week', '3': 'month', '4': 'year', '5': 'agenda', '6': 'tasks' };
    if (map[e.key]) setView(map[e.key]);
  });

  window.addEventListener('online',  () => refreshData(true));
  window.addEventListener('offline', () => pumpNet('offline'));
  window.addEventListener('beforeunload', () => {
    try {
      pruneDB();
      DB.meta.updated = new Date().toISOString();
      // כשהנעילה פעילה לא כותבים גרסה גלויה — השמירה המוצפנת כבר רצה
      if (!(typeof Lock !== 'undefined' && Lock.key))
        localStorage.setItem(storeKey(), JSON.stringify(DB));
    } catch(e){}
  });
}

function init(){
  loadProfiles();

  /* ---------------------------------------------------------------
     הנעילה בסיסמה בוטלה לחלוטין (החלטת מתי, 6.9.2026).
     האפליקציה לא תנעל את עצמה לעולם, וגם מנקה שאריות של נעילה ישנה.
     אם נשארו נתונים מוצפנים מגרסה קודמת — משחזרת אותם לבד.
     --------------------------------------------------------------- */
  let autoRestored = false;
  try {
    localStorage.removeItem('planner_lock_v1');
    const raw = localStorage.getItem(storeKey());
    if (isEncRaw(raw)){
      const v = allVersions().find(x => !isEncRaw(x.data));
      if (v){
        localStorage.setItem(storeKey(), v.data);
        autoRestored = new Date(v.at).toLocaleString('he-IL');
      } else {
        openRescuePanel();      // אין ממה לשחזר — נותנים לו את מסך החילוץ
        return;
      }
    }
  } catch(e){}

  // כתובת עם ?rescue=1 פותחת את מסך החילוץ, ועם ?reset=1 מתחילה נקי
  try {
    const qs = new URLSearchParams(location.search);
    if (qs.has('reset')){ openRescuePanel(true); return; }
    if (qs.has('rescue')){ openRescuePanel(); return; }
  } catch(e){}

  bootAfterUnlock();
  if (autoRestored) setTimeout(() => toast('הנתונים שוחזרו אוטומטית מגרסה מ-' + autoRestored), 900);
}

async function bootAfterUnlock(){
  loadDB();
  // חייבים לפענח לפני כל פעולה שכותבת, אחרת נשמור בטעות מסד ריק על הנתונים
  if (Lock.key) await decryptIntoDB();
  pruneDB();
  syncFollowUps();
  syncCollections();
  loadCache();
  loadWeatherCache();
  applyTheme();
  applyAppName();
  paintProfileChip();
  wireUI();
  _prevState = JSON.stringify(DB);
  History.paint();
  // קיצורי דרך של האפליקציה המותקנת: ?view=day|week|month|year|agenda|tasks
  let startView = 'day';
  try {
    const v = new URLSearchParams(location.search).get('view');
    if (['day', 'week', 'month', 'year', 'agenda', 'tasks'].includes(v)) startView = v;
  } catch(e){}
  setView(startView);
  Notif.start();
  Pomo.reset();
  paintFullscreenBtn();
  setupSwipe();
  /* --- V4 --- */
  applyDensity();
  applyUndoDepth();
  wireQuickAddButton();
  applyAutoDark();
  setInterval(applyAutoDark, 5 * 60000);
  ClockWatch.start();          // מעבר שעון קיץ/חורף ומעבר יום — אוטומטי
  Sync.start();                // סנכרון ברשת המקומית
  checkBackupReminder();
  setInterval(updateNowLines, 60000);
  loadWeather().then(m => { if (m) renderAll(true); });
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')){
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        if (!w) return;
        w.addEventListener('statechange', () => {
          if (w.state === 'installed' && navigator.serviceWorker.controller)
            toast('גרסה חדשה מוכנה — רענן את הדף');
        });
      });
    }).catch(() => {});
  }
}
