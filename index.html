const GREG_MONTHS_SHORT = ['ינו','פבר','מרץ','אפר','מאי','יונ','יול','אוג','ספט','אוק','נוב','דצמ'];

const HEBREW_EPOCH = -1373427;

  const y1 = y - 1;

  return { y: year, m: month, d: day };

const _nyCache = new Map();
function hebNewYearRD(year){
  if (_nyCache.has(year)) return _nyCache.get(year);
  const v = HEBREW_EPOCH + hebElapsedDays(year) + hebYearCorrection(year);
  _nyCache.set(year, v); return v;
}
const daysInHebYear = y => hebNewYearRD(y + 1) - hebNewYearRD(y);
const longCheshvan  = y => daysInHebYear(y) % 10 === 5;
const shortKislev   = y => daysInHebYear(y) % 10 === 3;

function daysInHebMonth(month, year){
  if (month === 2 || month === 4 || month === 6 || month === 10 || month === 13) return 29;
  if (month === 12 && !isHebrewLeapYear(year)) return 29;
  if (month === 8 && !longCheshvan(year)) return 29;
  if (month === 9 && shortKislev(year)) return 29;
  return 30;
}
function hebrewToRD(y, m, d){
  let rd = hebNewYearRD(y) + d - 1;
  if (m < 7){
    const last = lastMonthOfHebYear(y);
    for (let mm = 7; mm <= last; mm++) rd += daysInHebMonth(mm, y);
    for (let mm = 1; mm < m;   mm++) rd += daysInHebMonth(mm, y);
  } else {
    for (let mm = 7; mm < m; mm++) rd += daysInHebMonth(mm, y);
  }
  return rd;
}
function rdToHebrew(rd){
  let year = Math.floor((rd - HEBREW_EPOCH) / 366);
  while (hebNewYearRD(year + 1) <= rd) year++;
  let month = (rd < hebrewToRD(year, 1, 1)) ? 7 : 1;
  while (rd > hebrewToRD(year, month, daysInHebMonth(month, year))) month++;
  return { y: year, m: month, d: rd - hebrewToRD(year, month, 1) + 1 };
}

const HEB_MONTH_NAMES = { 1:'ניסן', 2:'אייר', 3:'סיוון', 4:'תמוז', 5:'אב', 6:'אלול',
                          7:'תשרי', 8:'חשוון', 9:'כסלו', 10:'טבת', 11:'שבט', 12:'אדר', 13:'אדר ב׳' };
const hebMonthName = (m, y) => (m === 12 && isHebrewLeapYear(y)) ? 'אדר א׳' : HEB_MONTH_NAMES[m];

/* סדר חודשים לתצוגה שנתית עברית: תשרי → אלול */
function hebMonthOrder(hy){
  const out = [7, 8, 9, 10, 11, 12];
  if (isHebrewLeapYear(hy)) out.push(13);
  return out.concat([1, 2, 3, 4, 5, 6]);
}

const _GEM_H = [[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק']];
const _GEM_T = [[90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],[10,'י']];
const _GEM_O = [[9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']];
function gematriya(num){
  let n = num >= 1000 ? num % 1000 : num, out = '';
  for (const [v, l] of _GEM_H) while (n >= v){ out += l; n -= v; }
  if (n === 15){ out += 'טו'; n = 0; } else if (n === 16){ out += 'טז'; n = 0; }
  for (const [v, l] of _GEM_T) while (n >= v){ out += l; n -= v; }
  for (const [v, l] of _GEM_O) while (n >= v){ out += l; n -= v; }
  if (out.length === 1) return out + '׳';
  if (out.length > 1)   return out.slice(0, -1) + '״' + out.slice(-1);
  return out;
}

/** תאריך עברי מלא לתאריך לועזי (אובייקט Date) */
function hebOf(date){
  const h = rdToHebrew(gregorianToRD(date.getFullYear(), date.getMonth() + 1, date.getDate()));
  h.mName = hebMonthName(h.m, h.y);
  h.dLabel = gematriya(h.d);
  h.yLabel = gematriya(h.y);
  h.full = `${h.dLabel} ב${h.mName} ${h.yLabel}`;
  h.short = `${h.dLabel} ${h.mName}`;
  return h;
}
/** תאריך לועזי (Date) מתאריך עברי */
function dateFromHeb(hy, hm, hd){
  const g = rdToGregorian(hebrewToRD(hy, hm, hd));
  return new Date(g.y, g.m - 1, g.d);
}

/** מיון פגישות לפי שעה — פגישות עם שעה עולות לפי סדר היום,
    ופגישות בלי שעה (יום שלם, או שורה ריקה חדשה) יורדות לסוף.
    בלי זה פגישה של 16:00 שיובאה ראשונה הופיעה מעל אחת של 08:30. */
function sortAppts(arr){
  if (!Array.isArray(arr)) return arr;
  const key = a => {
    const m = /^(\d{1,2}):(\d{2})$/.exec((a && a.time) || '');
    return m ? (+m[1] * 60 + +m[2]) : 1e6;
  };
  arr.sort((a, b) => key(a) - key(b));
  return arr;
}

  // בלוק מוצפן אינו נתונים — בלי השורה הזו הוא ייקרא כאובייקט ריק והנתונים "ייעלמו"
  if (raw && raw.indexOf('{"enc":1') === 0) raw = null;
  let parsed = {};
  if (raw){ try { parsed = JSON.parse(raw); } catch(e){ parsed = {}; } }
  DB = deepDefaults(parsed, DEFAULTS);
  // תאימות: הרגלים חייבים להיות מערך לא ריק
  if (!Array.isArray(DB.settings.habits) || !DB.settings.habits.length)
    DB.settings.habits = DEFAULTS.settings.habits.slice();
  // תאימות V1 → V2
  if (!Array.isArray(DB.cats) || !DB.cats.length) DB.cats = DEFAULT_CATS.map(c => Object.assign({}, c));
  ['events', 'recurring', 'templates', 'contacts',
   'weekTemplates', 'jobs', 'finance', 'timeLogs', 'bigGoals', 'trash',
   'docs', 'gearLists', 'layers', 'zmanReminders',
   'leads', 'priceItems', 'crew', 'azkarot', 'checklists']
    .forEach(k => { if (!Array.isArray(DB[k])) DB[k] = []; });
  if (!DB.availability || typeof DB.availability !== 'object') DB.availability = {};
  if (!DB.settings.docCounters) DB.settings.docCounters = { quote: 1, contract: 1, invoice: 1, receipt: 1 };
  if (!DB.settings.layout || typeof DB.settings.layout !== 'object') DB.settings.layout = {};
  if (!DB.importLog || typeof DB.importLog !== 'object') DB.importLog = {};
  for (const rec of Object.values(DB.days)){
    (rec.todos || []).forEach(t => {
      if (!t) return;
      if (t.cat === undefined) t.cat = '';

      if (!Array.isArray(t.sub)) t.sub = [];

  /* אירועים אישיים מגרסאות קודמות: המונח "יארצייט" הוחלף ב"אזכרה" (מנהג עדות המזרח) */
  DB.events.forEach(e => { if (e && e.type === 'yahrzeit') e.type = 'azkara'; });
  DB.finance.forEach(f => { if (f && f.jobId === undefined) f.jobId = ''; });
  /* ברירת המחדל הישנה לצאת שבת (42 דק׳) הייתה חומרה של מנהג אשכנז.
     מי שלא שינה אותה ידנית מקבל 30 — המקובל למנהג עדות המזרח בארץ. */
  if (DB.meta.version < 4 && DB.settings.havdalahMinutes === 42 &&
      (DB.settings.minhag || 'edot') === 'edot')
    DB.settings.havdalahMinutes = 30;
  /* V4.4: כרטיס "אזכרות וימי הולדת" פוצל לשני כרטיסים נפרדים. אם היה מותאם אישית
     (מיקום או הסתרה) בפריסת תצוגת היום — שני הכרטיסים החדשים יורשים אותה הגדרה. */
  if (DB.settings.layout && Array.isArray(DB.settings.layout.day)){
    const list = DB.settings.layout.day;
    const i = list.findIndex(w => w && w.id === 'anniv');
    if (i >= 0){
      const old = list[i];
      list.splice(i, 1, { id: 'azkarot', on: old.on, col: old.col }, { id: 'birthdays', on: old.on, col: old.col });
    }
  }
  DB.meta.version = 4;
}
function deepDefaults(obj, defs){
  const out = Array.isArray(defs) ? (Array.isArray(obj) ? obj.slice() : defs.slice()) : {};
  if (Array.isArray(defs)) return out;
  for (const k of Object.keys(defs)){
    const dv = defs[k], ov = obj ? obj[k] : undefined;
    if (dv && typeof dv === 'object' && !Array.isArray(dv))
      out[k] = deepDefaults(ov && typeof ov === 'object' ? ov : {}, dv);
    else out[k] = (ov === undefined) ? (Array.isArray(dv) ? dv.slice() : dv) : ov;
  }
  if (obj) for (const k of Object.keys(obj)) if (!(k in out)) out[k] = obj[k];
  return out;
}
let _prevState = null;
function persistNow(){
  DB.meta.updated = new Date().toISOString();
  try { localStorage.setItem(storeKey(), JSON.stringify(DB)); return true; }
  catch(e){ toast('שגיאת שמירה — ייתכן שהאחסון מלא'); return false; }
}
const saveDB = debounce(() => {
  const cur = JSON.stringify(DB);
  if (_prevState !== null && _prevState !== cur) History.push(_prevState);
  _prevState = cur;
  if (typeof Lock !== 'undefined' && Lock.key) persistEncrypted(); else persistNow();
  maybeAutoBackup();
}, 350);

/* ------------------------ ביטול וביצוע חוזר ------------------------ */
const History = {
  undoStack: [], redoStack: [], max: 40, applying: false,
  push(state){
    if (this.applying) return;
    this.undoStack.push(state);
    if (this.undoStack.length > this.max) this.undoStack.shift();
    this.redoStack.length = 0;
    this.paint();
  },
  apply(state, msg){
    this.applying = true;
    DB = deepDefaults(JSON.parse(state), DEFAULTS);
    _prevState = state;
    persistNow();
    invalidateContactCache(); _evCache.key = null;
    applyTheme(); renderAll(true);
    if ($('#drawer').classList.contains('open')) renderSettings();
    this.applying = false;
    this.paint();
    toast(msg);
  },
  undo(){
    if (!this.undoStack.length){ toast('אין מה לבטל'); return; }
    this.redoStack.push(JSON.stringify(DB));
    this.apply(this.undoStack.pop(), 'הפעולה בוטלה');
  },
  redo(){
    if (!this.redoStack.length){ toast('אין מה לשחזר'); return; }
    this.undoStack.push(JSON.stringify(DB));
    this.apply(this.redoStack.pop(), 'הפעולה שוחזרה');
  },
  paint(){
    const u = $('#btnUndo'), r = $('#btnRedo');
    if (u){ u.disabled = !this.undoStack.length; u.style.opacity = this.undoStack.length ? '' : '.4'; }
    if (r){ r.disabled = !this.redoStack.length; r.style.opacity = this.redoStack.length ? '' : '.4'; }
  }
};

function trashRestore(item){

  switch (item.kind){
    case 'todo':    (c.bucket === 'day' ? dayW(c.iso).todos : periodW(c.bucket, c.key).todos).push(d); break;

function writeVersions(list){

  catch(e){
    // אם האחסון מלא — מוותרים על הגרסה הישנה ביותר ומנסים שוב
    if (list.length > 1){ list.pop(); return writeVersions(list); }

function makeVersion(manual){

  if (list.length && list[0].data === snap && !manual) return false;
  list.unshift({ at: Date.now(), size: snap.length, manual: !!manual, data: snap });
  while (list.length > 10) list.pop();
  writeVersions(list);
  return true;
}

/* ===================== 4. שכבת נתוני Hebcal + מטמון ===================== */
let CACHE = { loc: '', events: {}, zmanim: {} };
function loadCache(){
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if (raw) CACHE = Object.assign({ loc:'', events:{}, zmanim:{} }, JSON.parse(raw));
  } catch(e){ /* מתעלמים */ }
  if (CACHE.loc !== locKey()) CACHE = { loc: locKey(), events: {}, zmanim: {} };
}
/** שומרים רק את השנים והחודשים הקרובים לתאריך שבו עובדים, כדי שהמטמון לא יתפח */
function trimCache(){
  const cy = State.cursor.getFullYear();
  const years = Object.keys(CACHE.events);
  if (years.length > 4){
    years.sort((a, b) => Math.abs(Number(a.slice(1)) - cy) - Math.abs(Number(b.slice(1)) - cy));
    years.slice(4).forEach(k => delete CACHE.events[k]);
  }
  const months = Object.keys(CACHE.zmanim);
  if (months.length > 24){
    months.sort();
    months.slice(0, months.length - 24).forEach(k => delete CACHE.zmanim[k]);
  }
}
const saveCache = debounce(() => {
  try { trimCache(); localStorage.setItem(CACHE_KEY, JSON.stringify(CACHE)); }
  catch(e){ /* מטמון מלא — לא קריטי, הנתונים ייטענו שוב מהרשת */ }
}, 900);

function locKey(){
  const L = DB.settings.location, S = DB.settings;
  return `${L.lat.toFixed(3)},${L.lon.toFixed(3)},${S.candleMinutes},${S.havdalahMinutes},${S.israelScheme ? 'il' : 'gl'}`;
}
let NET_STATE = 'idle'; // idle | live | cache | offline

/** אירועי שנה לועזית שלמה: חגים, פרשות, נרות, הבדלה — לפי תאריך */
async function getYearEvents(gy){
  const key = 'y' + gy;
  if (CACHE.events[key]) { pumpNet(CACHE.events[key]._live ? 'live' : 'cache'); return CACHE.events[key].byDate; }
  const L = DB.settings.location, S = DB.settings;
  const url = 'https://www.hebcal.com/hebcal?v=1&cfg=json&maj=on&min=on&mod=on&nx=on&ss=on&mf=on&s=on&c=on&d=off&o=on&F=on'
    + `&year=${gy}&month=x&geo=pos&latitude=${L.lat}&longitude=${L.lon}&tzid=${encodeURIComponent(L.tz)}`
    + `&b=${S.candleMinutes}&M=off&m=${S.havdalahMinutes}&lg=h${S.israelScheme ? '&i=on' : ''}`;
  busy(true);
  try {
    const res = await fetch(url, { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const byDate = {};
    for (const it of (json.items || [])){
      const d = String(it.date).slice(0, 10);
      const rec = {
        cat: it.category,
        sub: it.subcat || '',
        yomtov: !!it.yomtov,
        title: it.hebrew || it.title,
        time: (String(it.date).length > 10) ? String(it.date).slice(11, 16) : '',
        memo: it.memo || '',
        link: it.link || ''
      };
      if (it.omer && it.omer.count) rec.omer = it.omer.count.he || it.omer.count.n;
      if (it.category === 'dafyomi') rec.memo = '';
      (byDate[d] = byDate[d] || []).push(rec);
    }
    CACHE.events[key] = { byDate, _live: true, at: Date.now() };
    saveCache(); pumpNet('live');
    return byDate;
  } catch(e){
    pumpNet('offline');
    return null;
  } finally { busy(false); }
}

const ZMAN_KEYS = ['alotHaShachar','misheyakir','sunrise','sofZmanShma','sofZmanShmaMGA',
                   'sofZmanTfilla','sofZmanTfillaMGA','chatzot','minchaGedola','minchaKetana',
                   'plagHaMincha','sunset','tzeit7083deg','tzeit85deg','chatzotNight'];

/** זמני היום לחודש שלם (קריאה אחת) */
async function getMonthZmanim(gy, gm){
  const key = `${gy}-${pad2(gm)}`;
  if (CACHE.zmanim[key]) return CACHE.zmanim[key];
  const L = DB.settings.location;
  const last = new Date(gy, gm, 0).getDate();
  const url = 'https://www.hebcal.com/zmanim?cfg=json'
    + `&latitude=${L.lat}&longitude=${L.lon}&tzid=${encodeURIComponent(L.tz)}`
    + `&start=${gy}-${pad2(gm)}-01&end=${gy}-${pad2(gm)}-${pad2(last)}`;
  busy(true);
  try {
    const res = await fetch(url, { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    const byDate = {};
    for (const zk of ZMAN_KEYS){
      const series = json.times[zk]; if (!series) continue;
      for (const [d, v] of Object.entries(series)){
        (byDate[d] = byDate[d] || {})[zk] = String(v).slice(11, 16);
      }
    }
    CACHE.zmanim[key] = byDate; saveCache(); pumpNet('live');
    return byDate;
  } catch(e){ pumpNet('offline'); return null; }
  finally { busy(false); }
}

function pumpNet(state){
  NET_STATE = state;
  const chip = $('#syncChip'); if (!chip) return;
  const map = {
    live:    ['● נתונים מעודכנים', ''],
    cache:   ['◍ מטמון מקומי', 'muted'],
    offline: ['○ לא מקוון', 'warn'],
    idle:    ['◌ טוען…', 'muted']
  };
  const [txt, cls] = map[state] || map.idle;
  chip.textContent = txt;
  chip.className = 'chip ' + cls;
  chip.title = state === 'offline'
    ? 'אין חיבור ל-Hebcal — מוצגים נתונים מהמטמון בלבד. תאריכים עבריים מחושבים מקומית ותמיד זמינים.'
    : 'מקור: Hebcal · ' + DB.settings.location.name;
}

/** אירועי יום בודד (מהמטמון אם קיים) */
function eventsForISO(iso){
  const gy = Number(iso.slice(0, 4));
  const rec = CACHE.events['y' + gy];
  return (rec && rec.byDate[iso]) ? rec.byDate[iso] : [];
}
function zmanimForISO(iso){
  const rec = CACHE.zmanim[iso.slice(0, 7)];
  return (rec && rec[iso]) ? rec[iso] : null;
}
/** קריאת התורה של השבת הקרובה. כשיום טוב חל בשבת — Hebcal אינו מתייג פרשה,
    ולכן מוחזרת הקריאה של אותו יום טוב, מסומנת כ-isParasha=false. */
function parashaForWeek(date){
  const sat = addDays(startOfWeek(date), 6);
  const evs = eventsForISO(isoOf(sat));
  const p = evs.find(e => e.cat === 'parashat');
  if (p) return { name: p.title.replace(/^פרשת\s+/, ''), isParasha: true };
  const yt = evs.find(e => e.yomtov || (e.cat === 'holiday' && e.sub === 'major'));
  return yt ? { name: yt.title, isParasha: false } : null;
}
const parashaLabel = p => p ? (p.isParasha ? 'פרשת ' + p.name : 'קריאת השבת: ' + p.name) : '';

function holidaysForISO(iso){
  return eventsForISO(iso).filter(e => e.cat === 'holiday' || e.cat === 'roshchodesh');
}
/** 2 = יום טוב / חג / צום (רקע מלא) · 1 = ציון משני (נקודה בלבד) · 0 = יום רגיל */
function dayMarkLevel(iso){
  const evs = eventsForISO(iso);
  if (evs.some(e => e.yomtov || (e.cat === 'holiday' && (e.sub === 'major' || e.sub === 'fast')))) return 2;
  if (evs.some(e => e.cat === 'roshchodesh' || e.cat === 'holiday')) return 1;
  return 0;
}
const isMajorHoliday = iso => dayMarkLevel(iso) === 2;

/* ============================ 5. מצב תצוגה ============================ */
const State = { view: 'day', cursor: new Date() };
State.cursor.setHours(0, 0, 0, 0);

/* ====================== 6. עזרי בנייה לשדות עריכה ====================== */
function dayW(iso){ if (!DB.days[iso]) DB.days[iso] = DAY_DEFAULT(); return DB.days[iso]; }
function periodW(bucket, key){ if (!DB[bucket][key]) DB[bucket][key] = PERIOD_DEFAULT(); return DB[bucket][key]; }

function mkLine(val, ph, on, cls){
  const i = el('input', { class: 'line-input' + (cls ? ' ' + cls : ''), type: 'text',
                          value: val || '', placeholder: ph || '' });
  i.addEventListener('input', () => { on(i.value); saveDB(); });
  return i;
}
function mkArea(val, ph, on, cls){
  const t = el('textarea', { class: 'area' + (cls ? ' ' + cls : ''), placeholder: ph || '' });
  t.value = val || '';
  t.addEventListener('input', () => { on(t.value); saveDB(); });
  return t;
}
function card(title, cls, kids, headActions){
  const h = el('h3', { text: title });
  if (headActions) h.appendChild(el('span', { class: 'h-actions' }, headActions));
  return el('div', { class: 'card' + (cls ? ' ' + cls : '') }, [ h, el('div', { class: 'body' }, kids) ]);
}

/** רשימת משימות: תיבות סימון, קטגוריה, הערכת זמן, תת-משימות וגרירה
    opts = { rich, bucket:'day'|'weeks'|'months'|…, key, iso, onChange } */
function mkTodoList(getArr, ph, minRows, opts){
  opts = opts || {};
  const wrap = el('div');
  const open = new Set();
  const draw = () => {
    wrap.innerHTML = '';
    const arr = getArr();
    const rows = Math.max(arr.length, minRows || 0);
    for (let i = 0; i < rows; i++){
      if (!arr[i]) arr[i] = TODO_DEFAULT();
      const item = arr[i];
      if (!Array.isArray(item.sub)) item.sub = [];
      if (opts.rich && (item.t || '').trim() && !passesFilter(item)) continue;

      const box = el('div', { class: 'todo-item' });
      const chk = el('input', { class: 'chk', type: 'checkbox', checked: item.d });
      const inp = mkLine(item.t, ph, v => { item.t = v; });
      const main = el('div', { class: 'todo-main' });

      if (opts.rich){
        const handle = el('span', { class: 'drag-handle', title: 'גרירה ליום או לשעה אחרת', text: '⠿' });
        makeDraggable(handle, box, { kind: 'todo', item, bucket: opts.bucket || 'day',
                                     iso: opts.iso, key: opts.key, text: item.t });
        main.appendChild(handle);
      }
      main.appendChild(chk);
      if (opts.rich) main.appendChild(catDot(() => item.cat, v => { item.cat = v; }));
      main.appendChild(inp);
      if (opts.rich){
        const blocker = todoBlocked(item);
        if (blocker){
          box.classList.add('blocked');
          main.insertBefore(el('span', { class: 'lock-ic', title: 'ממתין ל: ' + blocker.t.t, text: '🔒' }), inp);
        }
        tagsOf(item.t).forEach(t => main.appendChild(el('span', { class: 'tag-pill', text: '#' + t })));
        const m = micButton(inp);
        if (m) main.appendChild(m);
      }

      if (opts.rich){
        const est = el('input', { class: 'est-input', type: 'number', min: '0', step: '5',
          inputmode: 'numeric', value: item.est || '', placeholder: '––', title: 'הערכת זמן בדקות' });
        const estWrap = el('div', { class: 'est-wrap' + (item.est ? ' set' : ''),
          title: 'הערכת זמן בדקות' }, [ est, el('span', { class: 'est-unit', text: 'דק׳' }) ]);
        est.addEventListener('input', () => {
          item.est = Number(est.value) || 0; saveDB();
          estWrap.classList.toggle('set', !!item.est);
          if (opts.onChange) opts.onChange();
        });
        main.appendChild(estWrap);
        const st = el('button', { class: 'sub-toggle',
          text: item.sub.length ? `▾ ${item.sub.filter(s => s.d).length}/${item.sub.length}` : '＋תת',
          title: 'תת-משימות',
          onclick: () => { open.has(item) ? open.delete(item) : open.add(item);
                           if (!item.sub.length) item.sub.push({ t: '', d: false });
                           saveDB(); draw(); } });
        main.appendChild(st);
      }
      /* V4: דחיית משימה ליום אחר בלחיצה */
      if (opts.rich && (item.t || '').trim() && !item.d)
        main.appendChild(el('button', { class: 'sub-toggle', title: 'דחייה ליום אחר',
          onclick: () => openSnooze(item, { bucket: opts.bucket || 'day', iso: opts.iso, key: opts.key },
                                    () => { draw(); renderAll(true); }) }, '⏭'));
      main.appendChild(el('button', { class: 'del', title: 'מחיקה',
        onclick: () => {
          if ((item.t || '').trim())
            trashPush('todo', item.t, item, { bucket: opts.bucket || 'day', iso: opts.iso, key: opts.key });
          arr.splice(arr.indexOf(item), 1); saveDB(); draw(); if (opts.onChange) opts.onChange();
        } }, '✕'));

      chk.addEventListener('change', () => {
        item.d = chk.checked;
        item.doneAt = chk.checked ? Date.now() : 0;
        saveDB();
        box.classList.toggle('done', chk.checked);
        main.classList.toggle('done', chk.checked);
        inp.style.textDecoration = chk.checked ? 'line-through' : '';
        inp.style.color = chk.checked ? 'var(--ink-soft)' : '';
        if (opts.onChange) opts.onChange();
      });
      if (item.d){ inp.style.textDecoration = 'line-through'; inp.style.color = 'var(--ink-soft)'; }

      box.appendChild(main);

      if (opts.rich && item.sub.length){
        const doneCount = item.sub.filter(s => s.d && (s.t || '').trim()).length;
        const totalCount = item.sub.filter(s => (s.t || '').trim()).length;
        if (totalCount) box.appendChild(el('div', { class: 'progress-mini' },
          el('i', { style: `width:${Math.round(100 * doneCount / totalCount)}%` })));
        if (open.has(item)){
          const sl = el('div', { class: 'sub-list' });
          sl.appendChild(el('div', { class: 'sub-row' }, [
            el('span', { style: 'font-size:.76em;color:var(--ink-soft)', text: 'לקוח' }),
            contactPicker(() => item.who, v => { item.who = v; }),
            item.who ? el('button', { class: 'btn sm ghost', title: 'כרטיס לקוח',
              onclick: () => openClientCard(item.who) }, '👤') : null,
            el('button', { class: 'btn sm ghost', title: 'תלות במשימה אחרת',
              onclick: () => pickDependency(item, opts.iso, draw) },
              item.dep ? '🔗 תלות' : '🔗')
          ]));
          item.sub.forEach((s, si) => {
            const sc = el('input', { class: 'chk', type: 'checkbox', checked: s.d });
            sc.addEventListener('change', () => { s.d = sc.checked; saveDB(); draw(); });
            sl.appendChild(el('div', { class: 'sub-row' }, [
              sc, mkLine(s.t, 'תת-משימה…', v => { s.t = v; }),
              el('button', { class: 'del', onclick: () => { item.sub.splice(si, 1); saveDB(); draw(); } }, '✕')
            ]));
          });
          sl.appendChild(el('button', { class: 'add-row', style: 'margin-top:4px',
            onclick: () => { item.sub.push({ t: '', d: false }); saveDB(); draw(); } }, '＋ תת-משימה'));
          box.appendChild(sl);
        }
      }
      wrap.appendChild(box);
    }
    wrap.appendChild(el('button', { class: 'add-row', onclick: () => {
      getArr().push(TODO_DEFAULT()); saveDB(); draw();
      const ins = wrap.querySelectorAll('.todo-main .line-input');
      if (ins.length) ins[ins.length - 1].focus();
    } }, '＋ הוספת שורה'));
  };
  draw();
  wrap.redraw = draw;
  return wrap;
}

/** משימות קבועות (חוזרות) ליום נתון */
function recurringSection(iso){
  const date = fromISO(iso), rules = recurringFor(date);
  if (!rules.length) return null;
  const box = el('div');
  rules.forEach(r => {
    if (!passesFilter(r)) return;
    const w = () => dayW(iso);
    const on = !!((dayRec(iso, false).recDone || {})[r.id]);
    const chk = el('input', { class: 'chk', type: 'checkbox', checked: on });
    chk.addEventListener('change', () => {
      const d = w(); d.recDone = d.recDone || {}; d.recDone[r.id] = chk.checked; saveDB();
      row.classList.toggle('done', chk.checked);
    });
    const c = catById(r.cat);
    const row = el('div', { class: 'row' + (on ? ' done' : '') }, [
      chk,
      el('span', { class: 'cat-dot' + (c ? '' : ' none'), style: c ? 'background:' + c.color : '',
                   title: c ? c.name : '' }),
      el('span', { text: r.title, style: 'flex:1' }),
      el('span', { style: 'font-size:.72em;color:var(--ink-soft)', text: FREQ_LABEL[r.freq] || '' })
    ]);
    box.appendChild(row);
  });
  return box.children.length ? box : null;
}

/** סיכום עומס יומי מול שעות פנויות */
function estSummary(iso){
  const r = dayRec(iso, false);
  const todoMin = (r.todos || []).filter(t => t && !t.d).reduce((a, t) => a + (Number(t.est) || 0), 0);
  const recMin = recurringFor(fromISO(iso))
    .filter(x => !((r.recDone || {})[x.id])).reduce((a, x) => a + (Number(x.est) || 0), 0);
  const total = todoMin + recMin;
  if (!total) return null;
  const cap = (DB.settings.workHours || 8) * 60;
  const over = total > cap;
  const h = Math.floor(total / 60), m = total % 60;
  return el('div', { class: 'est-summary' + (over ? ' over' : '') }, [
    el('span', { text: over ? '⚠ עומס יתר' : 'זמן מתוכנן' }),
    el('span', { html: `<b>${h}:${pad2(m)}</b> שעות מתוך <b>${DB.settings.workHours}</b>` })
  ]);
}

/** שלושה יעדים ממוספרים */
function mkGoals(arr, ph){
  const wrap = el('div');
  for (let i = 0; i < 3; i++){
    if (arr[i] === undefined) arr[i] = '';
    wrap.appendChild(el('div', { class: 'row' }, [
      el('span', { class: 'num-badge', text: String(i + 1) }),
      mkLine(arr[i], ph || '', v => { arr[i] = v; })
    ]));
  }
  return wrap;
}

/** רשימת שעות ללוח היום */
function slotList(){
  const S = DB.settings, out = [];
  for (let h = S.dayStart; h <= S.dayEnd; h++){
    out.push(pad2(h) + ':00');
    if (S.slotMinutes === 30 && h < S.dayEnd) out.push(pad2(h) + ':30');
  }
  return out;
}

/* ======================= 7. רצועת מידע וכותרת הדפסה ======================= */
function dateHeadline(d){
  const S = DB.settings, h = hebOf(d);
  const greg = `${d.getDate()} ב${GREG_MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  if (S.calMode === 'greg')   return { main: greg, sub: '' };
  if (S.calMode === 'hebrew') return { main: h.full, sub: '' };
  return { main: greg, sub: h.full };
}

function renderInfoStrip(){
  const strip = $('#infoStrip'); strip.innerHTML = '';
  const d = State.cursor, iso = isoOf(d), h = hebOf(d);
  const add = (cls, html, title) => strip.appendChild(el('span', { class: 'chip ' + cls, html, title: title || '' }));

  add('hd', `${DOW_LONG[d.getDay()]} · <b>${h.full}</b>`);

  const par = parashaForWeek(d);
  if (par) add('', par.isParasha ? `פרשת השבוע: <b>${par.name}</b>` : `קריאת השבת: <b>${par.name}</b>`);

  holidaysForISO(iso).slice(0, 3).forEach(e => add('holiday', `<b>${e.title}</b>`, e.memo));

  const cand = eventsForISO(iso).find(e => e.cat === 'candles');
  if (cand) add('shabbat', `הדלקת נרות <b dir="ltr">${cand.time}</b>`, cand.memo);
  const havd = eventsForISO(iso).find(e => e.cat === 'havdalah');
  if (havd) add('shabbat', `הבדלה <b dir="ltr">${havd.time}</b>`);

  const z = zmanimForISO(iso);
  if (z && z.sunrise && z.sunset)
    add('muted', `זריחה <b dir="ltr">${z.sunrise}</b> · שקיעה <b dir="ltr">${z.sunset}</b>`);

  // אחרי השקיעה כבר התחיל היום העברי הבא — הבהרה, לא שינוי אוטומטי
  if (z && z.sunset && sameISO(d, new Date())){
    const now = new Date(), [sh, sm] = z.sunset.split(':').map(Number);
    if (now.getHours() * 60 + now.getMinutes() >= sh * 60 + sm){
      const hn = hebOf(addDays(d, 1));
      add('warn', `אחרי השקיעה — כבר <b>${hn.short}</b>`, 'התאריך העברי מתחלף בשקיעה; התצוגה מוצמדת ליום הלועזי.');
    }
  }

  const L = DB.settings.location;
  add('muted', `📍 ${L.name}` + (L.source === 'gps' ? ' (מיקום המכשיר)' : ''));
  strip.appendChild(el('span', { class: 'chip muted', id: 'syncChip', text: '◌' }));
  pumpNet(NET_STATE);
}

/* ============================= 8. תצוגת יום ============================= */
const ZMAN_LABELS = {
  alotHaShachar: 'עלות השחר', misheyakir: 'משיכיר', sunrise: 'הנץ החמה',
  sofZmanShma: 'סוף זמן ק״ש (גר״א)', sofZmanShmaMGA: 'סוף זמן ק״ש (מג״א)',
  sofZmanTfilla: 'סוף זמן תפילה (גר״א)', sofZmanTfillaMGA: 'סוף זמן תפילה (מג״א)',
  chatzot: 'חצות היום', minchaGedola: 'מנחה גדולה', minchaKetana: 'מנחה קטנה',
  plagHaMincha: 'פלג המנחה', sunset: 'שקיעה', tzeit7083deg: 'צאת הכוכבים', chatzotNight: 'חצות הלילה'
};
function zmanimOrder(){
  const n = DB.settings.zmanimNusach;
  const base = ['alotHaShachar', 'misheyakir', 'sunrise'];
  if (n === 'mga')       base.push('sofZmanShmaMGA', 'sofZmanTfillaMGA');
  else if (n === 'both') base.push('sofZmanShma', 'sofZmanShmaMGA', 'sofZmanTfilla', 'sofZmanTfillaMGA');
  else                   base.push('sofZmanShma', 'sofZmanTfilla');
  return base.concat(['chatzot', 'minchaGedola', 'plagHaMincha', 'sunset', 'tzeit7083deg']);
}

function renderDay(){
  const v = $('#view-day'); v.innerHTML = '';
  const d = State.cursor, iso = isoOf(d), h = hebOf(d);
  const rec = dayRec(iso, false);
  const S = DB.settings;

  /* --- כותרת --- */
  const evs = eventsForISO(iso);
  const chips = el('div', { class: 'nav-group', style: 'flex-wrap:wrap;gap:6px' });
  holidaysForISO(iso).forEach(e => chips.appendChild(el('span', { class: 'chip holiday', text: e.title, title: e.memo })));
  const par = parashaForWeek(d);
  if (par) chips.appendChild(el('span', { class: 'chip', html:
    par.isParasha ? `פרשת <b>${par.name}</b>` : `קריאת השבת <b>${par.name}</b>` }));
  const cnd = evs.find(e => e.cat === 'candles');
  if (cnd) chips.appendChild(el('span', { class: 'chip shabbat', html: `🕯 הדלקת נרות <b dir="ltr">${cnd.time}</b>` }));
  const wx = wxChip(iso);
  if (wx) chips.appendChild(el('span', { class: 'chip' }, wx));
  const qp = quietPeriod(iso);   // V4: ימי ספירה / בין המצרים / סליחות
  if (qp) chips.appendChild(el('span', { class: 'chip qp-badge ' + qp.cls, text: qp.name,
    title: 'לפי מנהג ' + ((DB.settings.minhag || 'edot') === 'edot' ? 'עדות המזרח' : 'אשכנז'),
    style: 'cursor:pointer', onclick: openQuietPeriods }));
  const nextEv = upcomingPersonalEvents(d, 120)[0];
  if (nextEv && nextEv.days > 0)
    chips.appendChild(el('span', { class: 'chip', title: 'האירוע האישי הקרוב',
      html: `<span class="countdown">בעוד <b>${nextEv.days}</b> ימים · ${eventTitleFor(nextEv)}</span>` }));

  const title = el('div', { class: 'day-title' });
  if (S.calMode !== 'hebrew'){
    title.appendChild(el('div', { class: 'greg', text: `${DOW_LONG[d.getDay()]}, ${d.getDate()} ב${GREG_MONTHS[d.getMonth()]}` }));
    title.appendChild(el('div', { class: 'sub', text: String(d.getFullYear()) }));
  }
  if (S.calMode !== 'greg'){
    const cls = S.calMode === 'hebrew' ? 'greg' : 'hebr';
    title.insertBefore(el('div', { class: cls, text: h.full }), S.calMode === 'hebrew' ? null : title.children[1] || null);
    if (S.calMode === 'hebrew') title.appendChild(el('div', { class: 'sub', text: DOW_LONG[d.getDay()] }));
  }
  v.appendChild(el('div', { class: 'day-head' }, [ title, chips ]));

  /* ------------------------ ווידג׳טים של תצוגת יום ------------------------ */
  const colFull = el('div');
  const col1 = el('div', { class: 'day-col' });
  const col2 = el('div', { class: 'day-col' });
  const col3 = el('div', { class: 'day-col' });

  const builders = {};

  /* זמני היום */
  builders.zmanim = () => {
    const z = zmanimForISO(iso);
    const strip = el('div', { class: 'zmanim-strip' });
    if (z){
      const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
      const isToday = sameISO(d, new Date());
      zmanimOrder().forEach(k => {
        if (!z[k]) return;
        const [hh, mm] = z[k].split(':').map(Number);
        const soon = isToday && Math.abs(hh * 60 + mm - nowMin) <= 30;
        strip.appendChild(el('div', { class: 'zman' + (soon ? ' hl' : '') }, [
          el('span', { class: 'k', text: ZMAN_LABELS[k] || k }),
          el('span', { class: 'v', text: z[k] })
        ]));
      });
    } else {
      strip.appendChild(el('div', { class: 'empty-note', style: 'grid-column:1/-1',
        text: 'זמני היום לא נטענו — נדרש חיבור לאינטרנט בפעם הראשונה לכל חודש.' }));
    }
    return strip;
  };

  /* לוח זמנים */
  builders.schedule = () => {
    const list = el('div', { class: 'sched-list' });
    const nowSlot = sameISO(d, new Date()) ? pad2(new Date().getHours()) + ':00' : null;
    const step = S.slotMinutes;
    /* פגישות ועבודות משובצות לשעה שלהן, כדי שמה שיובא מהיומן ייראה בלוח עצמו */
    const timed = [];
    (rec.appts || []).forEach(a => {
      if (a && (a.what || '').trim() && toMin(a.time) != null)
        timed.push({ min: toMin(a.time), label: a.what, sub: [a.where, a.end ? 'עד ' + a.end : ''].filter(Boolean).join(' · '),
                     note: a.note, kind: 'appt' });
    });
    jobsForISO(iso).forEach(j => {
      if (toMin(j.time) != null)
        timed.push({ min: toMin(j.time), label: '📷 ' + (j.title || ''), sub: contactName(j.who), kind: 'job' });
    });
    slotList().forEach(t => {
      const half = t.endsWith(':30');
      const slotMin = toMin(t);
      const here = timed.filter(x => x.min >= slotMin && x.min < slotMin + step);
      const handle = el('span', { class: 'drag-handle', text: '⠿', title: 'גרירה לשעה אחרת' });
      const inp = mkLine((rec.schedule || {})[t], '', val => { const w = dayW(iso); (w.schedule = w.schedule || {})[t] = val; });
      const row = el('div', { class: 'sched-row' + (half ? ' half' : '') + (t === nowSlot ? ' now' : '') }, [
        el('span', { class: 't', text: t }), handle, inp
      ]);
      if (((rec.schedule || {})[t] || '').trim())
        makeDraggable(handle, row, { kind: 'slot', iso, slot: t, text: (rec.schedule || {})[t] });
      makeDropTarget(row, dragged => {
        const text = dragged.kind === 'todo' ? (dragged.item.t || '')
                   : dragged.kind === 'appt' ? [dragged.item.what, dragged.item.where].filter(Boolean).join(' · ')
                   : (dragged.text || '');
        if (!text.trim()) return;
        removeDragSource(dragged);
        const w = dayW(iso); w.schedule = w.schedule || {};
        w.schedule[t] = (w.schedule[t] || '').trim() ? w.schedule[t] + ' · ' + text : text;
        saveDB(); renderAll(true);
      });
      list.appendChild(row);
      here.forEach(x => list.appendChild(el('div', { class: 'sched-row' }, [
        el('span', { class: 't', text: '' }),
        el('span', {
          class: 'layer-chip',
          style: `background:${x.kind === 'job' ? 'var(--c5)' : 'var(--accent-soft)'};` +
                 `color:${x.kind === 'job' ? 'var(--c5i)' : 'var(--accent-ink)'};` +
                 'flex:1;justify-content:flex-start;font-size:.76em;padding:2px 8px',
          text: pad2(Math.floor(x.min / 60)) + ':' + pad2(x.min % 60) + ' · ' + x.label +
                (x.sub ? ' · ' + x.sub : ''),

      ])));

    return card('לוח זמנים', 'c1', list, [

    mkGoals(dayW(iso).goals, 'היעד שיעשה את ההבדל היום…'));

  /* משימות */
  builders.todos = () => {
    const todoBody = el('div');

      todoBody.innerHTML = '';
      todoBody.appendChild(catFilterBar(drawTodos));

        todoBody.appendChild(el('div', { class: 'wd-section-label', text: 'משימות קבועות' }));

        todoBody.appendChild(el('div', { class: 'wd-section-label', text: 'משימות היום', style: 'margin-top:6px' }));

      const es = estSummary(iso);
      if (es) todoBody.appendChild(es);
    };
    drawTodos();
    const todoCard = card('רשימת משימות', 'c3', todoBody, [

      const text = dragged.kind === 'todo' ? (dragged.item.t || '') : (dragged.text || '');

      const copy = dragged.kind === 'todo' ? JSON.parse(JSON.stringify(dragged.item))
                                           : Object.assign(TODO_DEFAULT(), { t: text });
      removeDragSource(dragged);
      dayW(iso).todos.push(Object.assign(TODO_DEFAULT(), copy));
      saveDB(); renderAll(true);
    });
    return todoCard;
  };

  /* פגישות */
  builders.appts = () => {
    const appts = el('div');
    const drawAppts = () => {
      appts.innerHTML = '';
      const arr = sortAppts(dayW(iso).appts);
      if (!arr.length) arr.push(APPT_DEFAULT());
      const conflicts = apptConflicts(iso);
      arr.forEach((a, i) => {
        ['end', 'note', 'who', 'uid', 'url'].forEach(k => { if (a[k] === undefined) a[k] = ''; });
        const handle = el('span', { class: 'drag-handle', text: '⠿', title: 'גרירה ללוח הזמנים' });
        const open = { on: !!(a.note || a.who) };
        const row = el('div', { class: 'row' }, [
          handle,
          mkLine(a.time, 'שעה', val => { a.time = val; drawAppts(); }, 'ltr-num'),
          mkLine(a.end, 'עד', val => { a.end = val; drawAppts(); }, 'ltr-num'),
          mkLine(a.what, 'פגישה / אירוע', val => { a.what = val; }),
          mkLine(a.where, 'מיקום', val => { a.where = val; }),
          conflicts.has(a) ? el('span', { class: 'conflict', title: 'חופף לפגישה אחרת', text: '⚠' }) : null,
          el('button', { class: 'sub-toggle', title: 'לקוח והערות',
            text: open.on ? '▾' : '＋', onclick: () => { open.on = !open.on; more.style.display = open.on ? '' : 'none'; } }),
          el('button', { class: 'del', onclick: () => {
            trashPush('appt', a.what || 'פגישה', a, { iso });
            arr.splice(i, 1); saveDB(); drawAppts();
          } }, '✕')
        ]);
        const noteA = el('textarea', { class: 'area', placeholder: 'הערות, משתתפים, פרטים…', style: 'min-height:52px' });
        noteA.value = a.note || '';
        noteA.addEventListener('input', () => { a.note = noteA.value; saveDB(); });
        const more = el('div', { class: 'sub-list', style: open.on ? '' : 'display:none' }, [
          el('div', { class: 'row' }, [
            el('span', { style: 'font-size:.78em;color:var(--ink-soft)', text: 'לקוח' }),
            contactPicker(() => a.who, v => { a.who = v; }),
            a.who ? el('button', { class: 'btn sm ghost', title: 'כרטיס לקוח',
              onclick: () => openClientCard(a.who) }, '👤') : null
          ]),
          noteA,
          a.url ? el('a', { href: a.url, target: '_blank', rel: 'noopener',
            style: 'font-size:.78em;color:var(--accent-ink)', text: '🔗 קישור מהיומן' }) : null
        ]);
        if ((a.what || '').trim()) makeDraggable(handle, row, { kind: 'appt', iso, item: a, text: a.what });
        appts.appendChild(el('div', {}, [ row, more ]));
      });
      appts.appendChild(el('button', { class: 'add-row',
        onclick: () => { dayW(iso).appts.push(APPT_DEFAULT()); saveDB(); drawAppts(); } }, '＋ פגישה'));
      if (conflicts.size) appts.appendChild(el('div', { class: 'est-summary over' }, [
        el('span', { text: '⚠ חפיפה בין פגישות' }),
        el('span', { html: `<b>${conflicts.size}</b> פגישות חופפות` })
      ]));
    };
    drawAppts();
    return card('פגישות ואירועים', 'c1', appts, [
      el('button', { class: 'btn sm ghost', title: 'ייבוא מיומן גוגל או אאוטלוק', onclick: importCalendarFiles }, '📥')

  /* אנשי קשר */

  /* הערות */

  /* הרגלים */
  builders.habits = () => {

      }

    const MOODS = ['😄', '🙂', '😐', '😕', '😞'];
    const moods = el('div', { class: 'mood-row' });
    const drawMood = () => {
      moods.innerHTML = '';
      const cur = dayRec(iso, false).mood || '';
      MOODS.forEach(m => moods.appendChild(el('button', { class: 'mood' + (cur === m ? ' on' : ''),
        onclick: () => { const w = dayW(iso); w.mood = (w.mood === m) ? '' : m; saveDB(); drawMood(); } }, m)));
    };
    drawMood();

    const energy = el('div', { class: 'mood-row' });
    const drawEnergy = () => {
      energy.innerHTML = '';
      const cur = dayRec(iso, false).energy || 0;
      for (let i = 1; i <= 5; i++)
        energy.appendChild(el('button', { class: 'mood' + (i <= cur ? ' on' : ''), title: 'רמת אנרגיה ' + i,
          onclick: () => { const w = dayW(iso); w.energy = (w.energy === i) ? 0 : i; saveDB(); drawEnergy(); } }, '⚡'));
    };

    return card('מים, מצב רוח ואנרגיה', 'c2', [
      el('div', { class: 'wd-section-label', text: 'שתיית מים' }), drops,
      el('div', { class: 'wd-section-label', text: 'מצב רוח', style: 'margin-top:8px' }), moods,
      el('div', { class: 'wd-section-label', text: 'רמת אנרגיה', style: 'margin-top:8px' }), energy,
      el('div', { class: 'wd-section-label', text: 'הכרת תודה', style: 'margin-top:8px' }),
      mkLine(rec.gratitude, 'על מה אני מודה היום…', val => { dayW(iso).gratitude = val; })
    ]);
  };

  /* עבודות היום */
  builders.jobs = () => {
    const box = el('div');
    const draw = () => {
      box.innerHTML = '';
      const list = jobsForISO(iso);
      if (!list.length) box.appendChild(el('div', { class: 'empty-note', text: 'אין עבודות ליום הזה' }));
      list.forEach(j => {
        const st = jobStatus(j.status);
        box.appendChild(el('div', { class: 'row' }, [
          el('span', { class: 'pill-status ' + st.cls, text: st.name }),
          el('span', { style: 'flex:1', text: j.title || '(ללא שם)' }),
          j.who ? el('button', { class: 'btn sm ghost', title: 'כרטיס לקוח',
            onclick: () => openClientCard(j.who) }, '👤') : null,
          gearFor(j.kind) ? el('button', { class: 'btn sm ghost', title: 'טעינת רשימת ציוד',
            onclick: () => loadGearForJob(j) }, '📋') : null,
          el('button', { class: 'btn sm ghost', title: 'הפקת הצעת מחיר',
            onclick: () => {
              const d = DOC_DEFAULT();
              d.kind = 'quote'; d.number = nextDocNumber('quote'); d.who = j.who; d.jobId = j.id;
              d.vat = 18; d.terms = DB.settings.business.terms || '';
              d.items = [{ desc: j.title || 'שירותי צילום', qty: 1, price: j.price || 0 }];
              DB.docs.push(d); saveDB(); editDoc(d, () => renderAll(true));
            } }, '🧾'),
          el('button', { class: 'btn sm ghost', onclick: () => openJobEditor(j, () => renderAll(true)) }, '✎')
        ]));
      });
      box.appendChild(el('button', { class: 'add-row', onclick: () =>
        openJobEditor(Object.assign(JOB_DEFAULT(), { iso }), () => renderAll(true)) }, '＋ עבודה'));
    };
    draw();
    return card('עבודות היום', 'c5', box, [
      el('button', { class: 'btn sm ghost', title: 'מרכז הסטודיו', onclick: () => openBusiness('jobs') }, '💼')
    ]);

  /* יעדים מדידים */
  builders.goals2 = () => card('יעדים מדידים', 'c2', goalsCard());

  /* כספים */
  builders.finance = () => card('הכנסות והוצאות', 'c3', financeCard(iso), [
    el('button', { class: 'btn sm ghost', title: 'סיכומים', onclick: () => openBusiness('finance') }, '💰')
  ]);

  /* זמינות ושכבות */
  builders.avail = () => {
    const box = el('div');
    const drawAv = () => {
      box.innerHTML = '';
      const cur = availOf(iso);
      const row = el('div', { class: 'nav-group', style: 'flex-wrap:wrap;gap:6px' });
      [['', 'ללא סימון'], ['busy', 'תפוס'], ['tentative', 'אופציה'], ['free', 'פנוי']]
        .forEach(([k, name]) => row.appendChild(el('button', {
          class: 'cat-pill', 'aria-pressed': String(cur === k),
          onclick: () => { if (k) DB.availability[iso] = k; else delete DB.availability[iso];
                           saveDB(); drawAv(); renderAll(true); } },
          [ k ? el('i', { class: AVAIL[k][1], style: 'width:8px;height:8px;border-radius:50%;display:block' }) : null,
            el('span', { text: name }) ])));
      box.appendChild(el('div', { class: 'wd-section-label', text: 'זמינות היום' }));
      box.appendChild(row);
      const ls = layersForISO(iso);
      if (ls.length){
        box.appendChild(el('div', { class: 'wd-section-label', text: 'שכבות', style: 'margin-top:8px' }));
        const lb = el('div', { class: 'nav-group', style: 'flex-wrap:wrap;gap:5px' });
        ls.forEach(x => lb.appendChild(el('span', { class: 'layer-chip',
          style: `background:${x.layer.color};color:#fff`, text: x.label })));
        box.appendChild(lb);

    };
    drawAv();
    return card('זמינות ושכבות', 'c1', box, [
      el('button', { class: 'btn sm ghost', title: 'שכבות תאריכים', onclick: openLayers }, '🏷')
    ]);
  };

  /* מסמכים של היום */
  builders.docs = () => {
    const box = el('div');
    const rows = DB.docs.filter(d => d.iso === iso);
    if (!rows.length) box.appendChild(el('div', { class: 'empty-note', text: 'אין מסמכים בתאריך הזה' }));
    rows.forEach(d => {
      const st = DOC_STATUS[d.status] || DOC_STATUS.draft;
      box.appendChild(el('div', { class: 'row' }, [
        el('span', { class: 'doc-status ' + st[1], text: st[0] }),
        el('span', { style: 'flex:1', text: `${DOC_KINDS[d.kind].name} ${d.number}` }),
        el('span', { class: 'money', text: money(Math.round(docTotals(d).total)) }),
        el('button', { class: 'btn sm ghost', onclick: () => editDoc(d, () => renderAll(true)) }, '✎')
      ]));

    box.appendChild(el('button', { class: 'add-row', onclick: () => openDocs() }, '＋ כל המסמכים'));
    return card('מסמכים', 'c3', box, [
      el('button', { class: 'btn sm ghost', title: 'מסמכים', onclick: () => openDocs() }, '🧾')
    ]);
  };

  /* קבצים והקלטות */
  /* --- V4 --- */
  builders.deliveries = () => card('מסירות קרובות', 'c5', deliveriesCard(), [
    el('button', { class: 'btn sm ghost', title: 'כל העבודות', onclick: () => openBusiness('jobs') }, '💼')
  ]);
  /* --- V4.4: אזכרות וימי הולדת בכרטיסים נפרדים, כל אחד עם ניהול משלו --- */
  builders.azkarot = () => {
    const box = el('div');
    const today = hebAnnivForISO(iso).filter(a => a.kind === 'azkara');
    const soon = azkarotUpcoming();
    if (!today.length && !soon.length)
      box.appendChild(el('div', { class: 'empty-note', text: 'אין אזכרות קרובות' }));
    today.forEach(a => box.appendChild(el('div', { class: 'anniv-row' }, [
      el('span', { class: 'ic', text: '🕯' }),
      el('b', { text: a.name || '—' }),
      el('span', { class: 'hint', text: 'אזכרה — היום' })
    ])));
    soon.forEach(a => box.appendChild(el('div', { class: 'anniv-row', style: 'opacity:.72' }, [
      el('span', { class: 'ic', text: '🕯' }),
      el('span', { text: a.name || '—' }),
      el('span', { class: 'hint', text: `בעוד ${a.inDays} ימים` })
    ])));
    return card('אזכרות', 'c1', box, [
      el('button', { class: 'btn sm ghost', title: 'ניהול אזכרות', onclick: openAzkarot }, '🕯')
    ]);
  };
  builders.birthdays = () => {
    const box = el('div');
    const today = hebAnnivForISO(iso).filter(a => a.kind === 'bday');
    const soon = birthdaysUpcoming(DB.settings.bdayRemindDays || 3)
      .filter(a => a.inDays > 0 && a.iso !== iso);
    if (!today.length && !soon.length)
      box.appendChild(el('div', { class: 'empty-note', text: 'אין ימי הולדת קרובים' }));
    today.forEach(a => box.appendChild(el('div', { class: 'anniv-row' }, [
      el('span', { class: 'ic', text: '🎂' }),
      el('b', { text: a.name || '—' }),
      el('span', { class: 'hint', text: a.years ? `יום הולדת ${a.years}` : 'יום הולדת — היום' })
    ])));
    soon.forEach(a => box.appendChild(el('div', { class: 'anniv-row', style: 'opacity:.72' }, [
      el('span', { class: 'ic', text: '🎂' }),
      el('span', { text: a.name || '—' }),
      el('span', { class: 'hint', text: `בעוד ${a.inDays} ימים` })
    ])));
    return card('ימי הולדת', 'c4', box, [
      el('button', { class: 'btn sm ghost', title: 'עריכת יום הולדת דרך כרטיס איש הקשר', onclick: openContacts }, '👥')
    ]);
  };
  builders.onthisday = () => card('היום לפני שנה', 'c4', onThisDayCard(iso));

  builders.files = () => card('קבצים מצורפים', 'c6', filesCard(iso));
  builders.voice = () => card('הערות קוליות', 'c4', voiceCard(iso));

  if (!S.showZmanim) delete builders.zmanim;
  placeWidgets('day', builders, { 0: colFull, 1: col1, 2: col2, 3: col3 });

  /* V4: אזהרות שצריך לראות לפני הכול — נסיעה בין עבודות וגשם בצילום חוץ */
  const warns = el('div');
  travelWarnings(iso).forEach(w => {
    warns.appendChild(el('div', { class: 'travel-warn' }, [
      el('span', { text: '🚗' }),
      el('span', { html: `מ<b>${w.from.label}</b> ל<b>${w.to.label}</b> יש ` +
        `<bdi dir="ltr">${w.gap}</bdi> דק׳ בלבד, והנסיעה לוקחת <bdi dir="ltr">${w.need}</bdi>` })
    ]));
  });
  jobsForISO(iso).forEach(j => {
    const chip = rainChipFor(j);
    if (chip) warns.appendChild(el('div', { class: 'travel-warn' }, [
      el('span', { text: '☔' }),
      el('span', { html: `<b>${j.title || 'צילום חוץ'}</b> מסומן כצילום חוץ, והתחזית מראה סיכוי משקעים גבוה` })
    ]));
  });
  if (warns.children.length) v.appendChild(warns);

  if (colFull.children.length) v.appendChild(colFull);
  const used = [col1, col2, col3].filter(c => c.children.length);
  const grid = el('div', { class: 'day-grid cols-' + (used.length || 1) });
  used.forEach(c => grid.appendChild(c));
  if (!used.length) grid.appendChild(el('div', { class: 'empty-note',
    text: 'כל הכרטיסים מוסתרים. אפשר להחזיר אותם בהגדרות → פיצ׳רים בלוחות.' }));
  v.appendChild(grid);
  Split.render(v);      // V4: תצוגה מפוצלת
}



/* ============================ 9. תצוגת שבוע ============================ */
function renderWeek(){
  const v = $('#view-week'); v.innerHTML = '';
  const S = DB.settings;
  const sun = startOfWeek(State.cursor);
  const wk = periodW('weeks', weekKeyOf(State.cursor));

  const head = el('div', { class: 'month-head' }, [
    el('div', { class: 'month-title', html:
      `שבוע ${rng(sun.getDate(), addDays(sun, 6).getDate())} ב${GREG_MONTHS[addDays(sun, 6).getMonth()]}` +
      `<small>${hebOf(sun).short} – ${hebOf(addDays(sun, 6)).short} ${hebOf(sun).yLabel}` +
      (parashaForWeek(sun) ? ' · ' + parashaLabel(parashaForWeek(sun)) : '') + `</small>` })
  ]);
  v.appendChild(head);

  const grid = el('div', { class: 'week-grid' });
  const slots = slotList();

  for (let i = 0; i < 7; i++){
    const d = addDays(sun, i), iso = isoOf(d), h = hebOf(d);
    const rec = dayRec(iso, false);
    const evs = eventsForISO(iso);
    const hol = holidaysForISO(iso);
    const isSat = d.getDay() === 6;

    const col = el('div', { class: 'wday' + (isSat ? ' sat' : '') + (dayMarkLevel(iso) === 2 ? ' holiday' : '') +
                                   (sameISO(d, new Date()) ? ' today' : '') });

    const hd = el('div', { class: 'wd-head', title: 'מעבר לתצוגת יום',
      onclick: () => { State.cursor = d; setView('day'); } });
    hd.appendChild(el('div', { class: 'dn' }, [
      el('span', { text: DOW_LONG[d.getDay()] }),
      el('span', { class: 'num', text: String(d.getDate()) })
    ]));
    if (S.calMode !== 'greg') hd.appendChild(el('div', { class: 'hd', text: h.short }));
    const cnd = evs.find(e => e.cat === 'candles');
    const hav = evs.find(e => e.cat === 'havdalah');
    if (hol.length) hd.appendChild(el('div', { class: 'ev', text: hol.map(e => e.title).join(' · ') }));
    personalEventsForISO(iso).forEach(x => hd.appendChild(el('div', { class: 'ev', text: '🎂 ' + eventTitleFor(x) })));
    contactBirthdaysForISO(iso).forEach(x => hd.appendChild(el('div', { class: 'ev', text: '🎈 ' + x.c.name })));
    if (cnd) hd.appendChild(el('div', { class: 'ev', text: '🕯 ' + cnd.time }));
    if (hav) hd.appendChild(el('div', { class: 'ev', text: '✨ ' + hav.time }));
    const wxw = wxChip(iso, true);
    if (wxw) hd.appendChild(wxw);
    col.appendChild(hd);

    const body = el('div', { class: 'wd-body' });

    /* פגישות ועבודות של אותו יום — כולל כל מה שיובא מיומן חיצוני */
    const dayAppts = (rec.appts || []).filter(a => a && (a.what || '').trim());
    const dayJobs = jobsForISO(iso);
    if (dayAppts.length || dayJobs.length){
      body.appendChild(el('div', { class: 'wd-section-label', text: 'פגישות' }));
      const conf = apptConflicts(iso);
      dayJobs.forEach(j => body.appendChild(el('div', { class: 'wd-slot' }, [
        el('span', { class: 't', text: j.time || '' }),
        el('span', { style: 'flex:1;font-size:.8em;font-weight:600;color:var(--c5i)',
                     text: '📷 ' + (j.title || ''), title: jobStatus(j.status).name })
      ])));
      dayAppts.forEach(a => body.appendChild(el('div', { class: 'wd-slot' }, [
        el('span', { class: 't', text: a.time || '' }),
        el('span', {
          style: 'flex:1;font-size:.82em;cursor:pointer' + (conf.has(a) ? ';color:var(--danger)' : ''),
          text: a.what,
          title: [a.time && a.end ? a.time + '–' + a.end : a.time, a.where, a.note].filter(Boolean).join('\n'),
          onclick: () => { State.cursor = d; setView('day'); }
        })
      ])));
    }

    body.appendChild(el('div', { class: 'wd-section-label', text: 'עדיפויות' }));
    const goals = dayW(iso).goals;
    for (let g = 0; g < 3; g++){
      if (goals[g] === undefined) goals[g] = '';
      body.appendChild(el('div', { class: 'wd-slot' }, [
        el('span', { class: 't', text: String(g + 1) }),
        mkLine(goals[g], '', val => { goals[g] = val; })
      ]));
    }
    body.appendChild(el('div', { class: 'wd-section-label', text: 'לוח זמנים' }));
    const slotsWrap = el('div', { style: 'position:relative' });
    slots.forEach(t => {
      const handle = el('span', { class: 'drag-handle', text: '⠿', title: 'גרירה' });
      const srow = el('div', { class: 'wd-slot' }, [
        el('span', { class: 't', text: t }), handle,
        mkLine((rec.schedule || {})[t], '', val => { const w = dayW(iso); (w.schedule = w.schedule || {})[t] = val; })
      ]);
      if (((rec.schedule || {})[t] || '').trim())
        makeDraggable(handle, srow, { kind: 'slot', iso, slot: t, text: (rec.schedule || {})[t] });
      makeDropTarget(srow, dragged => {
        const text = dragged.kind === 'todo' ? (dragged.item.t || '')
                   : dragged.kind === 'appt' ? [dragged.item.what, dragged.item.where].filter(Boolean).join(' · ')
                   : (dragged.text || '');
        if (!text.trim()) return;
        removeDragSource(dragged);
        const w = dayW(iso); w.schedule = w.schedule || {};
        w.schedule[t] = (w.schedule[t] || '').trim() ? w.schedule[t] + ' · ' + text : text;
        saveDB(); renderAll(true);
      });
      slotsWrap.appendChild(srow);
    });
    if (S.showNowLine && sameISO(d, new Date())) attachNowLine(slotsWrap);
    body.appendChild(slotsWrap);
    col.appendChild(body);
    grid.appendChild(col);
  }

  /* --- צד: לוח מיני, יעד שבועי, משימות, הרגלים, הערות --- */
  const side = el('div', { class: 'week-side' });
  const wkey = weekKeyOf(State.cursor);
  placeWidgets('week', {
    minical: () => card('לוח החודש', '', miniCalendar(State.cursor)),
    focus:   () => card('יעד השבוע', 'c2', [
      mkArea(wk.focus, 'המטרה המרכזית של השבוע…', val => { periodW('weeks', wkey).focus = val; })
    ]),
    todos:   () => card('משימות השבוע', 'c3', mkTodoList(() => periodW('weeks', wkey).todos, 'משימה…', 5,
      { rich: true, bucket: 'weeks', key: wkey })),
    habits:  () => card('מעקב הרגלים', 'c6', habitTable(sun)),
    review:  () => card('סקירה שבועית', 'c5', weeklyReview(sun)),
    notes:   () => notesCard('הערות', 'c4',
      () => periodW('weeks', wkey).notes, val => { periodW('weeks', wkey).notes = val; },
      () => periodW('weeks', wkey).sketch, val => { periodW('weeks', wkey).sketch = val; }, 200)
  }, { 1: side });

  v.appendChild(el('div', { class: 'week-wrap' }, [
    el('div', { class: 'week-scroll' }, grid), side
  ]));
}

function habitTable(sunday){
  const S = DB.settings;
  const thead = el('tr', {}, [ el('th', { text: 'הרגל' }) ]);
  for (let i = 0; i < 7; i++)
    thead.appendChild(el('th', { class: i === 6 ? 'dow-sat' : '', text: DOW_SHORT[i] }));
  const tbody = el('tbody');
  S.habits.forEach(name => {
    const tr = el('tr', {}, [ el('td', { text: name }) ]);
    for (let i = 0; i < 7; i++){
      const iso = isoOf(addDays(sunday, i));
      const on = !!((dayRec(iso, false).habits || {})[name]);
      const chk = el('input', { class: 'chk', type: 'checkbox', checked: on });
      chk.addEventListener('change', () => { const w = dayW(iso); (w.habits = w.habits || {})[name] = chk.checked; saveDB(); });
      tr.appendChild(el('td', { class: i === 6 ? 'dow-sat' : '' }, chk));
    }
    tbody.appendChild(tr);
  });
  return el('table', { class: 'habit-table' }, [ el('thead', {}, thead), tbody ]);
}

function miniCalendar(around){
  const first = new Date(around.getFullYear(), around.getMonth(), 1);
  const start = startOfWeek(first);
  const thead = el('tr');
  for (let i = 0; i < 7; i++) thead.appendChild(el('th', { text: DOW_SHORT[i] }));
  const tbody = el('tbody');
  for (let w = 0; w < 6; w++){
    const tr = el('tr');
    for (let i = 0; i < 7; i++){
      const d = addDays(start, w * 7 + i), iso = isoOf(d);
      const out = d.getMonth() !== around.getMonth();
      const cls = [ out ? 'out' : '', d.getDay() === 6 ? 'sat' : '',
                    sameISO(d, new Date()) ? 'today' : '',
                    sameISO(d, State.cursor) ? 'sel' : '',
                    (!out && isMajorHoliday(iso)) ? 'hol' : '' ].filter(Boolean).join(' ');
      tr.appendChild(el('td', { class: cls }, [
        el('button', { text: String(d.getDate()), title: hebOf(d).full,
          onclick: () => { State.cursor = d; renderAll(); } })
      ]));
    }
    tbody.appendChild(tr);
  }
  return el('table', { class: 'mini-cal' }, [ el('thead', {}, thead), tbody ]);
}

/* ============================ 10. תצוגת חודש ============================ */
function monthToggle(kind){
  const key = kind === 'month' ? 'monthCalendar' : 'yearCalendar';
  const seg = el('div', { class: 'seg no-print' });
  [['greg', 'חודש לועזי'], ['hebrew', 'חודש עברי']].forEach(([mode, label]) => {
    if (kind === 'year') label = mode === 'greg' ? 'שנה לועזית' : 'שנה עברית';
    seg.appendChild(el('button', { text: label, 'aria-pressed': String(DB.settings[key] === mode),
      onclick: () => { DB.settings[key] = mode; saveDB(); renderAll(); } }));
  });
  return seg;
}

function renderMonth(){
  const v = $('#view-month'); v.innerHTML = '';
  const S = DB.settings, cur = State.cursor;
  const hebMode = S.monthCalendar === 'hebrew';

  let firstDate, dayCount, titleMain, titleSub, bucketKey;
  if (hebMode){
    const h = hebOf(cur);
    firstDate = dateFromHeb(h.y, h.m, 1);
    dayCount  = daysInHebMonth(h.m, h.y);
    titleMain = `${hebMonthName(h.m, h.y)} ${h.yLabel}`;
    const lastDate = dateFromHeb(h.y, h.m, dayCount);
    titleSub  = `${GREG_MONTHS[firstDate.getMonth()]} ${firstDate.getFullYear()}` +
                (lastDate.getMonth() !== firstDate.getMonth() ? ` – ${GREG_MONTHS[lastDate.getMonth()]} ${lastDate.getFullYear()}` : '');
    bucketKey = `H${h.y}-${pad2(h.m)}`;
  } else {
    firstDate = new Date(cur.getFullYear(), cur.getMonth(), 1);
    dayCount  = new Date(cur.getFullYear(), cur.getMonth() + 1, 0).getDate();
    titleMain = `${GREG_MONTHS[cur.getMonth()]} ${cur.getFullYear()}`;
    const h1 = hebOf(firstDate), h2 = hebOf(new Date(cur.getFullYear(), cur.getMonth(), dayCount));
    titleSub  = h1.mName === h2.mName ? `${h1.mName} ${h1.yLabel}` : `${h1.mName} – ${h2.mName} ${h2.yLabel}`;
    bucketKey = monthKeyOf(cur);
  }

  v.appendChild(el('div', { class: 'month-head' }, [
    el('div', { class: 'month-title', html: `${titleMain}<small>${titleSub}</small>` }),
    monthToggle('month')
  ]));

  /* כותרות ימים */
  const gh = el('div', { class: 'mgrid-head' });
  for (let i = 0; i < 7; i++) gh.appendChild(el('div', { class: i === 6 ? 'sat' : '', text: DOW_LONG[i].replace('יום ', '') }));

  const gb = el('div', { class: 'mgrid-body' });
  const lead = firstDate.getDay();
  const total = Math.ceil((lead + dayCount) / 7) * 7;

  for (let i = 0; i < total; i++){
    const inMonth = i >= lead && i < lead + dayCount;
    const d = addDays(firstDate, i - lead);
    const iso = isoOf(d), h = hebOf(d);
    const hol = holidaysForISO(iso);
    const evs = eventsForISO(iso);
    const av = availOf(iso);
    const cls = ['mcell',
      inMonth ? '' : 'out',
      d.getDay() === 6 ? 'sat' : '',
      dayMarkLevel(iso) === 2 ? 'holiday' : '',
      av ? AVAIL[av][1] : '',
      sameISO(d, new Date()) ? 'today' : ''].filter(Boolean).join(' ');

    const cell = el('div', { class: cls });
    const headRow = el('div', { class: 'mcell-head' });
    const gLabel = hebMode ? h.dLabel : String(d.getDate());
    const sLabel = hebMode ? String(d.getDate()) + ' ' + GREG_MONTHS_SHORT[d.getMonth()] : h.dLabel;
    headRow.appendChild(el('span', { class: 'g', text: gLabel, title: 'מעבר לתצוגת יום',
      onclick: () => { State.cursor = d; setView('day'); } }));
    if (S.calMode !== (hebMode ? 'hebrew' : 'greg'))
      headRow.appendChild(el('span', { class: 'h', text: sLabel }));
    cell.appendChild(headRow);

    const evBox = el('div', { class: 'evs' });
    hol.slice(0, 2).forEach(e => evBox.appendChild(el('div', { class: 'ev', text: e.title, title: e.memo })));
    const par = evs.find(e => e.cat === 'parashat');
    if (par) evBox.appendChild(el('div', { class: 'ev parashat', text: par.title }));
    const cnd = evs.find(e => e.cat === 'candles');
    if (cnd) evBox.appendChild(el('div', { class: 'ev candles', text: '🕯 ' + cnd.time }));
    personalEventsForISO(iso).forEach(x =>
      evBox.appendChild(el('div', { class: 'ev', style: 'background:var(--today);color:var(--today-ink)',
        text: evIcon(x.ev) + ' ' + eventTitleFor(x) })));
    contactBirthdaysForISO(iso).forEach(x =>
      evBox.appendChild(el('div', { class: 'ev', style: 'background:var(--today);color:var(--today-ink)',
        text: '🎈 ' + x.c.name + (x.age > 0 ? ' · ' + x.age : ''), title: 'יום הולדת של איש קשר' })));
    layersForISO(iso).forEach(x =>
      evBox.appendChild(el('div', { class: 'ev', style: `background:${x.layer.color};color:#fff`,
        text: x.label, title: x.layer.name })));
    jobsForISO(iso).forEach(j =>
      evBox.appendChild(el('div', { class: 'ev', style: 'background:var(--c5);color:var(--c5i)',
        text: '📷 ' + (j.title || ''), title: jobStatus(j.status).name })));
    /* פגישות — כולל אלה שיובאו מיומן חיצוני */
    (dayRec(iso, false).appts || []).filter(a => a && (a.what || '').trim()).slice(0, 4).forEach(a =>
      evBox.appendChild(el('div', { class: 'ev', style: 'background:var(--panel-3);color:var(--ink)',
        text: (a.time ? a.time + ' ' : '') + a.what,
        title: [a.time && a.end ? a.time + '–' + a.end : '', a.where, a.note].filter(Boolean).join('\n') })));
    if (evBox.children.length) cell.appendChild(evBox);
    makeDropTarget(cell, dragged => {
      const text = dragged.kind === 'todo' ? (dragged.item.t || '') : (dragged.text || '');
      if (!text.trim()) return;
      const copy = dragged.kind === 'todo' ? JSON.parse(JSON.stringify(dragged.item))
                                           : Object.assign(TODO_DEFAULT(), { t: text });
      removeDragSource(dragged);
      dayW(iso).todos.push(Object.assign(TODO_DEFAULT(), copy));
      saveDB(); renderAll(true);
    });

    const rec = dayRec(iso, false);
    const ta = el('textarea', { placeholder: 'רישום…' });
    ta.value = rec.note || '';
    ta.addEventListener('input', () => { dayW(iso).note = ta.value; saveDB(); });
    cell.appendChild(ta);

    const openTodos = (rec.todos || []).filter(t => t && t.t && !t.d).length;
    if (openTodos) cell.appendChild(el('span', { class: 'dot-todo', text: `☑ ${openTodos}` }));

    gb.appendChild(cell);
  }

  const side = el('div', { class: 'week-side' });
  const below = el('div', { class: 'year-side' });
  const bucket = hebMode ? 'hmonths' : 'months';
  const mrec = periodW(bucket, bucketKey);
  const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
  const lastD = new Date(cur.getFullYear(), cur.getMonth() + 1, 0);
  let _st = null;
  const stats = () => (_st = _st || collectStats(first, lastD));

  placeWidgets('month', {
    goals: () => card('יעדי החודש', 'c2', mkGoals(mrec.goals, 'יעד לחודש…')),
    todos: () => card('משימות החודש', 'c3', mkTodoList(() => periodW(bucket, bucketKey).todos, 'משימה…', 4,
      { rich: true, bucket, key: bucketKey })),
    notes: () => notesCard('הערות', 'c4',
      () => periodW(bucket, bucketKey).notes, val => { periodW(bucket, bucketKey).notes = val; },
      () => periodW(bucket, bucketKey).sketch, val => { periodW(bucket, bucketKey).sketch = val; }, 200),
    habitgrid: () => card('מעקב הרגלים — כל החודש', 'c6', monthHabitGrid(cur)),
    bars: () => {
      const st = stats();
      return card('השלמת משימות בחודש', 'c3', [
        barsChart(st.byDay, true),
        el('div', { class: 'est-summary' }, [
          el('span', { text: 'סך הכל' }),
          el('span', { html: `<b>${st.todosDone}</b> מתוך <b>${st.todosTotal}</b> · ${st.pct}%` })
        ])
      ]);
    },
    mood: () => {
      const st = stats();
      return card('מצב רוח ואנרגיה', 'c2', [
        el('div', { class: 'wd-section-label', text: 'מצב רוח' }), sparkline(st.mood, 5),
        el('div', { class: 'wd-section-label', text: 'אנרגיה' }), sparkline(st.energy, 5)
      ]);
    }
  }, { 1: side, 2: below });

  v.appendChild(el('div', { class: side.children.length ? 'month-layout' : '' }, [
    el('div', { class: 'mgrid' }, [ gh, gb ]),
    side.children.length ? side : null
  ]));
  if (below.children.length) v.appendChild(below);
}

/* ============================ 11. תצוגת שנה ============================ */
function renderYear(){
  const v = $('#view-year'); v.innerHTML = '';
  const S = DB.settings, cur = State.cursor;
  const hebMode = S.yearCalendar === 'hebrew';

  let cols, rowsCount, titleMain, titleSub, bucketKey;
  if (hebMode){
    const hy = hebOf(cur).y;
    const order = hebMonthOrder(hy);
    cols = order.map(m => ({ m, hy, label: hebMonthName(m, hy), len: daysInHebMonth(m, hy) }));
    rowsCount = 30;
    titleMain = `שנת ${gematriya(hy)}`;
    titleSub  = rng(rdToGregorian(hebrewToRD(hy, 7, 1)).y, rdToGregorian(hebrewToRD(hy + 1, 7, 1)).y) +
                (isHebrewLeapYear(hy) ? ' · שנה מעוברת' : '');
    bucketKey = 'H' + hy;
  } else {
    const gy = cur.getFullYear();
    cols = GREG_MONTHS.map((label, i) => ({ gm: i + 1, gy, label, len: new Date(gy, i + 1, 0).getDate() }));
    rowsCount = 31;
    titleMain = String(gy);
    const h1 = hebOf(new Date(gy, 0, 1)), h2 = hebOf(new Date(gy, 11, 31));
    titleSub = `${h1.yLabel}–${h2.yLabel}`;
    bucketKey = String(gy);
  }

  v.appendChild(el('div', { class: 'year-head' }, [
    el('div', { class: 'year-title', html: `${titleMain}<small>${titleSub}</small>` }),
    monthToggle('year')
  ]));

  const thead = el('tr', {}, [ el('th', { class: 'corner', text: '' }) ]);
  cols.forEach(c => thead.appendChild(el('th', { text: c.label })));
  const tbody = el('tbody');

  for (let day = 1; day <= rowsCount; day++){
    const tr = el('tr', {}, [ el('td', { class: 'rownum', text: hebMode ? gematriya(day) : String(day) }) ]);
    cols.forEach(c => {
      if (day > c.len){ tr.appendChild(el('td', {}, el('div', { class: 'ycell blank' }))); return; }
      const d = hebMode ? dateFromHeb(c.hy, c.m, day) : new Date(c.gy, c.gm - 1, day);
      const iso = isoOf(d);
      const hol = holidaysForISO(iso);
      const lvl = dayMarkLevel(iso);
      const cls = ['ycell',
        d.getDay() === 6 ? 'sat' : '',
        lvl === 2 ? 'holiday' : '',
        sameISO(d, new Date()) ? 'today' : ''].filter(Boolean).join(' ');

      const rec = dayRec(iso, false);
      const inp = el('input', { type: 'text', value: rec.note || '' });
      inp.addEventListener('input', () => { dayW(iso).note = inp.value; saveDB(); });
      const other = hebMode ? `${d.getDate()} ${GREG_MONTHS_SHORT[d.getMonth()]}` : hebOf(d).short;
      const pev = personalEventsForISO(iso);
      const dayAppts = (rec.appts || []).filter(a => a && (a.what || '').trim());
      const dayJobs = jobsForISO(iso);
      inp.title = `${DOW_LONG[d.getDay()]} · ${other}` + (hol.length ? ' · ' + hol.map(e => e.title).join(', ') : '')
                + (pev.length ? ' · ' + pev.map(eventTitleFor).join(', ') : '')
                + (dayJobs.length ? '\n📷 ' + dayJobs.map(j => (j.time ? j.time + ' ' : '') + j.title).join('\n📷 ') : '')
                + (dayAppts.length ? '\n' + dayAppts.map(a => (a.time ? a.time + ' ' : '') + a.what +
                    (a.where ? ' · ' + a.where : '')).join('\n') : '');

      const cell = el('div', { class: cls }, [
        inp, el('span', { class: 'dow', text: DOW_SHORT[d.getDay()] })
      ]);
      if (lvl >= 1) cell.appendChild(el('span', { class: 'hdot', title: hol.map(e => e.title).join(', ') }));
      if (pev.length) cell.appendChild(el('span', { class: 'hdot',
        style: 'background:var(--today-ink);inset-inline-start:11px', title: pev.map(eventTitleFor).join(', ') }));
      if (dayAppts.length || dayJobs.length) cell.appendChild(el('span', { class: 'hdot',
        style: 'background:var(--accent);inset-inline-start:19px',
        title: (dayAppts.length + dayJobs.length) + ' פגישות ועבודות ביום הזה' }));
      cell.addEventListener('dblclick', () => { State.cursor = d; setView('day'); });
      tr.appendChild(el('td', {}, cell));
    });
    tbody.appendChild(tr);
  }

  v.appendChild(el('div', { class: 'year-scroll' }, [
    el('table', { class: 'ygrid' }, [ el('thead', {}, thead), tbody ])
  ]));

  const ybucket = hebMode ? 'hyears' : 'years';
  const yrec = periodW(ybucket, bucketKey);
  const side = el('div', { class: 'year-side' });
  placeWidgets('year', {
    goals: () => card('יעדי השנה', 'c2', mkGoals(yrec.goals, 'יעד לשנה…')),
    milestones: () => card('אבני דרך', 'c3', mkTodoList(() => periodW(ybucket, bucketKey).todos, 'אבן דרך…', 5,
      { rich: true, bucket: ybucket, key: bucketKey })),
    notes: () => notesCard('הערות', 'c4',
      () => periodW(ybucket, bucketKey).notes, val => { periodW(ybucket, bucketKey).notes = val; },
      () => periodW(ybucket, bucketKey).sketch, val => { periodW(ybucket, bucketKey).sketch = val; }, 200)
  }, { 1: side });
  if (side.children.length) v.appendChild(side);
}

/* ============================= 12. הגדרות ============================= */
function setRow(label, control, hint){
  return el('div', { class: 'set-row' }, [
    el('label', { text: label }), control,
    hint ? el('div', { class: 'hint', text: hint }) : null
  ]);
}
function mkSwitch(checked, onChange){
  const inp = el('input', { type: 'checkbox', checked });
  inp.addEventListener('change', () => onChange(inp.checked));
  return el('span', { class: 'switch' }, [ inp, el('i') ]);
}
function mkSelect(opts, value, onChange){
  const s = el('select');
  opts.forEach(([v, t]) => s.appendChild(el('option', { value: v, text: t, selected: String(v) === String(value) })));
  s.value = String(value);
  s.addEventListener('change', () => onChange(s.value));
  return s;
}

function renderSettings(){
  const S = DB.settings, body = $('#drawerBody'); body.innerHTML = '';

function isEmptyDay(r){
  if (!r) return true;
  const txt = s => (s || '').trim();
  return !Object.values(r.schedule || {}).some(x => txt(x))
      && !(r.goals || []).some(x => txt(x))
      && !(r.todos || []).some(t => t && txt(t.t))
      && !(r.appts || []).some(a => a && (txt(a.time) || txt(a.what) || txt(a.where)))
      && !txt(r.notes) && !txt(r.reminder) && !txt(r.gratitude) && !txt(r.note)
      && !Object.values(r.habits || {}).some(Boolean) && !r.water && !txt(r.mood)
      && !r.energy && !r.pomos
      && !(r.sketch && r.sketch.strokes && r.sketch.strokes.length)
      && !Object.values(r.recDone || {}).some(Boolean)
      && !(r.files || []).length && !(r.voice || []).length;
}
function isEmptyPeriod(r){
  const txt = s => (s || '').trim();
  return !(r.goals || []).some(x => txt(x)) && !(r.todos || []).some(t => t && txt(t.t))
      && !txt(r.notes) && !txt(r.focus)
      && !Object.values(r.review || {}).some(v => txt(v))
      && !(r.sketch && r.sketch.strokes && r.sketch.strokes.length);
}
function pruneDB(){
  for (const [k, v] of Object.entries(DB.days)) if (isEmptyDay(v)) delete DB.days[k];
  ['weeks', 'months', 'hmonths', 'years', 'hyears'].forEach(b => {
    for (const [k, v] of Object.entries(DB[b])) if (isEmptyPeriod(v)) delete DB[b][k];
  });
}

        const data = JSON.parse(fr.result);
        if (!data || typeof data !== 'object' || !data.days) throw new Error('מבנה לא תקין');
        if (!confirm('הייבוא יחליף את כל הנתונים הקיימים. להמשיך?')) return;

function detectLocation(){
  if (!navigator.geolocation){ alert('הדפדפן אינו תומך באיתור מיקום.'); return; }
  toast('מאתר מיקום…');
  navigator.geolocation.getCurrentPosition(pos => {
    const { latitude, longitude } = pos.coords;
    let tz = 'Asia/Jerusalem';
    try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || tz; } catch(e){}
    const near = CITIES.map(c => ({ c, dist: Math.hypot(c.lat - latitude, c.lon - longitude) }))
                       .sort((a, b) => a.dist - b.dist)[0];
    const name = (near && near.dist < 0.25) ? near.c.n : 'המיקום שלי';
    DB.settings.location = { name, lat: latitude, lon: longitude, tz, source: 'gps' };
    onLocationChange();
    toast('המיקום עודכן: ' + name);
  }, err => {
    alert('לא ניתן לאתר מיקום (' + err.message + ').\nאיתור מיקום דורש פתיחה מ-https או מ-localhost. ניתן לבחור עיר מהרשימה.');
  }, { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 });
}

/* כלל: {id,title,cat,est,freq,dows[],dom,hebDom,from,to,active} */
function recurOccursOn(r, date){
  if (r.active === false) return false;
  const iso = isoOf(date);
  if (r.from && iso < r.from) return false;
  if (r.to && iso > r.to) return false;
  switch (r.freq){
    case 'daily':    return true;
    case 'weekdays': return date.getDay() >= 0 && date.getDay() <= 4;   // א׳–ה׳
    case 'weekly':   return (r.dows || []).includes(date.getDay());
    case 'monthly': {
      const last = new Date(date.getFullYear(), date.getMonth() + 1, 0).getDate();
      return date.getDate() === Math.min(r.dom || 1, last);
    }
    case 'hebmonthly': {
      const h = hebOf(date);
      const len = daysInHebMonth(h.m, h.y);
      return h.d === Math.min(r.hebDom || 1, len);
    }
    default: return false;
  }
}
function recurringFor(date){ return DB.recurring.filter(r => recurOccursOn(r, date)); }

/* ------------------- אירועים אישיים לפי תאריך עברי ------------------- */
/* {id,title,type,cal:'heb'|'greg',hm,hd,gm,gd,baseYear,adar:'both'|'1'|'2',remind,note} */
const EVENT_TYPES = { birthday: '🎂 יום הולדת', azkara: '🕯 אזכרה', barmitzva: '📜 בר/בת מצווה',
                      anniversary: '💍 יום נישואין', other: '📌 אחר' };

/** כל המופעים של אירוע בשנה לועזית נתונה (יכול להיות יותר מאחד באדר בשנה מעוברת) */
function eventOccurrences(ev, gYear){
  const out = [];
  if (ev.cal === 'greg'){
    const last = new Date(gYear, ev.gm, 0).getDate();
    out.push({ date: new Date(gYear, ev.gm - 1, Math.min(ev.gd, last)), note: '' });
    return out;
  }
  const approx = hebOf(new Date(gYear, 6, 1)).y;
  for (const hy of [approx - 1, approx, approx + 1]){
    let months = [ev.hm];
    if (ev.hm === 12 && isHebrewLeapYear(hy)){
      if (ev.adar === '1') months = [12];
      else if (ev.adar === '2') months = [13];
      else months = [12, 13];                       // ברירת מחדל: מציגים את שניהם
    }
    if (ev.hm === 12 && !isHebrewLeapYear(hy)) months = [12];
    if (ev.hm === 13 && !isHebrewLeapYear(hy)) months = [12];   // אדר ב׳ בשנה פשוטה → אדר
    for (const m of months){
      const len = daysInHebMonth(m, hy);
      const d = dateFromHeb(hy, m, Math.min(ev.hd, len));
      if (d.getFullYear() !== gYear) continue;
      out.push({
        date: d, hy,
        note: (months.length > 1) ? hebMonthName(m, hy) : (ev.hd > len ? `נדחה ל-${gematriya(len)}` : '')
      });
    }
  }
  return out;
}
/** מיפוי תאריך → אירועים אישיים, לשנה לועזית */
const _evCache = {};
function personalEventsByDate(gYear){
  const key = gYear + '|' + JSON.stringify(DB.events).length + '|' + DB.events.length;
  if (_evCache.key === key) return _evCache.map;
  const map = {};
  DB.events.forEach(ev => {
    eventOccurrences(ev, gYear).forEach(o => {
      const iso = isoOf(o.date);
      let years = null;
      if (ev.baseYear) years = (ev.cal === 'heb' ? (o.hy - ev.baseYear) : (gYear - ev.baseYear));
      (map[iso] = map[iso] || []).push({ ev, years, note: o.note });
    });
  });
  _evCache.key = key; _evCache.map = map;
  return map;
}
function personalEventsForISO(iso){
  return (personalEventsByDate(Number(iso.slice(0, 4)))[iso] || []);
}
/** אירועים שמתקרבים — לצורך תזכורת מראש */
function upcomingPersonalEvents(fromDate, maxDays){
  const out = [];
  for (let i = 0; i <= (maxDays || 30); i++){
    const d = addDays(fromDate, i), iso = isoOf(d);
    personalEventsForISO(iso).forEach(x => out.push({ iso, days: i, ...x }));
  }
  return out;
}
const evIcon = ev => (EVENT_TYPES[ev.type] || '📌 אחר').slice(0, 2);
function eventTitleFor(x){
  const t = x.ev.title + (x.years > 0 ? ` · ${x.ev.type === 'azkara' ? 'שנה' : 'גיל'} ${x.years}` : '');
  return x.note ? `${t} (${x.note})` : t;
}

/* ------------------------------ תבניות יום ------------------------------ */
function applyTemplate(iso, tpl, replace){
  const w = dayW(iso);
  if (replace){ w.schedule = {}; w.goals = ['', '', '']; w.todos = []; }
  Object.entries(tpl.schedule || {}).forEach(([t, v]) => {
    if (v && (replace || !(w.schedule[t] || '').trim())) w.schedule[t] = v;
  });
  (tpl.goals || []).forEach((g, i) => { if (g && !(w.goals[i] || '').trim()) w.goals[i] = g; });
  (tpl.todos || []).forEach(t => w.todos.push(Object.assign(TODO_DEFAULT(), t, { d: false })));
  saveDB();
}
function captureTemplate(iso, name){
  const r = dayRec(iso, false);
  return {
    id: uid(), name,
    schedule: Object.fromEntries(Object.entries(r.schedule || {}).filter(([, v]) => (v || '').trim())),
    goals: (r.goals || []).slice(),
    todos: (r.todos || []).filter(t => t && (t.t || '').trim())
                          .map(t => ({ t: t.t, cat: t.cat || '', est: t.est || 0, sub: (t.sub || []).map(s => ({ t: s.t, d: false })) }))
  };
}

/* --------------------- גלגול משימות שלא הושלמו --------------------- */
function findRolloverSource(iso){
  for (let i = 1; i <= 14; i++){
    const prev = isoOf(addDays(fromISO(iso), -i));
    const r = DB.days[prev];
    if (r && (r.todos || []).some(t => t && (t.t || '').trim() && !t.d)) return prev;
  }
  return null;
}
function rolloverInto(iso){
  const src = findRolloverSource(iso);
  if (!src){ toast('אין משימות פתוחות בשבועיים האחרונים'); return 0; }
  const from = DB.days[src], open = (from.todos || []).filter(t => t && (t.t || '').trim() && !t.d);
  if (!open.length) return 0;
  const w = dayW(iso);
  open.forEach(t => w.todos.push(Object.assign(TODO_DEFAULT(), JSON.parse(JSON.stringify(t)))));
  from.todos = (from.todos || []).filter(t => !open.includes(t));
  saveDB();
  toast(`${open.length} משימות גולגלו מ-${src.split('-').reverse().join('/')}`);
  return open.length;
}

async function loadWeather(force){
  if (!DB.settings.showWeather) return null;
  const L = DB.settings.location, key = `${L.lat.toFixed(2)},${L.lon.toFixed(2)}`;
  if (!force && WX.data && WX.loc === key && Date.now() - WX.at < 3 * 3600e3) return WX.data;
  try {
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${L.lat}&longitude=${L.lon}` +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
      `&timezone=${encodeURIComponent(L.tz)}&forecast_days=16`;
    const res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const j = await res.json();
    const map = {};
    (j.daily.time || []).forEach((d, i) => {
      map[d] = { code: j.daily.weather_code[i], hi: Math.round(j.daily.temperature_2m_max[i]),
                 lo: Math.round(j.daily.temperature_2m_min[i]), rain: j.daily.precipitation_probability_max[i] };
    });
    WX.data = map; WX.at = Date.now(); WX.loc = key;
    try { localStorage.setItem('planner_wx_v1', JSON.stringify({ map, at: WX.at, loc: key })); } catch(e){}
    return map;
  } catch(e){ return WX.data; }
}
function loadWeatherCache(){
  try {
    const raw = localStorage.getItem('planner_wx_v1');
    if (!raw) return;
    const o = JSON.parse(raw);
    WX.data = o.map; WX.at = o.at; WX.loc = o.loc;
