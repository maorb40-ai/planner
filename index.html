<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#a8926b">
<meta name="description" content="מתכנן אישי יומי, שבועי, חודשי ושנתי עם לוח עברי ולועזי, חגים, פרשת שבוע וזמני היום">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="מתכנן">
<meta name="format-detection" content="telephone=no">
<title>דשבורד מתכנן V3.5 — יומי · שבועי · חודשי · שנתי</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Frank+Ruhl+Libre:wght@400;500;700&family=Heebo:wght@300;400;500;700&display=swap">
<style>
/* ==========================================================================
   דשבורד מתכנן — גיליון סגנון ראשי
   כל הצבעים עוברים דרך משתני CSS, כדי ששלוש ערכות הנושא יעבדו בכל התצוגות.
   ========================================================================== */

/* ---------- ערכה 1: קרם מודפס (ברירת מחדל) ---------- */
:root,
html[data-theme="cream"]{
  --font-ui: 'Assistant', 'Segoe UI', 'Arial Hebrew', Arial, sans-serif;
  --font-display: 'Frank Ruhl Libre', 'David Libre', Narkisim, Georgia, serif;
  --font-num: 'Heebo', 'Assistant', Arial, sans-serif;

  --bg: #efe9dd;
  --bg-grad: radial-gradient(1200px 700px at 80% -10%, #fbf7ee 0%, #efe9dd 60%);
  --panel: #fffdf7;
  --panel-2: #f9f4e8;
  --panel-3: #f4eddd;
  --ink: #4a453c;
  --ink-strong: #332f28;
  --ink-soft: #8d8474;
  --line: #e2dac8;
  --line-strong: #cfc4ac;
  --accent: #a8916a;
  --accent-ink: #6d5c3d;
  --accent-soft: #ece2cd;
  --accent-contrast: #fffdf7;
  --danger: #b4675f;
  --ok: #7d9070;
  --shabbat: #e9e3f2;
  --shabbat-ink: #5c4f7a;
  --holiday: #f3e2d4;
  --holiday-ink: #96603c;
  --today: #dfe9df;
  --today-ink: #4d6a4d;
  --shadow-sm: 0 1px 2px rgba(96,80,52,.08);
  --shadow: 0 2px 6px rgba(96,80,52,.07), 0 14px 32px -20px rgba(96,80,52,.35);
  --shadow-lg: 0 8px 40px -12px rgba(96,80,52,.34);
  --radius: 14px;
  --radius-sm: 9px;
  --head-bg: var(--accent-soft);
  --head-ink: var(--accent-ink);
  --c1: #e3e7dc; --c1i: #5c6a51;
  --c2: #f4e3e3; --c2i: #8f5f5f;
  --c3: #dfe4ef; --c3i: #556080;
  --c4: #ece1ef; --c4i: #6f5680;
  --c5: #f2e8da; --c5i: #8a6f4a;
  --c6: #dde8e8; --c6i: #4f7070;
  --field-line: #ddd3bd;
  --grid-line: #e6ddc9;
  --sel: rgba(168,145,106,.16);
}

/* ---------- ערכה 2: פסטל עדין ---------- */
html[data-theme="pastel"]{
  --bg: #fbf8f6;
  --bg-grad: radial-gradient(1100px 620px at 85% -12%, #fdf6f6 0%, #f8f5f8 45%, #f5f7f6 100%);
  --panel: #ffffff;
  --panel-2: #fbf9fb;
  --panel-3: #f5f2f6;
  --ink: #4c4752;
  --ink-strong: #322e39;
  --ink-soft: #948da0;
  --line: #ece7ef;
  --line-strong: #d9d2e0;
  --accent: #b79ec0;
  --accent-ink: #7a5d86;
  --accent-soft: #f0e7f3;
  --accent-contrast: #ffffff;
  --danger: #cf8082;
  --ok: #86ab8e;
  --shabbat: #e8ecfa;
  --shabbat-ink: #4f5f96;
  --holiday: #fbe6ea;
  --holiday-ink: #a05a6c;
  --today: #e3f1ea;
  --today-ink: #3f7a5c;
  --shadow-sm: 0 1px 2px rgba(110,90,120,.07);
  --shadow: 0 2px 8px rgba(110,90,120,.06), 0 16px 34px -22px rgba(110,90,120,.4);
  --shadow-lg: 0 10px 44px -14px rgba(110,90,120,.32);
  --head-bg: #f0e7f3;
  --head-ink: #7a5d86;
  --c1: #e2efe4; --c1i: #4f7a5d;
  --c2: #fbe4e8; --c2i: #a4596d;
  --c3: #e2eaf8; --c3i: #4f6494;
  --c4: #eee4f6; --c4i: #7a5d96;
  --c5: #fdefdf; --c5i: #a3763f;
  --c6: #ddf0f0; --c6i: #3f7d7d;
  --field-line: #e4dfe9;
  --grid-line: #efeaf2;
  --sel: rgba(183,158,192,.18);
}

/* ---------- ערכה 3: כהה מודרני ---------- */
html[data-theme="dark"]{
  --bg: #131419;
  --bg-grad: radial-gradient(1200px 700px at 80% -15%, #1d1f28 0%, #131419 60%);
  --panel: #1c1e26;
  --panel-2: #22252f;
  --panel-3: #282c38;
  --ink: #dfe2ea;
  --ink-strong: #f2f4f9;
  --ink-soft: #8e94a5;
  --line: #2d313d;
  --line-strong: #3b4150;
  --accent: #7f9bff;
  --accent-ink: #a9bcff;
  --accent-soft: #262c40;
  --accent-contrast: #10121a;
  --danger: #f0736d;
  --ok: #57c08a;
  --shabbat: #2a2743;
  --shabbat-ink: #b7abf0;
  --holiday: #3a2b26;
  --holiday-ink: #f0ac86;
  --today: #1e3a30;
  --today-ink: #6fd3a3;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
  --shadow: 0 2px 8px rgba(0,0,0,.35), 0 18px 40px -24px rgba(0,0,0,.9);
  --shadow-lg: 0 14px 50px -16px rgba(0,0,0,.75);
  --head-bg: #262c40;
  --head-ink: #a9bcff;
  --c1: #21322a; --c1i: #7fca9d;
  --c2: #33242a; --c2i: #e8919f;
  --c3: #222b3d; --c3i: #93b1ee;
  --c4: #2c2540; --c4i: #bda6ee;
  --c5: #332c1f; --c5i: #e0b57b;
  --c6: #1f3134; --c6i: #7fc9c9;
  --field-line: #333846;
  --grid-line: #292d38;
  --sel: rgba(127,155,255,.16);
}

*, *::before, *::after{ box-sizing: border-box; }
html, body{ height: 100%; }

body{
  margin: 0;
  font-family: var(--font-ui);
  font-size: calc(15px * var(--font-scale, 1));
  color: var(--ink);
  background: var(--bg);
  background-image: var(--bg-grad);
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}
::selection{ background: var(--sel); }

*::-webkit-scrollbar{ width: 10px; height: 10px; }
*::-webkit-scrollbar-track{ background: transparent; }
*::-webkit-scrollbar-thumb{ background: var(--line-strong); border-radius: 8px; border: 3px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-thumb:hover{ background: var(--accent); background-clip: content-box; }

/* ==========================  סרגל עליון  ========================== */
.app-bar{
  position: sticky; top: 0; z-index: 60;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 18px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  box-shadow: var(--shadow-sm);
}
.brand{ display: flex; align-items: baseline; gap: 9px; margin-inline-end: 4px; }
.brand b{ font-family: var(--font-display); font-size: 1.28em; font-weight: 700; color: var(--ink-strong); letter-spacing: .2px; }
.brand span{ font-size: .78em; color: var(--ink-soft); letter-spacing: .6px; }

.tabs{ display: flex; gap: 4px; padding: 4px; background: var(--panel-3); border-radius: 999px; border: 1px solid var(--line); }
.tabs button{
  font: inherit; font-weight: 600; cursor: pointer;
  padding: 6px 18px; border: 0; border-radius: 999px;
  background: transparent; color: var(--ink-soft);
  transition: background .18s, color .18s, box-shadow .18s;
}
.tabs button:hover{ color: var(--ink); }
.tabs button[aria-selected="true"]{ background: var(--panel); color: var(--accent-ink); box-shadow: var(--shadow-sm); }

.seg{ display: flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel-3); }
.seg button{
  font: inherit; font-size: .86em; cursor: pointer; padding: 5px 11px;
  border: 0; background: transparent; color: var(--ink-soft); transition: background .16s, color .16s;
}
.seg button + button{ border-inline-start: 1px solid var(--line); }
.seg button[aria-pressed="true"]{ background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; }

.spacer{ flex: 1 1 auto; }
.nav-group{ display: flex; align-items: center; gap: 6px; }

.btn{
  font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 13px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  box-shadow: var(--shadow-sm);
  transition: border-color .16s, background .16s, transform .1s, color .16s;
}
.btn:hover{ border-color: var(--line-strong); background: var(--panel-2); }
.btn:active{ transform: translateY(1px); }
.btn.primary{ background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); font-weight: 600; }
.btn.primary:hover{ filter: brightness(1.05); }
.btn.ghost{ background: transparent; box-shadow: none; }
.btn.icon{ padding: 6px 9px; font-size: 1.05em; line-height: 1; }
.btn.sm{ padding: 3px 9px; font-size: .84em; }
.btn.danger{ color: var(--danger); border-color: color-mix(in srgb, var(--danger) 35%, var(--line)); }

.date-jump{
  font: inherit; font-family: var(--font-num);
  padding: 6px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--panel); color: var(--ink); box-shadow: var(--shadow-sm);
  color-scheme: light;
}
html[data-theme="dark"] .date-jump{ color-scheme: dark; }

/* ==========================  רצועת מידע  ========================== */
.info-strip{
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 9px 18px;
  background: var(--panel-2);
  border-bottom: 1px solid var(--line);
  font-size: .9em;
}
.chip{
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 11px; border-radius: 999px;
  background: var(--panel); border: 1px solid var(--line); color: var(--ink);
  white-space: nowrap;
}
.chip b{ font-weight: 600; color: var(--ink-strong); }
.chip.hd{ background: var(--accent-soft); border-color: transparent; color: var(--accent-ink); font-weight: 600; }
.chip.holiday{ background: var(--holiday); border-color: transparent; color: var(--holiday-ink); font-weight: 600; }
.chip.shabbat{ background: var(--shabbat); border-color: transparent; color: var(--shabbat-ink); font-weight: 600; }
.chip.muted{ color: var(--ink-soft); }
.chip.warn{ background: var(--holiday); color: var(--holiday-ink); border-color: transparent; }
.chip button{ all: unset; cursor: pointer; opacity: .55; }
.chip button:hover{ opacity: 1; }

/* ==========================  פריסה כללית  ========================== */
main{ padding: 18px; max-width: 1900px; margin: 0 auto; }
.view{ display: none; animation: fade .22s ease; }
.view.active{ display: block; }
@keyframes fade{ from{ opacity: 0; transform: translateY(4px); } to{ opacity: 1; transform: none; } }

.card{
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
  display: flex; flex-direction: column;
}
.card > h3{
  position: relative; margin: 0; padding: 8px 14px;
  font-size: .85em; font-weight: 700; letter-spacing: 1.2px;
  text-align: center;
  background: var(--head-bg); color: var(--head-ink);
  border-bottom: 1px solid var(--line);
}
.card > h3 .h-actions{ position: absolute; inset-inline-end: 10px; top: 50%; transform: translateY(-50%); display: flex; gap: 4px; }
.card .body{ padding: 12px 14px; flex: 1 1 auto; }
.card.c1 > h3{ background: var(--c1); color: var(--c1i); }
.card.c2 > h3{ background: var(--c2); color: var(--c2i); }
.card.c3 > h3{ background: var(--c3); color: var(--c3i); }
.card.c4 > h3{ background: var(--c4); color: var(--c4i); }
.card.c5 > h3{ background: var(--c5); color: var(--c5i); }
.card.c6 > h3{ background: var(--c6); color: var(--c6i); }

/* ==========================  שדות עריכה  ========================== */
.line-input{
  font: inherit; width: 100%;
  padding: 3px 4px;
  border: 0; border-bottom: 1px solid var(--field-line);
  background: transparent; color: var(--ink);
  transition: border-color .15s, background .15s;
}
.line-input:hover{ border-bottom-color: var(--line-strong); }
.line-input:focus{ outline: none; border-bottom-color: var(--accent); background: var(--sel); border-radius: 4px 4px 0 0; }
.line-input::placeholder{ color: var(--ink-soft); opacity: .5; }

textarea.area{
  font: inherit; width: 100%; min-height: 76px; resize: vertical;
  padding: 8px 10px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
}
textarea.area:focus{ outline: none; border-color: var(--accent); background: var(--panel); }
textarea.area.dotted{
  background-color: var(--panel-2);
  background-image: radial-gradient(var(--line-strong) 1px, transparent 1px);
  background-size: 14px 14px;
}

.chk{
  appearance: none; -webkit-appearance: none;
  width: 16px; height: 16px; flex: 0 0 16px;
  border: 1.5px solid var(--line-strong); border-radius: 4px;
  background: var(--panel); cursor: pointer; position: relative;
  transition: background .15s, border-color .15s;
}
.chk:hover{ border-color: var(--accent); }
.chk:checked{ background: var(--accent); border-color: var(--accent); }
.chk:checked::after{
  content: ''; position: absolute; inset-inline-start: 4.5px; top: 1px;
  width: 4px; height: 8px; border: solid var(--accent-contrast);
  border-width: 0 2px 2px 0; transform: rotate(45deg);
}

.row{ display: flex; align-items: center; gap: 8px; }
.row + .row{ margin-top: 7px; }
.row .line-input{ flex: 1 1 auto; }
.row.done .line-input{ text-decoration: line-through; color: var(--ink-soft); }
.del{
  all: unset; cursor: pointer; color: var(--ink-soft); opacity: 0;
  padding: 0 4px; border-radius: 4px; font-size: .95em; line-height: 1;
  transition: opacity .15s, color .15s;
}
.row:hover .del{ opacity: .6; }
.del:hover{ opacity: 1 !important; color: var(--danger); }

.num-badge{
  flex: 0 0 22px; width: 22px; height: 22px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--accent-soft); color: var(--accent-ink);
  font-size: .78em; font-weight: 700; font-family: var(--font-num);
}

.add-row{
  all: unset; cursor: pointer; display: block; width: 100%; text-align: center;
  margin-top: 9px; padding: 4px; border-radius: var(--radius-sm);
  color: var(--ink-soft); font-size: .84em; border: 1px dashed var(--line-strong);
  transition: color .15s, border-color .15s, background .15s;
}
.add-row:hover{ color: var(--accent-ink); border-color: var(--accent); background: var(--sel); }
.empty-note{ color: var(--ink-soft); font-size: .86em; text-align: center; padding: 8px 4px; }

/* ==========================  תצוגת יום  ========================== */
.day-head{
  display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap;
  padding: 0 4px 14px;
}
.day-title{ display: flex; flex-direction: column; gap: 2px; }
.day-title .greg{ font-family: var(--font-display); font-size: 2.1em; font-weight: 700; color: var(--ink-strong); line-height: 1.15; }
.day-title .hebr{ font-family: var(--font-display); font-size: 1.25em; color: var(--accent-ink); }
.day-title .sub{ font-size: .88em; color: var(--ink-soft); }

.zmanim-strip{
  display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
  gap: 8px; margin-bottom: 14px;
}
.zman{
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 7px 10px; text-align: center; box-shadow: var(--shadow-sm);
}
.zman .k{ font-size: .74em; color: var(--ink-soft); display: block; white-space: nowrap; }
.zman .v{ font-family: var(--font-num); font-size: 1.08em; font-weight: 600; color: var(--ink-strong); direction: ltr; unicode-bidi: isolate; }
.zman.hl{ background: var(--accent-soft); border-color: transparent; }
.zman.hl .v, .zman.hl .k{ color: var(--accent-ink); }

.day-grid{
  display: grid;
  grid-template-columns: minmax(300px, 1.05fr) minmax(280px, 1fr) minmax(260px, .92fr);
  gap: 14px; align-items: start;
}
.day-col{ display: flex; flex-direction: column; gap: 14px; }

.sched-list{ display: flex; flex-direction: column; }
.sched-row{ display: flex; align-items: center; gap: 9px; padding: 1px 0; }
.sched-row .t{
  flex: 0 0 52px; text-align: end; font-family: var(--font-num);
  font-size: .82em; color: var(--ink-soft); direction: ltr; unicode-bidi: isolate;
  padding-inline-end: 2px;
}
.sched-row.now .t{ color: var(--danger); font-weight: 700; }
.sched-row.now .line-input{ border-bottom-color: var(--danger); }
.sched-row.half .t{ opacity: .55; font-size: .74em; }
.sched-row .line-input{ flex: 1 1 auto; }

.water-drops{ display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; padding: 4px 0; }
.drop{
  all: unset; cursor: pointer; width: 26px; height: 30px;
  display: grid; place-items: center; font-size: 1.15em;
  filter: grayscale(1) opacity(.32); transition: filter .18s, transform .12s;
}
.drop:hover{ transform: scale(1.12); }
.drop.on{ filter: none; }

.mood-row{ display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.mood{
  all: unset; cursor: pointer; width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center; font-size: 1.2em;
  border: 1.5px solid transparent; filter: grayscale(1) opacity(.4);
  transition: filter .18s, border-color .18s, transform .12s;
}
.mood:hover{ transform: scale(1.08); }
.mood.on{ filter: none; border-color: var(--accent); background: var(--sel); }

.habit-table{ width: 100%; border-collapse: collapse; font-size: .88em; }
.habit-table th, .habit-table td{ padding: 4px 5px; border-bottom: 1px solid var(--line); text-align: center; }
.habit-table th:first-child, .habit-table td:first-child{ text-align: start; color: var(--ink-soft); font-weight: 400; }
.habit-table th{ font-size: .82em; color: var(--ink-soft); font-weight: 600; }
.habit-table tr:last-child td{ border-bottom: 0; }
.habit-table .dow-sat{ background: var(--shabbat); color: var(--shabbat-ink); }

/* ==========================  תצוגת שבוע  ========================== */
.week-wrap{ display: grid; grid-template-columns: 1fr 268px; gap: 14px; align-items: start; }
.week-scroll{ overflow-x: auto; border-radius: var(--radius); }
.week-grid{
  display: grid; grid-template-columns: repeat(7, minmax(148px, 1fr));
  gap: 8px; min-width: 100%;
}
.wday{
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column;
}
.wday.today{ border-color: var(--accent); box-shadow: 0 0 0 2px var(--sel), var(--shadow); }
.wday.sat > .wd-head{ background: var(--shabbat); color: var(--shabbat-ink); }
.wday.holiday > .wd-head{ background: var(--holiday); color: var(--holiday-ink); }
.wd-head{
  padding: 7px 9px; background: var(--panel-3); border-bottom: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 1px; cursor: pointer;
}
.wd-head:hover{ filter: brightness(.98); }
.wd-head .dn{ font-weight: 700; font-size: .95em; color: inherit; display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
.wd-head .dn .num{ font-family: var(--font-num); font-size: 1.15em; }
.wd-head .hd{ font-size: .76em; opacity: .78; }
.wd-head .ev{ font-size: .74em; opacity: .9; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wd-body{ padding: 7px 8px; display: flex; flex-direction: column; gap: 6px; }
.wd-section-label{ font-size: .7em; letter-spacing: .8px; color: var(--ink-soft); font-weight: 700; margin-top: 3px; }
.wd-slot{ display: flex; align-items: center; gap: 5px; }
.wd-slot .t{ flex: 0 0 34px; font-family: var(--font-num); font-size: .7em; color: var(--ink-soft); direction: ltr; unicode-bidi: isolate; text-align: end; }
.wd-slot .line-input{ font-size: .86em; padding: 1px 3px; }
.week-side{ display: flex; flex-direction: column; gap: 14px; }

/* לוח מיני */
.mini-cal{ width: 100%; border-collapse: collapse; font-size: .8em; font-family: var(--font-num); }
.mini-cal th{ color: var(--ink-soft); font-weight: 600; padding: 3px 0; font-size: .92em; }
.mini-cal td{ padding: 0; text-align: center; }
.mini-cal button{
  all: unset; cursor: pointer; display: block; width: 100%; padding: 4px 0; border-radius: 6px;
  transition: background .14s, color .14s;
}
.mini-cal button:hover{ background: var(--sel); }
.mini-cal .out button{ color: var(--ink-soft); opacity: .4; }
.mini-cal .sat button{ color: var(--shabbat-ink); }
.mini-cal .today button{ background: var(--accent); color: var(--accent-contrast); font-weight: 700; }
.mini-cal .sel button{ box-shadow: inset 0 0 0 1.5px var(--accent); }
.mini-cal .hol button{ background: var(--holiday); color: var(--holiday-ink); }

/* ==========================  תצוגת חודש  ========================== */
.month-head{ display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 0 4px 12px; }
.month-title{ font-family: var(--font-display); font-size: 1.9em; font-weight: 700; color: var(--ink-strong); }
.month-title small{ display: block; font-family: var(--font-ui); font-size: .46em; font-weight: 400; color: var(--ink-soft); letter-spacing: .5px; }
.month-layout{ display: grid; grid-template-columns: 1fr 268px; gap: 14px; align-items: start; }

.mgrid{
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); overflow: hidden;
}
.mgrid-head{ display: grid; grid-template-columns: repeat(7, 1fr); background: var(--panel-3); border-bottom: 1px solid var(--line); }
.mgrid-head div{ padding: 7px 4px; text-align: center; font-size: .82em; font-weight: 700; color: var(--ink-soft); letter-spacing: .6px; }
.mgrid-head div.sat{ color: var(--shabbat-ink); background: var(--shabbat); }
.mgrid-body{ display: grid; grid-template-columns: repeat(7, 1fr); }
.mcell{
  min-height: 104px; border-inline-start: 1px solid var(--grid-line); border-top: 1px solid var(--grid-line);
  padding: 5px 6px; display: flex; flex-direction: column; gap: 3px; position: relative;
  background: var(--panel); transition: background .15s;
}
.mcell:nth-child(7n+1){ border-inline-start: 0; }
.mcell.out{ background: var(--panel-2); opacity: .62; }
.mcell.sat{ background: color-mix(in srgb, var(--shabbat) 32%, var(--panel)); }
.mcell.holiday{ background: color-mix(in srgb, var(--holiday) 42%, var(--panel)); }
.mcell.today{ background: color-mix(in srgb, var(--today) 55%, var(--panel)); box-shadow: inset 0 0 0 2px var(--accent); }
.mcell-head{ display: flex; align-items: baseline; justify-content: space-between; gap: 5px; }
.mcell-head .g{ font-family: var(--font-num); font-weight: 700; font-size: 1.02em; color: var(--ink-strong); cursor: pointer; }
.mcell-head .g:hover{ color: var(--accent-ink); text-decoration: underline; }
.mcell-head .h{ font-size: .76em; color: var(--accent-ink); font-family: var(--font-display); }
.mcell .evs{ display: flex; flex-direction: column; gap: 2px; }
.mcell .ev{
  font-size: .72em; font-weight: 600; line-height: 1.25;
  padding: 1px 5px; border-radius: 5px; background: var(--holiday); color: var(--holiday-ink);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.mcell .ev.candles{ background: var(--shabbat); color: var(--shabbat-ink); }
.mcell .ev.parashat{ background: var(--accent-soft); color: var(--accent-ink); }
.mcell textarea{
  font: inherit; font-size: .8em; flex: 1 1 auto; min-height: 30px; resize: none;
  border: 0; background: transparent; color: var(--ink); padding: 2px 3px; border-radius: 5px;
}
.mcell textarea:focus{ outline: none; background: var(--sel); }
.mcell textarea::placeholder{ color: transparent; }
.mcell:hover textarea::placeholder{ color: var(--ink-soft); opacity: .45; }
.mcell .dot-todo{
  position: absolute; inset-block-end: 4px; inset-inline-end: 6px;
  font-size: .68em; color: var(--ink-soft); font-family: var(--font-num);
}

/* ==========================  תצוגת שנה  ========================== */
.year-head{ display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap; padding: 0 4px 12px; }
.year-title{ font-family: var(--font-display); font-size: 2em; font-weight: 700; color: var(--ink-strong); }
.year-title small{ display: block; font-family: var(--font-ui); font-size: .44em; font-weight: 400; color: var(--ink-soft); }
.year-scroll{ overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); max-height: 74vh; }
.ygrid{ border-collapse: collapse; width: 100%; font-size: .78em; }
.ygrid th{
  position: sticky; top: 0; z-index: 3;
  background: var(--panel-3); color: var(--ink-soft);
  font-weight: 700; font-size: .95em; letter-spacing: .5px;
  padding: 6px 4px; border: 1px solid var(--grid-line); white-space: nowrap;
}
.ygrid th.corner{ inset-inline-start: 0; z-index: 4; }
.ygrid td.rownum{
  position: sticky; inset-inline-start: 0; z-index: 2;
  background: var(--panel-3); color: var(--ink-soft);
  font-family: var(--font-num); font-weight: 600; text-align: center;
  border: 1px solid var(--grid-line); width: 34px; min-width: 34px;
}
.ygrid td{ border: 1px solid var(--grid-line); padding: 0; height: 22px; }
.ycell{ position: relative; min-width: 74px; }
.ycell input{
  font: inherit; font-size: .95em; width: 100%; height: 22px;
  border: 0; background: transparent; color: var(--ink);
  padding-block: 0; padding-inline: 4px 22px;
}
.ycell input:focus{ outline: none; background: var(--sel); }
.ycell .dow{
  position: absolute; inset-inline-end: 3px; top: 50%; transform: translateY(-50%);
  font-size: .82em; color: var(--ink-soft); opacity: .55; pointer-events: none; font-family: var(--font-num);
}
.ycell.sat{ background: color-mix(in srgb, var(--shabbat) 40%, var(--panel)); }
.ycell.holiday{ background: color-mix(in srgb, var(--holiday) 55%, var(--panel)); }
.ycell.holiday .dow{ opacity: .8; color: var(--holiday-ink); }
.ycell.today{ box-shadow: inset 0 0 0 2px var(--accent); }
.ycell.blank{ background: var(--panel-2); opacity: .45; }
.ycell .hdot{ position: absolute; inset-inline-start: 3px; top: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--holiday-ink); }
/* יום עם פגישות שיובאו — הטקסט המרומז מוצג בגוון מודגש כדי שייראה בלוח השנתי */
.ycell input.has-events::placeholder{ color: var(--accent-ink); opacity: .75; }

.year-side{ display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 14px; }

/* ==========================  הגדרות  ========================== */
.drawer-back{
  position: fixed; inset: 0; z-index: 90; background: rgba(20,16,10,.34);
  backdrop-filter: blur(2px); opacity: 0; pointer-events: none; transition: opacity .22s;
}
.drawer-back.open{ opacity: 1; pointer-events: auto; }
.drawer{
  position: fixed; inset-block: 0; inset-inline-start: 0; z-index: 91;
  width: min(430px, 92vw); background: var(--panel);
  border-inline-end: 1px solid var(--line); box-shadow: var(--shadow-lg);
  transform: translateX(102%); transition: transform .26s cubic-bezier(.3,.8,.35,1);
  display: flex; flex-direction: column;
}
.drawer.open{ transform: none; }
.drawer-head{
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 18px; border-bottom: 1px solid var(--line); background: var(--panel-2);
}
.drawer-head h2{ margin: 0; font-family: var(--font-display); font-size: 1.25em; color: var(--ink-strong); }
.drawer-body{ overflow-y: auto; padding: 14px 18px 26px; display: flex; flex-direction: column; gap: 18px; }
.set-group{ display: flex; flex-direction: column; gap: 9px; }
.set-group > h4{
  margin: 0; font-size: .78em; letter-spacing: 1.1px; font-weight: 700;
  color: var(--ink-soft); border-bottom: 1px solid var(--line); padding-bottom: 5px;
}
.set-row{ display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.set-row label{ font-size: .9em; }
.set-row .hint{ flex: 1 1 100%; font-size: .78em; color: var(--ink-soft); margin-top: -4px; }
select, input[type="number"], input[type="text"].box{
  font: inherit; font-size: .9em; padding: 5px 9px; border-radius: 9px;
  border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
}
select:focus, input:focus{ outline: none; border-color: var(--accent); }

.theme-picker{ display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
.theme-opt{
  all: unset; cursor: pointer; border-radius: var(--radius-sm); overflow: hidden;
  border: 2px solid var(--line); transition: border-color .18s, transform .12s;
  display: flex; flex-direction: column;
}
.theme-opt:hover{ transform: translateY(-2px); }
.theme-opt[aria-pressed="true"]{ border-color: var(--accent); }
.theme-swatch{ height: 46px; display: flex; }
.theme-swatch i{ flex: 1; }
.theme-opt span{ padding: 5px 4px; text-align: center; font-size: .78em; background: var(--panel-2); color: var(--ink); }

.switch{ position: relative; width: 40px; height: 22px; flex: 0 0 40px; }
.switch input{ opacity: 0; width: 0; height: 0; position: absolute; }
.switch i{
  position: absolute; inset: 0; border-radius: 999px; cursor: pointer;
  background: var(--line-strong); transition: background .2s;
}
.switch i::after{
  content: ''; position: absolute; top: 3px; inset-inline-start: 3px;
  width: 16px; height: 16px; border-radius: 50%; background: #fff;
  transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.3);
}
.switch input:checked + i{ background: var(--accent); }
.switch input:checked + i::after{ transform: translateX(-18px); }

.habit-editor{ display: flex; flex-direction: column; gap: 6px; }

/* ==========================  הודעות  ========================== */
#toast{
  position: fixed; inset-block-end: 22px; inset-inline-start: 50%; transform: translate(50%, 140%);
  z-index: 120; padding: 9px 18px; border-radius: 999px;
  background: var(--ink-strong); color: var(--panel);
  box-shadow: var(--shadow-lg); font-size: .9em; font-weight: 600;
  transition: transform .3s cubic-bezier(.2,.9,.3,1); pointer-events: none; white-space: nowrap;
}
#toast.show{ transform: translate(50%, 0); }

.loading-bar{
  position: fixed; inset-block-start: 0; inset-inline: 0; height: 2px; z-index: 200;
  background: var(--accent); transform: scaleX(0); transform-origin: inline-start;
  transition: transform .3s, opacity .3s; opacity: 0;
}
.loading-bar.on{ transform: scaleX(.8); opacity: 1; }

/* ==========================  התאמה למסכים  ========================== */
@media (max-width: 1280px){
  .day-grid{ grid-template-columns: minmax(280px, 1fr) minmax(260px, 1fr); }
  .week-wrap, .month-layout{ grid-template-columns: 1fr; }
}
@media (max-width: 820px){
  main{ padding: 12px; }
  .day-grid{ grid-template-columns: 1fr; }
  .app-bar{ padding: 8px 12px; gap: 8px; }
  .brand span{ display: none; }
  .tabs button{ padding: 5px 12px; }
  .info-strip{ padding: 8px 12px; }
  .day-title .greg{ font-size: 1.6em; }
}

/* ==========================  הדפסה  ========================== */
@media print{
  html, body{ background: #fff !important; color: #222 !important; }
  .app-bar, .info-strip, .drawer, .drawer-back, #toast, .loading-bar,
  .add-row, .del, .no-print{ display: none !important; }
  main{ padding: 0; max-width: none; }
  .card, .wday, .mgrid, .year-scroll{ box-shadow: none !important; border-color: #bbb !important; break-inside: avoid; }
  .year-scroll{ max-height: none !important; overflow: visible !important; }
  .week-scroll{ overflow: visible !important; }
  .print-header{ display: block !important; }
  @page{ margin: 12mm; }
}
.print-header{ display: none; text-align: center; margin-bottom: 10px; }
.print-header h1{ font-family: var(--font-display); margin: 0 0 2px; font-size: 20pt; }
.print-header p{ margin: 0; font-size: 10pt; color: #666; }

/* ==========================================================================
   V2 — תוספות
   ========================================================================== */

/* ---------- קטגוריות ---------- */
.cat-dot{
  all: unset; cursor: pointer; flex: 0 0 10px; width: 10px; height: 10px;
  border-radius: 50%; background: var(--line-strong);
  box-shadow: 0 0 0 2px transparent; transition: box-shadow .15s, transform .12s;
}
.cat-dot:hover{ transform: scale(1.25); }
.cat-dot.none{ background: transparent; border: 1.5px dashed var(--line-strong); }
.cat-filter{ display: flex; gap: 5px; flex-wrap: wrap; padding: 0 0 8px; }
.cat-pill{
  all: unset; cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 9px; border-radius: 999px; font-size: .78em;
  border: 1px solid var(--line); color: var(--ink-soft); transition: all .15s;
}
.cat-pill i{ width: 8px; height: 8px; border-radius: 50%; display: block; }
.cat-pill[aria-pressed="true"]{ border-color: currentColor; background: var(--sel); color: var(--ink); font-weight: 600; }
.cat-pill.dim{ opacity: .42; }

/* ---------- משימות מורחבות ---------- */
.todo-item{ display: flex; flex-direction: column; gap: 3px; }
.todo-item + .todo-item{ margin-top: 6px; }
.todo-main{ display: flex; align-items: center; gap: 7px; }
.todo-main .line-input{ flex: 1 1 auto; }
.est-wrap{
  display: inline-flex; align-items: center; gap: 2px; flex: 0 0 auto;
  border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2);
  padding: 1px 5px; transition: border-color .15s, background .15s;
}
.est-wrap:hover{ border-color: var(--line-strong); }
.est-wrap:focus-within{ border-color: var(--accent); background: var(--panel); }
.est-wrap.set{ border-color: var(--accent-soft); background: var(--sel); }
.est-input{
  font: inherit; font-family: var(--font-num); font-size: .8em;
  /* רוחב קבוע שמכיל שלוש ספרות בלי לחתוך — flex: none כדי שלא יצטמצם בשורה צפופה */
  width: 44px; min-width: 44px; flex: none;
  text-align: center; direction: ltr;
  border: 0; background: transparent; color: var(--ink); padding: 0;
  /* החצים המובנים תופסים כמעט את כל התיבה ברוחב הזה — מסירים אותם */
  -moz-appearance: textfield; appearance: textfield;
}
.est-input::-webkit-outer-spin-button,
.est-input::-webkit-inner-spin-button{ -webkit-appearance: none; margin: 0; }
.est-input:focus{ outline: none; }
.est-input::placeholder{ color: var(--ink-soft); opacity: .5; }
.est-unit{ font-size: .66em; color: var(--ink-soft); user-select: none; white-space: nowrap; }
@media (pointer: coarse){
  .est-input{ width: 52px; min-width: 52px; font-size: .9em; }
  .est-wrap{ padding: 4px 7px; }
}
.sub-toggle{
  all: unset; cursor: pointer; font-size: .72em; color: var(--ink-soft);
  padding: 1px 5px; border-radius: 5px; white-space: nowrap;
}
.sub-toggle:hover{ background: var(--sel); color: var(--accent-ink); }
.sub-list{ padding-inline-start: 26px; display: flex; flex-direction: column; gap: 4px; }
.sub-row{ display: flex; align-items: center; gap: 6px; }
.sub-row .chk{ width: 13px; height: 13px; flex-basis: 13px; }
.sub-row .line-input{ font-size: .88em; }
.progress-mini{
  height: 3px; border-radius: 3px; background: var(--line); overflow: hidden;
  margin-inline-start: 26px;
}
.progress-mini i{ display: block; height: 100%; background: var(--ok); transition: width .25s; }
.drag-handle{
  cursor: grab; color: var(--ink-soft); opacity: 0; font-size: .9em; line-height: 1;
  padding: 0 2px; user-select: none;
}
.todo-item:hover .drag-handle, .sched-row:hover .drag-handle{ opacity: .45; }
.drag-handle:active{ cursor: grabbing; }
.dragging{ opacity: .4; }
.drop-target{ background: var(--sel) !important; box-shadow: inset 0 0 0 2px var(--accent); border-radius: 6px; }

.est-summary{
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-size: .8em; color: var(--ink-soft); padding: 6px 2px 0; border-top: 1px dashed var(--line);
  margin-top: 8px;
}
.est-summary b{ font-family: var(--font-num); color: var(--ink-strong); }
.est-summary.over b{ color: var(--danger); }

/* ---------- קו "עכשיו" ---------- */
.sched-list{ position: relative; }
.now-line{
  position: absolute; inset-inline: 0; height: 0; pointer-events: none; z-index: 2;
  border-top: 1.5px solid var(--danger);
}
.now-line::after{
  content: attr(data-t); position: absolute; inset-inline-end: 0; top: -8px;
  background: var(--danger); color: #fff; font-size: .64em; font-family: var(--font-num);
  padding: 1px 5px; border-radius: 4px; font-weight: 700;
}
.wd-body{ position: relative; }
.wd-body .now-line::after{ font-size: .58em; }

/* ---------- פומודורו ---------- */
.pomo{
  position: fixed; inset-block-end: 18px; inset-inline-end: 18px; z-index: 80;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); padding: 10px 14px; min-width: 190px;
  display: none; flex-direction: column; gap: 7px;
}
.pomo.open{ display: flex; }
.pomo-time{
  font-family: var(--font-num); font-size: 2.05em; font-weight: 700; text-align: center;
  color: var(--ink-strong); line-height: 1; direction: ltr; unicode-bidi: isolate;
}
.pomo.break .pomo-time{ color: var(--ok); }
.pomo-label{ text-align: center; font-size: .78em; color: var(--ink-soft); }
.pomo-bar{ height: 4px; border-radius: 3px; background: var(--line); overflow: hidden; }
.pomo-bar i{ display: block; height: 100%; background: var(--accent); transition: width 1s linear; }
.pomo.break .pomo-bar i{ background: var(--ok); }
.pomo-actions{ display: flex; gap: 6px; justify-content: center; }

/* ---------- סטטיסטיקה ---------- */
.stat-grid{ display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 9px; }
.stat-box{
  background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
  padding: 9px 10px; text-align: center;
}
.stat-box .v{ font-family: var(--font-num); font-size: 1.7em; font-weight: 700; color: var(--ink-strong); line-height: 1.1; }
.stat-box .k{ font-size: .74em; color: var(--ink-soft); }
.stat-box.good .v{ color: var(--ok); }
.stat-box.bad  .v{ color: var(--danger); }

.bars{ display: flex; align-items: flex-end; gap: 4px; height: 92px; padding-top: 6px; }
.bars .bar{ flex: 1 1 0; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; height: 100%; }
.bars .bar i{ display: block; width: 100%; border-radius: 4px 4px 0 0; background: var(--accent); min-height: 2px; transition: height .3s; }
.bars .bar span{ font-size: .64em; color: var(--ink-soft); font-family: var(--font-num); }
.bars .bar.sat i{ background: var(--shabbat-ink); opacity: .65; }

.spark{ width: 100%; height: 64px; display: block; }
.spark path{ fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.spark .fill{ fill: var(--sel); stroke: none; }
.spark circle{ fill: var(--accent); }

/* ---------- רשת הרגלים חודשית ---------- */
.hgrid-wrap{ overflow-x: auto; }
.hgrid{ border-collapse: collapse; font-size: .74em; width: 100%; }
.hgrid th{ padding: 3px 2px; color: var(--ink-soft); font-weight: 600; font-family: var(--font-num); }
.hgrid th.name, .hgrid td.name{
  text-align: start; font-family: var(--font-ui); white-space: nowrap;
  padding-inline-end: 8px; color: var(--ink); position: sticky; inset-inline-start: 0;
  background: var(--panel); z-index: 1;
}
.hgrid td{ padding: 1px; }
.hgrid .cellbox{
  width: 15px; height: 15px; border-radius: 3px; border: 1px solid var(--line);
  background: var(--panel-2); cursor: pointer; display: block; margin: 0 auto;
  transition: background .14s, transform .1s;
}
.hgrid .cellbox:hover{ transform: scale(1.18); }
.hgrid .cellbox.on{ background: var(--ok); border-color: var(--ok); }
.hgrid .cellbox.sat{ border-color: var(--shabbat-ink); }
.hgrid .cellbox.future{ opacity: .35; cursor: default; }
.hgrid .streak{ font-family: var(--font-num); color: var(--accent-ink); font-weight: 700; padding-inline-start: 6px; }

/* ---------- באנרים ---------- */
.banner-wrap{ display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.banner{
  display: flex; align-items: center; gap: 9px; padding: 7px 13px;
  border-radius: var(--radius-sm); font-size: .88em;
  background: var(--accent-soft); color: var(--accent-ink); border: 1px solid transparent;
}
.banner b{ font-weight: 700; }
.banner.shabbat{ background: var(--shabbat); color: var(--shabbat-ink); }
.banner.holiday{ background: var(--holiday); color: var(--holiday-ink); }
.banner.event{ background: var(--today); color: var(--today-ink); }
.banner .x{ margin-inline-start: auto; }

.countdown{ display: inline-flex; align-items: baseline; gap: 5px; }
.countdown b{ font-family: var(--font-num); font-size: 1.15em; }

/* ---------- מזג אוויר ---------- */
.wx{ display: inline-flex; align-items: center; gap: 6px; }
.wx .ic{ font-size: 1.15em; }
.wx .t{ font-family: var(--font-num); direction: ltr; unicode-bidi: isolate; }
.wx .t .lo{ color: var(--ink-soft); }
.wd-head .wx{ font-size: .74em; opacity: .9; }

/* ---------- חיפוש ---------- */
.search-back{
  position: fixed; inset: 0; z-index: 110; background: rgba(20,16,10,.4);
  backdrop-filter: blur(3px); display: none; padding-top: 8vh;
}
.search-back.open{ display: block; }
.search-box{
  width: min(680px, 92vw); margin: 0 auto; background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-lg);
  overflow: hidden; display: flex; flex-direction: column; max-height: 76vh;
}
.search-box input{
  font: inherit; font-size: 1.05em; padding: 14px 18px; border: 0; border-bottom: 1px solid var(--line);
  background: transparent; color: var(--ink); width: 100%;
}
.search-box input:focus{ outline: none; }
.search-results{ overflow-y: auto; }
.sres{
  all: unset; cursor: pointer; display: flex; gap: 10px; align-items: baseline;
  padding: 9px 18px; border-bottom: 1px solid var(--line); width: 100%; box-sizing: border-box;
}
.sres:hover, .sres.sel{ background: var(--sel); }
.sres .d{ flex: 0 0 118px; font-size: .78em; color: var(--accent-ink); font-weight: 600; }
.sres .w{ flex: 0 0 54px; font-size: .68em; color: var(--ink-soft); }
.sres .x{ flex: 1 1 auto; font-size: .88em; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sres mark{ background: var(--accent-soft); color: var(--accent-ink); border-radius: 3px; padding: 0 2px; }

/* ---------- חלונית כללית ---------- */
.modal-back{
  position: fixed; inset: 0; z-index: 100; background: rgba(20,16,10,.42);
  backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; padding: 18px;
}
.modal-back.open{ display: flex; }
.modal{
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); width: min(620px, 96vw); max-height: 88vh;
  display: flex; flex-direction: column; overflow: hidden;
}
.modal-head{
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel-2);
}
.modal-head h3{ margin: 0; font-family: var(--font-display); font-size: 1.15em; color: var(--ink-strong); }
.modal-body{ padding: 14px 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.modal-foot{ padding: 10px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-start; }
.field{ display: flex; flex-direction: column; gap: 4px; }
.field > label{ font-size: .8em; color: var(--ink-soft); font-weight: 600; }
.field input[type="text"], .field input[type="number"], .field select, .field textarea{
  font: inherit; padding: 7px 10px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: var(--panel-2); color: var(--ink);
}
.field textarea{ min-height: 60px; resize: vertical; }
.field-row{ display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }

.hint{ font-size: .8em; color: var(--ink-soft); line-height: 1.45; }
.list-item{
  display: flex; align-items: center; gap: 9px; padding: 7px 9px;
  border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--panel-2);
}
.list-item .grow{ flex: 1 1 auto; min-width: 0; }
.list-item .ttl{ font-weight: 600; font-size: .92em; color: var(--ink-strong); }
.list-item .meta{ font-size: .76em; color: var(--ink-soft); }

/* ---------- כתב יד / עט ---------- */
.sketch{ display: flex; flex-direction: column; gap: 7px; }
.sketch-tools{ display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ink-swatch{
  all: unset; cursor: pointer; width: 20px; height: 20px; border-radius: 50%;
  box-shadow: 0 0 0 1px var(--line); transition: transform .12s, box-shadow .15s;
}
.ink-swatch:hover{ transform: scale(1.15); }
.ink-swatch[aria-pressed="true"]{ box-shadow: 0 0 0 2px var(--accent); transform: scale(1.12); }
.nib{
  all: unset; cursor: pointer; width: 24px; height: 22px; display: grid; place-items: center;
  border-radius: 6px; border: 1px solid var(--line);
}
.nib i{ display: block; border-radius: 999px; background: var(--ink); }
.nib[aria-pressed="true"]{ background: var(--sel); border-color: var(--accent); }
.sketch-canvas-wrap{
  position: relative; border: 1px solid var(--line); border-radius: var(--radius-sm);
  background-color: var(--panel-2);
  background-image: radial-gradient(var(--line-strong) 1px, transparent 1px);
  background-size: 15px 15px;
  overflow: hidden;
}
.sketch-canvas-wrap canvas{ display: block; width: 100%; touch-action: pan-y; }
.sketch-canvas-wrap.drawing canvas{ touch-action: none; }
.sketch-canvas-wrap .hint-pen{
  position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
  color: var(--ink-soft); font-size: .85em; opacity: .55;
}
.pen-badge{
  display: inline-flex; align-items: center; gap: 5px; font-size: .72em;
  color: var(--ok); font-weight: 600;
}
body.pen-active .pen-badge{ color: var(--ok); }

/* ---------- מצב שבת ---------- */
body.shabbat-mode *{ animation: none !important; transition: none !important; }
body.shabbat-mode .pomo{ display: none !important; }
/* 3.5.3: מצב שבת מרגיע את המסך בלבד — אינו נועל עריכה. */
.shabbat-ribbon{
  display: flex; align-items: center; justify-content: center; gap: 10px;
  padding: 6px 14px; background: var(--shabbat); color: var(--shabbat-ink);
  font-weight: 700; font-size: .9em; letter-spacing: .5px;
}

/* ---------- מגע ועט: מטרות גדולות יותר ---------- */
@media (pointer: coarse){
  .line-input{ padding: 7px 5px; font-size: 1.02em; }
  .chk{ width: 21px; height: 21px; flex-basis: 21px; }
  .chk:checked::after{ inset-inline-start: 6.5px; top: 3px; width: 5px; height: 10px; }
  .btn{ padding: 9px 15px; }
  .btn.icon{ padding: 9px 12px; }
  .tabs button{ padding: 9px 20px; }
  .sched-row{ padding: 3px 0; }
  .mcell{ min-height: 122px; }
  .ycell input{ height: 28px; }
  .ygrid td{ height: 28px; }
  .del, .drag-handle{ opacity: .5; }
  .cat-dot{ width: 14px; height: 14px; flex-basis: 14px; }
}

@media print{
  .pomo, .search-back, .modal-back, .sketch-tools, .banner .x, .now-line{ display: none !important; }
  .sketch-canvas-wrap{ background-image: none; }
}

/* ==========================================================================
   V2.5 — אנשי קשר, ייבוא יומן וניהול פיצ׳רים
   ========================================================================== */

/* ---------- אנשי קשר ---------- */
.contact-row{
  display: flex; align-items: center; gap: 9px; padding: 6px 4px;
  border-bottom: 1px solid var(--line);
}
.contact-row:last-child{ border-bottom: 0; }
.avatar{
  flex: 0 0 30px; width: 30px; height: 30px; border-radius: 50%;
  display: grid; place-items: center; font-weight: 700; font-size: .82em;
  background: var(--accent-soft); color: var(--accent-ink); user-select: none;
}
.contact-row .who{ flex: 1 1 auto; min-width: 0; }
.contact-row .who b{ display: block; font-weight: 600; font-size: .94em; color: var(--ink-strong);
                     overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.contact-row .who span{ display: block; font-size: .76em; color: var(--ink-soft); direction: ltr;
                        text-align: start; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.contact-row .acts{ display: flex; gap: 4px; opacity: 0; transition: opacity .15s; }
.contact-row:hover .acts{ opacity: 1; }
@media (pointer: coarse){ .contact-row .acts{ opacity: 1; } }
.contact-search{
  font: inherit; width: 100%; padding: 6px 10px; border-radius: var(--radius-sm);
  border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); margin-bottom: 8px;
}
.contact-search:focus{ outline: none; border-color: var(--accent); background: var(--panel); }
.tag-chip{
  display: inline-block; font-size: .68em; padding: 1px 7px; border-radius: 999px;
  background: var(--accent-soft); color: var(--accent-ink); margin-inline-start: 4px;
}
.contact-list{ max-height: 46vh; overflow-y: auto; }

/* ---------- ניהול פיצ׳רים בלוחות ---------- */
.layout-editor{ display: flex; flex-direction: column; gap: 5px; }
.layout-row{
  display: flex; align-items: center; gap: 8px; padding: 5px 8px;
  border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--panel-2);
}
.layout-row.off{ opacity: .45; }
.layout-row .nm{ flex: 1 1 auto; font-size: .9em; }
.layout-row .ord{ display: flex; gap: 2px; }
.layout-row .ord button{
  all: unset; cursor: pointer; width: 22px; height: 20px; display: grid; place-items: center;
  border-radius: 5px; color: var(--ink-soft); font-size: .8em;
}
.layout-row .ord button:hover{ background: var(--sel); color: var(--accent-ink); }
.layout-row select{ font-size: .8em; padding: 2px 6px; }
.view-tabs{ display: flex; gap: 4px; margin-bottom: 8px; }
.view-tabs button{
  all: unset; cursor: pointer; padding: 4px 12px; border-radius: 999px;
  font-size: .84em; color: var(--ink-soft); border: 1px solid var(--line);
}
.view-tabs button[aria-pressed="true"]{ background: var(--accent-soft); color: var(--accent-ink); font-weight: 600; border-color: transparent; }

/* ---------- תצוגה מקדימה לייבוא ---------- */
.imp-table{ width: 100%; border-collapse: collapse; font-size: .82em; }
.imp-table th{ text-align: start; padding: 5px 6px; color: var(--ink-soft); font-weight: 600;
               border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--panel); }
.imp-table td{ padding: 4px 6px; border-bottom: 1px solid var(--grid-line); }
.imp-table td.d{ font-family: var(--font-num); direction: ltr; white-space: nowrap; color: var(--accent-ink); }
.imp-scroll{ max-height: 40vh; overflow: auto; border: 1px solid var(--line); border-radius: var(--radius-sm); }
.imp-stats{ display: flex; gap: 8px; flex-wrap: wrap; }
.imp-stats .stat-box{ flex: 1 1 100px; }

/* V4.2: רצועת סקירה בראש מסך הסטודיו */
.biz-overview{ display: flex; flex-direction: column; gap: 9px; margin-bottom: 4px; }
.biz-overview .stat-box.bad .v{ color: var(--danger); }
.biz-flags{ display: flex; flex-direction: column; gap: 5px; }
.biz-flag{ background: var(--c5, #f0e0c0); color: var(--c5i, #5a4520); border-radius: 9px;
  padding: 7px 11px; font-size: .85em; cursor: pointer; }
.biz-flag:hover{ filter: brightness(1.05); }

/* ==========================================================================
   V3 — עסק, ניתוח, קלט מהיר וכלי תפעול
   ========================================================================== */

/* ---------- פלטת פקודות ---------- */
.palette-back{
  position: fixed; inset: 0; z-index: 130; background: rgba(20,16,10,.42);
  backdrop-filter: blur(3px); display: none; padding-top: 10vh;
}
.palette-back.open{ display: block; }
.palette{
  width: min(620px, 94vw); margin: 0 auto; background: var(--panel);
  border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow-lg);
  overflow: hidden; display: flex; flex-direction: column; max-height: 70vh;
}
.palette input{
  font: inherit; font-size: 1.05em; padding: 13px 18px; border: 0;
  border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); width: 100%;
}
.palette input:focus{ outline: none; }
.palette-list{ overflow-y: auto; }
.pal-item{
  all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px;
  width: 100%; box-sizing: border-box; padding: 9px 18px; border-bottom: 1px solid var(--line);
}
.pal-item:hover, .pal-item.sel{ background: var(--sel); }
.pal-item .ic{ width: 20px; text-align: center; }
.pal-item .nm{ flex: 1 1 auto; font-size: .92em; }
.pal-item .grp{ font-size: .72em; color: var(--ink-soft); }
.pal-item kbd{
  font-family: var(--font-num); font-size: .7em; padding: 1px 6px;
  border: 1px solid var(--line-strong); border-radius: 4px; color: var(--ink-soft);
}

/* ---------- מצב פוקוס ---------- */
body.focus-mode .app-bar, body.focus-mode .info-strip,
body.focus-mode .banner-wrap, body.focus-mode .shabbat-ribbon{ display: none; }
.focus-screen{
  position: fixed; inset: 0; z-index: 95; background: var(--bg);
  background-image: var(--bg-grad); display: none;
  flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 30px;
}
.focus-screen.open{ display: flex; }
.focus-task{
  font-family: var(--font-display); font-size: clamp(1.6em, 4.5vw, 3.2em);
  text-align: center; color: var(--ink-strong); max-width: 18ch; line-height: 1.25;
}
.focus-sub{ color: var(--ink-soft); font-size: 1em; }
.focus-timer{
  font-family: var(--font-num); font-size: clamp(2.4em, 9vw, 5.5em); font-weight: 700;
  color: var(--accent-ink); direction: ltr; line-height: 1;
}
.focus-actions{ display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.focus-pick{ display: flex; flex-direction: column; gap: 6px; width: min(460px, 92vw); }

/* ---------- מסך "כל המשימות" ואג׳נדה ---------- */
.filters{ display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
.filters select, .filters input{ font-size: .86em; }
.agenda-day{ margin-bottom: 14px; }
.agenda-head{
  display: flex; align-items: baseline; gap: 9px; padding: 5px 2px;
  border-bottom: 1px solid var(--line-strong); margin-bottom: 6px;
}
.agenda-head b{ font-family: var(--font-display); font-size: 1.05em; color: var(--ink-strong); }
.agenda-head span{ font-size: .8em; color: var(--ink-soft); }
.agenda-head .tdy{ color: var(--accent-ink); font-weight: 700; }
.agenda-item{
  display: flex; align-items: center; gap: 9px; padding: 5px 6px; border-radius: var(--radius-sm);
}
.agenda-item:hover{ background: var(--sel); }
.agenda-item .tm{
  flex: 0 0 54px; font-family: var(--font-num); font-size: .82em; color: var(--ink-soft);
  direction: ltr; unicode-bidi: isolate; text-align: end;
}
.agenda-item .tx{ flex: 1 1 auto; font-size: .92em; }
.agenda-item .tx small{ display: block; color: var(--ink-soft); font-size: .78em; }
.agenda-item.done .tx{ text-decoration: line-through; color: var(--ink-soft); }
.conflict{ color: var(--danger); font-size: .78em; font-weight: 600; }

/* ---------- כרטיס לקוח, עבודות, כספים ---------- */
.pill-status{
  display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px;
  font-size: .74em; font-weight: 600; white-space: nowrap;
}
.st-booked   { background: var(--c3); color: var(--c3i); }
.st-shot     { background: var(--c5); color: var(--c5i); }
.st-edited   { background: var(--c4); color: var(--c4i); }
.st-delivered{ background: var(--c1); color: var(--c1i); }
.st-paid     { background: var(--c6); color: var(--c6i); }
.money{ font-family: var(--font-num); direction: ltr; unicode-bidi: isolate; }
.money.in{ color: var(--ok); }
.money.out{ color: var(--danger); }
.fin-row{ display: flex; align-items: center; gap: 7px; }
.fin-row .amt{ flex: 0 0 82px; }
.fin-sum{
  display: flex; justify-content: space-between; gap: 10px; padding: 7px 4px;
  border-top: 1px dashed var(--line); margin-top: 8px; font-size: .86em;
}
.fin-sum b{ font-family: var(--font-num); }

/* ---------- מפת חום לפרודוקטיביות ---------- */
.heat{ border-collapse: collapse; font-size: .7em; width: 100%; }
.heat th{ color: var(--ink-soft); font-weight: 600; padding: 2px; font-family: var(--font-num); }
.heat td{ padding: 1px; }
.heat i{
  display: block; width: 100%; height: 15px; border-radius: 3px;
  background: var(--line); transition: background .2s;
}
.heat td.lbl{ color: var(--ink-soft); white-space: nowrap; padding-inline-end: 6px; }

/* ---------- קבצים מצורפים והקלטות ---------- */
.attach-grid{ display: flex; gap: 7px; flex-wrap: wrap; }
.attach{
  position: relative; width: 68px; height: 68px; border-radius: var(--radius-sm);
  overflow: hidden; border: 1px solid var(--line); background: var(--panel-2);
  display: grid; place-items: center; cursor: pointer;
}
.attach img{ width: 100%; height: 100%; object-fit: cover; }
.attach .fx{ font-size: 1.4em; }
.attach .nm{
  position: absolute; inset-block-end: 0; inset-inline: 0; font-size: .58em;
  background: rgba(0,0,0,.55); color: #fff; padding: 1px 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.attach .rm{
  position: absolute; top: 2px; inset-inline-end: 2px; background: var(--danger); color: #fff;
  border: 0; border-radius: 50%; width: 16px; height: 16px; cursor: pointer;
  font-size: .7em; line-height: 1; opacity: 0; transition: opacity .15s;
}
.attach:hover .rm{ opacity: 1; }
.rec-row{ display: flex; align-items: center; gap: 8px; }
.rec-row audio{ flex: 1 1 auto; height: 30px; }
.rec-dot{
  width: 9px; height: 9px; border-radius: 50%; background: var(--danger);
  animation: pulse 1s infinite;
}
@keyframes pulse{ 0%,100%{ opacity: 1; } 50%{ opacity: .25; } }
.mic-btn{ all: unset; cursor: pointer; padding: 2px 5px; border-radius: 6px; color: var(--ink-soft); }
.mic-btn:hover{ background: var(--sel); color: var(--accent-ink); }
.mic-btn.on{ color: var(--danger); background: var(--sel); }

/* ---------- היסטוריית גרסאות ---------- */
.ver-row{
  display: flex; align-items: center; gap: 9px; padding: 6px 8px;
  border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--panel-2);
}
.ver-row .when{ flex: 1 1 auto; font-size: .86em; }
.ver-row .sz{ font-size: .74em; color: var(--ink-soft); font-family: var(--font-num); }

/* ---------- פרופילים ---------- */
.profile-chip{
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
  border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink);
  font-size: .8em; font-weight: 600; cursor: pointer; border: 0;
}
.profile-chip:hover{ filter: brightness(.97); }

/* ---------- הדפסה מתקדמת ---------- */
.print-sheet{ display: none; }
body.printing .view, body.printing .app-bar, body.printing .info-strip,
body.printing .banner-wrap{ display: none !important; }
body.printing .print-sheet{ display: block; }
.psheet{ page-break-after: always; padding: 4mm 0; }
.psheet:last-child{ page-break-after: auto; }
.psheet h2{ font-family: var(--font-display); font-size: 15pt; margin: 0 0 2mm; }
.psheet .sub{ font-size: 9pt; color: #666; margin-bottom: 3mm; }
.pcal{ width: 100%; border-collapse: collapse; font-size: 8pt; }
.pcal th, .pcal td{ border: 1px solid #bbb; padding: 1mm; vertical-align: top; }
.pcal th{ background: #f0ece2; font-size: 8pt; }
.pcal td{ height: 16mm; }
.pcal .dn{ font-weight: 700; font-size: 9pt; }
.pcal .hd{ font-size: 7pt; color: #777; }
.pcal .ev{ font-size: 6.5pt; color: #444; }
.pyear{ display: grid; grid-template-columns: repeat(4, 1fr); gap: 4mm; }
.pyear .pm h3{ margin: 0 0 1mm; font-size: 9pt; text-align: center; font-family: var(--font-display); }
.pyear table{ width: 100%; border-collapse: collapse; font-size: 6pt; }
.pyear td, .pyear th{ border: 0; text-align: center; padding: .4mm; }
.pyear .sat{ color: #6a5fa0; font-weight: 700; }
.pyear .hol{ background: #f3e2d4; border-radius: 2px; }
/* V4 */
.pyear .has{ text-decoration: underline; text-decoration-style: dotted; }
.pyear .pm-notes{ font-size: 5.4pt; color: #555; margin-top: .8mm; line-height: 1.35; }
.pyear .pm-notes b{ color: #222; }
.psh-head h2{ font-size: 17pt; }
.psh-times{ width: 100%; border-collapse: collapse; font-size: 11pt; margin-bottom: 5mm; }
.psh-times td{ padding: 1.6mm 2mm; border-bottom: 1px solid #ddd; }
.psh-times td.n{ font-weight: 700; text-align: center; width: 22mm; font-size: 12pt; }
.psh-times td.note{ color: #777; font-size: 8.5pt; width: 26mm; }
.psh-week{ width: 100%; border-collapse: collapse; font-size: 9pt; }
.psh-week th{ background: #f4f0e8; padding: 1.4mm 2mm; text-align: right; font-size: 8.5pt; }
.psh-week td{ padding: 1.6mm 2mm; border-bottom: 1px solid #e4e0d8; vertical-align: top; }
.psh-week td.n{ white-space: nowrap; color: #555; width: 30mm; }
.psh-week tr.sat td{ background: #f7f4ee; font-weight: 600; }
.plines{ border-top: 1px solid #ccc; }
.plines div{ height: 7mm; border-bottom: 1px solid #ddd; font-size: 8pt; padding-top: 1mm; }
@media print{
  .print-sheet{ display: block; }
  body.printing{ background: #fff !important; }
}

/* ==========================================================================
   V3.5 — מסמכים, זמינות, שכבות, אבטחה וממשק
   ========================================================================== */

/* ---------- מסך נעילה ---------- */
.lock-screen{
  position: fixed; inset: 0; z-index: 200; background: var(--bg);
  background-image: var(--bg-grad);
  display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
}
.lock-screen.open{ display: flex; }
.lock-box{
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow-lg); padding: 26px 24px; width: min(380px, 92vw);
  display: flex; flex-direction: column; gap: 12px; text-align: center;
}
.lock-box h2{ margin: 0; font-family: var(--font-display); color: var(--ink-strong); }
.lock-box input{
  font: inherit; font-size: 1.1em; text-align: center; letter-spacing: 3px;
  padding: 10px; border-radius: var(--radius-sm); border: 1px solid var(--line);
  background: var(--panel-2); color: var(--ink);
}
.lock-box input:focus{ outline: none; border-color: var(--accent); }
.lock-err{ color: var(--danger); font-size: .85em; min-height: 1.2em; }

/* מצב תצוגה בלבד הוסר בגרסה 3.5.3 — אין יותר שום נעילת עריכה ביישום. */

/* ======================= V4 ======================= */

/* 1. צנרת פניות */
.lead-board{ display:grid; grid-template-columns:repeat(5,minmax(150px,1fr)); gap:9px; overflow-x:auto; padding-bottom:4px; }
.lead-col{ background:var(--panel-2); border:1px solid var(--line); border-radius:11px; padding:8px; min-width:150px; }
.lead-col h5{ margin:0 0 7px; font-size:.78em; display:flex; justify-content:space-between; align-items:center;
  color:var(--ink-soft); font-weight:700; }
.lead-col h5 .cnt{ background:var(--panel); border-radius:20px; padding:1px 7px; font-size:.92em; }
.lead-card{ background:var(--panel); border:1px solid var(--line); border-inline-start:3px solid var(--accent);
  border-radius:9px; padding:7px 9px; margin-bottom:6px; cursor:pointer; position:relative; }
.lead-card:hover{ border-color:var(--accent); }
.lead-card .ttl{ font-weight:700; font-size:.88em; }
.lead-card .meta{ font-size:.75em; color:var(--ink-soft); margin-top:2px; }
.lead-card .btn.sm{ position:absolute; inset-block-start:6px; inset-inline-start:6px; padding:0 6px; opacity:.55; }
.lead-card:hover .btn.sm{ opacity:1; }
.lead-card.lg-new{ border-inline-start-color:var(--c1,#8aa); }
.lead-card.lg-quoted{ border-inline-start-color:var(--c2,#a98); }
.lead-card.lg-wait{ border-inline-start-color:var(--c5,#c94); }
.lead-card.lg-won{ border-inline-start-color:var(--good,#4a7); }
.lead-card.lg-lost{ border-inline-start-color:var(--danger); opacity:.6; }

/* 2. מחירון */
.grp-title{ font-size:.76em; font-weight:700; color:var(--ink-soft); margin:8px 0 2px; letter-spacing:.4px; }

/* 3. תזרים */
.cf-chart{ display:flex; align-items:flex-end; gap:5px; height:190px; padding:8px 4px 0;
  background:var(--panel-2); border:1px solid var(--line); border-radius:11px; }
.cf-col{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:3px; }
.cf-val{ font-size:.6em; color:var(--ink-soft); white-space:nowrap; font-variant-numeric:tabular-nums; }
.cf-bar{ width:100%; max-width:34px; background:var(--accent-soft); border-radius:5px 5px 0 0;
  display:flex; align-items:flex-end; min-height:2px; }
.cf-paid{ width:100%; background:var(--accent); border-radius:5px 5px 0 0; }
.cf-lbl{ font-size:.68em; color:var(--ink-soft); }

/* 5. מסירות */
.del-row{ display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:9px;
  border:1px solid var(--line); margin-bottom:5px; cursor:pointer; }
.del-row .ttl{ font-weight:600; font-size:.9em; }
.del-row .meta{ font-size:.75em; color:var(--ink-soft); }
.del-row .del-when{ font-size:.75em; white-space:nowrap; color:var(--ink-soft); }
.del-row.soon{ border-color:var(--c5,#c94); }
.del-row.soon .del-when{ color:var(--c5i,var(--ink)); font-weight:700; }
.del-row.late{ border-color:var(--danger); background:var(--danger-soft,transparent); }
.del-row.late .del-when{ color:var(--danger); font-weight:700; }

/* 8. מפת עומס */
.heat-grid{ display:grid; gap:3px; }
.heat-h{ font-size:.68em; color:var(--ink-soft); text-align:center; padding:2px 0; font-weight:700; }
.heat-c{ aspect-ratio:1; border-radius:5px; background:var(--panel-2); display:flex; align-items:center;
  justify-content:center; font-size:.68em; color:var(--ink-soft); }
.heat-c.l1{ background:color-mix(in srgb,var(--accent) 18%,var(--panel-2)); }
.heat-c.l2{ background:color-mix(in srgb,var(--accent) 38%,var(--panel-2)); }
.heat-c.l3{ background:color-mix(in srgb,var(--accent) 62%,var(--panel-2)); color:var(--accent-ink); }
.heat-c.l4{ background:var(--accent); color:var(--panel); font-weight:700; }

/* 9. אזהרת נסיעה */
.travel-warn{ display:flex; align-items:center; gap:7px; padding:6px 9px; border-radius:9px;
  background:var(--c5,#f0e0c0); color:var(--c5i,#5a4520); font-size:.8em; margin-bottom:5px; }

/* 10–11. אזכרות וימי הולדת */
.anniv-row{ display:flex; align-items:center; gap:7px; padding:5px 8px; border-radius:8px;
  background:var(--panel-2); margin-bottom:4px; font-size:.85em; }
.anniv-row .ic{ font-size:1.1em; }

/* 12. תקופות שקטות */
.qp-badge{ font-size:.68em; padding:1px 6px; border-radius:20px; background:var(--panel-2);
  color:var(--ink-soft); border:1px solid var(--line); white-space:nowrap; }
.qp-badge.qp-quiet{ background:color-mix(in srgb,var(--ink-soft) 14%,var(--panel-2)); }
.qp-badge.qp-ok{ background:var(--accent-soft); color:var(--accent-ink); }
.qp-card{ border:1px solid var(--line); border-radius:11px; padding:11px 13px; display:flex;
  flex-direction:column; gap:4px; }
.qp-card .ttl{ font-weight:700; }
.qp-card .meta{ font-size:.82em; color:var(--ink-soft); }
.qp-card .btn{ align-self:flex-start; margin-top:5px; }
td.qp, .m-cell.qp{ background:repeating-linear-gradient(45deg,transparent,transparent 5px,
  color-mix(in srgb,var(--ink-soft) 8%,transparent) 5px,color-mix(in srgb,var(--ink-soft) 8%,transparent) 10px); }

/* 15. הוספה מהירה */
.qa-input{ width:100%; font:inherit; font-size:1.12em; padding:11px 13px; border-radius:11px;
  border:1px solid var(--line); background:var(--panel-2); color:var(--ink); }
.qa-input:focus{ outline:none; border-color:var(--accent); }
.qa-kind{ margin:9px 0; }
.qa-preview{ min-height:52px; background:var(--accent-soft); border-radius:11px; padding:10px 13px;
  display:flex; flex-direction:column; gap:5px; }
.qa-preview:empty{ display:none; }
.qa-line{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.qa-line.meta{ font-size:.8em; color:var(--accent-ink); }
.qa-tag{ background:var(--panel); border-radius:20px; padding:1px 9px; font-size:.9em; }

/* 17. תכנון אוטומטי */
.plan-row{ align-items:center; gap:9px; padding:4px 2px; border-bottom:1px solid var(--line); }
.plan-t{ font-weight:700; min-width:46px; color:var(--accent-ink); }

/* 18. קנבן */
.kb-board{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.kb-col{ background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:9px; }
.kb-col h5{ margin:0 0 8px; font-size:.8em; display:flex; justify-content:space-between;
  color:var(--ink-soft); font-weight:700; }
.kb-col h5 .cnt{ background:var(--panel); border-radius:20px; padding:1px 8px; }
.kb-drop{ min-height:90px; display:flex; flex-direction:column; gap:6px; border-radius:9px; padding:2px; }
.kb-drop.over{ background:var(--accent-soft); outline:2px dashed var(--accent); }
.kb-card{ background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:7px 9px; cursor:grab; }
.kb-card.dragging{ opacity:.45; }
.kb-card .ttl{ font-size:.88em; font-weight:600; }
.kb-card .meta{ display:flex; gap:6px; flex-wrap:wrap; font-size:.72em; color:var(--ink-soft); margin-top:3px;
  align-items:center; }
.kb-cat{ color:#fff; border-radius:20px; padding:0 7px; font-size:.92em; }
.kb-col.kb-wip{ border-color:var(--accent); }
.kb-col.kb-done .kb-card .ttl{ text-decoration:line-through; opacity:.65; }

/* 19. אזהרת גשם */
.rain-warn{ background:#2b6cb0; color:#fff; border-radius:20px; padding:1px 8px; font-size:.72em;
  white-space:nowrap; font-weight:700; }

/* 20. צ׳קליסטים */
.cl-card{ border:1px solid var(--line); border-radius:11px; padding:9px 11px; }

/* 22. קיר הסטודיו */
.wall-screen{ position:fixed; inset:0; z-index:120; background:var(--bg); display:none;
  overflow:auto; padding:26px clamp(16px,4vw,50px); }
.wall-screen.open{ display:block; }
.wall-x{ position:fixed; inset-block-start:14px; inset-inline-start:16px; z-index:2; font-size:1.3em;
  background:var(--panel); border:1px solid var(--line); border-radius:50%; width:40px; height:40px;
  cursor:pointer; color:var(--ink); }
.wall-head{ display:flex; align-items:center; gap:clamp(14px,3vw,34px); border-bottom:2px solid var(--line);
  padding-bottom:16px; margin-bottom:20px; flex-wrap:wrap; }
.wall-clock{ font-size:clamp(3rem,9vw,6rem); font-weight:800; line-height:1; letter-spacing:-2px; }
.wall-date{ font-size:clamp(1.1rem,2.6vw,1.9rem); font-weight:700; }
.wall-heb{ font-size:clamp(.9rem,2vw,1.4rem); color:var(--ink-soft); }
.wall-list{ display:flex; flex-direction:column; gap:9px; }
.wall-row{ display:flex; align-items:center; gap:clamp(10px,2vw,24px); padding:clamp(9px,1.6vw,16px) 14px;
  background:var(--panel); border:1px solid var(--line); border-radius:14px; }
.wall-row.next{ border-color:var(--accent); border-width:2px; background:var(--accent-soft); }
.wall-row.past{ opacity:.4; }
.wall-t{ font-size:clamp(1.3rem,3.4vw,2.4rem); font-weight:800; min-width:clamp(80px,10vw,150px); }
.wall-what{ font-size:clamp(1.05rem,2.4vw,1.8rem); font-weight:600; }
.wall-sub{ font-size:clamp(.8rem,1.5vw,1.1rem); color:var(--ink-soft); }
.wall-empty{ font-size:clamp(1.1rem,3vw,2rem); color:var(--ink-soft); text-align:center; padding:40px; }
.wall-tasks{ margin-top:22px; }
.wall-tasks h4{ font-size:clamp(.95rem,1.8vw,1.3rem); color:var(--ink-soft); margin:0 0 9px; }
.wall-task{ font-size:clamp(.95rem,1.9vw,1.4rem); padding:4px 0; }
.wall-foot{ margin-top:22px; padding-top:14px; border-top:1px solid var(--line);
  font-size:clamp(.85rem,1.6vw,1.2rem); color:var(--ink-soft); }

/* 24. תצוגה מפוצלת */
.split-pane{ background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:12px 14px;
  display:flex; flex-direction:column; gap:9px; align-self:flex-start; }
.split-head{ display:flex; align-items:center; gap:9px; border-bottom:1px solid var(--line); padding-bottom:8px; }
.split-head input{ font:inherit; font-size:.85em; padding:4px 7px; border-radius:7px;
  border:1px solid var(--line); background:var(--panel-2); color:var(--ink); }
.split-sec h5{ margin:0 0 4px; font-size:.74em; color:var(--ink-soft); font-weight:700; letter-spacing:.4px; }
.split-row{ display:flex; gap:8px; font-size:.85em; padding:2px 0; }
.split-row .ltr-num{ min-width:42px; color:var(--accent-ink); font-weight:600; }
.split-row.done{ opacity:.5; text-decoration:line-through; }
body.split-on #view-day{ display:grid; grid-template-columns:1fr minmax(230px,290px); gap:12px;
  align-items:start; }
body.split-on #view-day > .day-grid{ grid-column:1; }
body.split-on #view-day > .split-pane{ grid-column:2; grid-row:1/-1; position:sticky; top:8px; }
@media (max-width:900px){ body.split-on #view-day{ grid-template-columns:1fr; }
  body.split-on #view-day > .split-pane{ grid-column:1; grid-row:auto; position:static; } }

/* 25. מצב צפוף */
body.compact{ --radius-sm:7px; }
body.compact .card .body{ padding:8px 10px; gap:6px; }
body.compact .card h3{ padding:7px 11px; font-size:.85em; }
body.compact .row{ gap:5px; }
body.compact .line-input, body.compact input, body.compact select{ padding:3px 6px; }
body.compact .sched-row{ min-height:24px; }
body.compact .grid{ gap:9px; }
body.compact .area{ min-height:44px; }

/* 26. מקשי קיצור */
.sc-row{ display:flex; align-items:center; gap:12px; padding:5px 2px; border-bottom:1px solid var(--line); }
.sc-row kbd{ font-family:inherit; font-size:.78em; background:var(--panel-2); border:1px solid var(--line);
  border-block-end-width:2px; border-radius:6px; padding:2px 9px; min-width:110px; text-align:center;
  white-space:nowrap; direction:ltr; }

/* 27. תזכורת גיבוי */
.backup-nudge{ position:fixed; inset-block-end:18px; inset-inline-start:18px; z-index:90;
  background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:13px;
  padding:11px 14px; display:flex; align-items:center; gap:10px; font-size:.88em;
  transform:translateY(140%); transition:transform .3s; }
.backup-nudge.show{ transform:none; }

/* 29. בדיקת תקינות */
.int-card{ border:1px solid var(--line); border-inline-start:3px solid var(--c5,#c94); border-radius:10px;
  padding:9px 12px; display:flex; flex-direction:column; gap:4px; }
.int-card .ttl{ font-weight:700; font-size:.92em; }
.int-card .btn{ align-self:flex-start; margin-top:4px; }
.ok-banner{ background:var(--accent-soft); color:var(--accent-ink); border-radius:11px; padding:14px;
  text-align:center; font-weight:700; }

/* 33. סנכרון */
.sync-chip.ok{ background:var(--accent-soft); color:var(--accent-ink); }
.sync-chip.bad{ background:var(--danger); color:#fff; }
.sync-chip.spinning{ animation:sync-spin 1s linear infinite; }
@keyframes sync-spin{ to{ transform:rotate(360deg); } }
.sync-warn{ background:var(--c5,#f0e0c0); color:var(--c5i,#5a4520); padding:11px 13px; border-radius:11px;
  display:flex; flex-direction:column; gap:5px; font-size:.86em; line-height:1.55; }
.sync-remote-row{ display:flex; align-items:center; gap:8px; padding:8px 11px; border:1px solid var(--line);
  border-radius:11px; }
.sync-remote-row .ttl{ font-weight:700; font-size:.9em; }
.sync-remote-row .meta{ font-size:.78em; color:var(--ink-soft); }
.cf-row{ border:1px solid var(--line); border-radius:11px; padding:9px 11px; }
.cf-head{ font-weight:700; font-size:.9em; margin-bottom:7px; }
.cf-opts{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:7px; }
.cf-opt{ text-align:start; background:var(--panel-2); border:2px solid var(--line); border-radius:9px;
  padding:7px 9px; cursor:pointer; color:inherit; font:inherit; }
.cf-opt:hover{ border-color:var(--accent); }
.cf-opt.on{ border-color:var(--accent); background:var(--accent-soft); }
.cf-lbl{ font-weight:700; font-size:.8em; margin-bottom:2px; }
.cf-txt{ font-size:.76em; color:var(--ink-soft); line-height:1.4;
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.cf-opt.on .cf-txt{ color:var(--accent-ink); }
.sync-url{ font-family:ui-monospace,Consolas,monospace; direction:ltr; background:var(--panel-2);
  border:1px solid var(--line); border-radius:8px; padding:6px 9px; font-size:.85em; user-select:all;
  display:block; margin:3px 0; }

/* 31. מצב עריכת פריסה */
.layout-bar{ position:fixed; inset-block-end:16px; inset-inline:50% auto; transform:translate(50%,140%);
  z-index:95; background:var(--panel); border:1px solid var(--accent); box-shadow:var(--shadow);
  border-radius:14px; padding:9px 14px; display:flex; align-items:center; gap:11px; flex-wrap:wrap;
  transition:transform .28s; max-width:calc(100vw - 24px); }
.layout-bar.show{ transform:translate(50%,0); }
.layout-bar .lb-t{ font-weight:700; }
.layout-bar .lb-h{ font-size:.78em; color:var(--ink-soft); }
body.layout-edit .card{ position:relative; }
body.layout-edit .le-card{ outline:1px dashed var(--accent); outline-offset:2px; cursor:grab; }
body.layout-edit .le-card.le-dragging{ opacity:.4; }
body.layout-edit .le-card input, body.layout-edit .le-card textarea,
body.layout-edit .le-card select, body.layout-edit .le-card .chk{ pointer-events:none; }
/* רצועת הכותרת היא ידית הגרירה — touch-action:none מונע מהדפדפן לגלול במקום לגרור */
.le-tools{ display:flex; align-items:center; gap:5px; padding:5px 8px; background:var(--accent-soft);
  color:var(--accent-ink); border-radius:9px 9px 0 0; font-size:.76em;
  touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none; }
.le-tools:active{ cursor:grabbing; }
.le-tools .le-name{ flex:1; font-weight:700; }
.le-grip{ opacity:.7; font-size:1.15em; }
.le-btn{ background:var(--panel); border:1px solid var(--line); border-radius:6px; cursor:pointer;
  color:inherit; font:inherit; line-height:1; padding:3px 8px; touch-action:manipulation; }
.le-btn:hover{ border-color:var(--accent); }
.le-btn.danger{ color:var(--danger); }
.le-drop{ height:9px; border-radius:6px; margin:2px 0; transition:height .12s,background .12s; }
body.layout-edit .le-drop{ height:14px; background:color-mix(in srgb,var(--accent) 12%,transparent); }
body.layout-edit .le-drop.over{ height:52px; background:var(--accent-soft);
  outline:2px dashed var(--accent); }
body.le-dragging-now{ overscroll-behavior:none; }
body.le-dragging-now *{ user-select:none !important; -webkit-user-select:none !important; }
.le-ghost{ position:fixed; inset-block-start:0; inset-inline-start:0; z-index:200; pointer-events:none;
  background:var(--accent); color:var(--panel); font-size:.8em; font-weight:700; padding:7px 13px;
  border-radius:9px; box-shadow:var(--shadow); margin-inline-start:-40px; margin-block-start:-16px;
  white-space:nowrap; opacity:.95; }

/* במסך צר הכפתורים גדולים יותר, והגרירה פחות הכרחית */
@media (max-width:760px){
  .le-tools{ font-size:.82em; padding:7px 9px; gap:7px; flex-wrap:wrap; }
  .le-btn{ padding:6px 11px; font-size:1em; }
  body.layout-edit .le-drop{ height:20px; }
  body.layout-edit .le-drop.over{ height:60px; }
}

/* 30. היום לפני שנה */
.otd-row{ border-inline-start:3px solid var(--accent); padding:5px 10px; margin-bottom:7px; cursor:pointer;
  border-radius:0 8px 8px 0; }
.otd-row:hover{ background:var(--panel-2); }
.otd-head{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:.85em; }
.otd-bits{ font-size:.8em; color:var(--ink-soft); margin-top:2px; }

@media (max-width:860px){
  .lead-board{ grid-template-columns:repeat(5,minmax(140px,1fr)); }
  .kb-board{ grid-template-columns:1fr; }
  .heat-grid{ font-size:.85em; }
}

/* ---------- סרגל צד לניווט ---------- */
.side-nav{
  position: fixed; inset-block: 0; inset-inline-end: 0; width: 210px; z-index: 55;
  background: var(--panel); border-inline-start: 1px solid var(--line);
  box-shadow: var(--shadow); padding: 12px 10px; overflow-y: auto;
  transform: translateX(-100%); transition: transform .24s;
  display: none; flex-direction: column; gap: 10px;
}
body.sidenav-on .side-nav{ display: flex; transform: none; }
body.sidenav-on main{ margin-inline-end: 210px; }
body.sidenav-on .app-bar{ padding-inline-end: 222px; }
.side-nav h5{ margin: 0; font-size: .74em; letter-spacing: 1px; color: var(--ink-soft); font-weight: 700; }
.side-jump{
  all: unset; cursor: pointer; display: flex; justify-content: space-between; gap: 6px;
  padding: 5px 8px; border-radius: var(--radius-sm); font-size: .84em;
}
.side-jump:hover{ background: var(--sel); }
.side-jump.today{ background: var(--accent-soft); color: var(--accent-ink); font-weight: 700; }
.side-jump .n{ font-family: var(--font-num); color: var(--ink-soft); }
@media (max-width: 1200px){ body.sidenav-on .side-nav{ display: none; } body.sidenav-on main{ margin-inline-end: 0; }
                            body.sidenav-on .app-bar{ padding-inline-end: 18px; } }

/* ---------- בחירה מרובה ---------- */
.batch-bar{
  position: sticky; top: 62px; z-index: 20;
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 7px 12px; margin-bottom: 8px; border-radius: var(--radius-sm);
