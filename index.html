  const mFrom = today.slice(0, 8) + '01';

  const openJobs = DB.jobs.filter(j => j.status !== 'paid');
  const owedTotal = DB.jobs.reduce((s, j) => s + Math.max(0, Number(j.price || 0) - Number(j.paid || 0)), 0);
  const monthIncome = DB.jobs.filter(j => j.iso && j.iso >= mFrom)
                             .reduce((s, j) => s + Number(j.paid || 0), 0) +
                       DB.finance.filter(f => f.kind === 'in' && f.iso >= mFrom).reduce((s, f) => s + Number(f.amount || 0), 0);
  const weekTo = isoOf(addDays(new Date(), 7));
  const jobsThisWeek = DB.jobs.filter(j => j.iso && j.iso >= today && j.iso <= weekTo).length;
  const ls = leadStats();

  /* שורת "טעון תשומת לב" — רק אם יש מה להראות, כדי לא להציף כשהכול תקין */

function csvEscape(v){
  const s = String(v == null ? '' : v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadCSV(rows, name){
  const body = rows.map(r => r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob(['﻿' + body], { type: 'text/csv;charset=utf-8' });
  const a = el('a', { href: URL.createObjectURL(blob), download: name });
  document.body.appendChild(a); a.click(); a.remove();
  toast('הקובץ הורד');
}
function exportFinanceCSV(fromIso, toIso){
  const rows = [['תאריך', 'סוג', 'סכום', 'תיאור', 'לקוח']];
  DB.finance.filter(f => f.iso >= fromIso && f.iso <= toIso)
    .sort((a, b) => a.iso.localeCompare(b.iso))
    .forEach(f => rows.push([f.iso, f.kind === 'in' ? 'הכנסה' : 'הוצאה', f.amount, f.note || f.cat || '', contactName(f.who)]));
  downloadCSV(rows, `כספים-${fromIso}-${toIso}.csv`);
}
function exportTimeCSV(fromIso, toIso){
  const rows = [['תאריך', 'לקוח', 'דקות', 'שעות', 'תעריף', 'לחיוב', 'תיאור']];
  DB.timeLogs.filter(t => t.iso >= fromIso && t.iso <= toIso)
    .sort((a, b) => a.iso.localeCompare(b.iso))
    .forEach(t => {
      const rate = Number(t.rate) || DB.settings.defaultRate || 0;
      rows.push([t.iso, contactName(t.who), t.minutes, (t.minutes / 60).toFixed(2), rate,
                 Math.round(t.minutes / 60 * rate), t.note || '']);
    });
  downloadCSV(rows, `שעות-${fromIso}-${toIso}.csv`);
}

function goalProgress(g){
  const from = g.from || isoOf(new Date(new Date().getFullYear(), 0, 1));
  const to = g.to || isoOf(new Date(new Date().getFullYear(), 11, 31));
  if (g.source === 'money') return financeSum(from, to).inc;
  if (g.source === 'hours')
    return Math.round(DB.timeLogs.filter(t => t.iso >= from && t.iso <= to)
      .reduce((s, t) => s + (Number(t.minutes) || 0), 0) / 60);
  if (g.source === 'jobs')
    return DB.jobs.filter(j => j.iso >= from && j.iso <= to && (!g.cat || j.kind === g.cat)).length;
  if (g.source === 'tasks'){
    let n = 0;
    Object.entries(DB.days).forEach(([iso, r]) => {
      if (iso < from || iso > to) return;
      (r.todos || []).forEach(t => { if (t && t.d && (!g.cat || t.cat === g.cat)) n++; });
    });
    return n;
  }
  return Number(g.manual) || 0;
}

/* ======================= התנגשויות בין פגישות ======================= */
const toMin = t => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); return m ? +m[1] * 60 + +m[2] : null; };
function apptConflicts(iso){
  const arr = ((DB.days[iso] || {}).appts || [])
    .map((a, i) => ({ a, i, s: toMin(a.time), e: toMin(a.end) }))
    .filter(x => x.s != null && (x.a.what || '').trim());
  const bad = new Set();
  for (let i = 0; i < arr.length; i++)
    for (let j = i + 1; j < arr.length; j++){
      const A = arr[i], B = arr[j];
      const ae = A.e != null ? A.e : A.s + 60, be = B.e != null ? B.e : B.s + 60;
      if (A.s < be && B.s < ae){ bad.add(A.a); bad.add(B.a); }
    }
  return bad;
}

function copyDayData(srcIso, dstIso, replace){
  const src = DB.days[srcIso];
  if (!src) return 0;
  const w = dayW(dstIso);
  if (replace){ w.schedule = {}; w.goals = ['', '', '']; w.todos = []; w.appts = []; }
  Object.entries(src.schedule || {}).forEach(([t, v]) => { if (v) w.schedule[t] = v; });
  (src.goals || []).forEach((g, i) => { if (g && !(w.goals[i] || '').trim()) w.goals[i] = g; });
  (src.todos || []).filter(t => t && (t.t || '').trim())
    .forEach(t => w.todos.push(Object.assign(TODO_DEFAULT(), JSON.parse(JSON.stringify(t)), { d: false, doneAt: 0 })));
  (src.appts || []).filter(a => a && (a.what || '').trim())
    .forEach(a => w.appts.push(Object.assign(APPT_DEFAULT(), JSON.parse(JSON.stringify(a)), { uid: '' })));
  return 1;
}

let RECOG = null;
function dictationSupported(){ return !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function micButton(target){
  if (!dictationSupported()) return null;
  const btn = el('button', { class: 'mic-btn', title: 'הכתבה קולית', type: 'button' }, '🎤');
  btn.addEventListener('click', () => {
    if (RECOG){ try { RECOG.stop(); } catch(e){} RECOG = null; btn.classList.remove('on'); return; }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    RECOG = new SR();
    RECOG.lang = DB.settings.dictationLang || 'he-IL';
    RECOG.interimResults = true;
    RECOG.continuous = false;
    const base = target.value || '';
    btn.classList.add('on');
    RECOG.onresult = e => {
      let txt = '';
      for (let i = e.resultIndex; i < e.results.length; i++) txt += e.results[i][0].transcript;
      target.value = (base ? base + ' ' : '') + txt;
      target.dispatchEvent(new Event('input'));
    };
    RECOG.onerror = ev => { toast('הכתבה נכשלה: ' + ev.error); btn.classList.remove('on'); RECOG = null; };
    RECOG.onend = () => { btn.classList.remove('on'); RECOG = null; };
    try { RECOG.start(); } catch(e){ btn.classList.remove('on'); RECOG = null; }
  });
  return btn;
}

let MEDIA = { rec: null, chunks: [], stream: null };
function voiceCard(iso){
  const box = el('div');
  const draw = () => {
    box.innerHTML = '';
    const list = dayRec(iso, false).voice || [];
    if (!list.length) box.appendChild(el('div', { class: 'empty-note', text: 'אין הקלטות ביום הזה' }));
    list.forEach((v, i) => {
      const au = el('audio', { controls: 'controls', src: v.data });
      box.appendChild(el('div', { class: 'rec-row' }, [
        au,
        el('span', { style: 'font-size:.72em;color:var(--ink-soft)', text: v.at ? new Date(v.at).toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' }) : '' }),
        el('button', { class: 'del', onclick: () => {
          dayW(iso).voice.splice(i, 1); saveDB(); draw();
        } }, '✕')
      ]));
    });
    const btn = el('button', { class: 'btn sm' + (MEDIA.rec ? ' danger' : ''),
      text: MEDIA.rec ? '■ עצירה' : '⏺ הקלטה' });
    btn.addEventListener('click', async () => {
      if (MEDIA.rec){
        MEDIA.rec.stop();
        return;
      }
      try {
        MEDIA.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch(e){ alert('אין גישה למיקרופון. יש לאשר הרשאה בדפדפן.'); return; }
      MEDIA.chunks = [];
      MEDIA.rec = new MediaRecorder(MEDIA.stream);
      MEDIA.rec.ondataavailable = e => MEDIA.chunks.push(e.data);
      MEDIA.rec.onstop = () => {
        const blob = new Blob(MEDIA.chunks, { type: MEDIA.rec.mimeType || 'audio/webm' });
        MEDIA.stream.getTracks().forEach(t => t.stop());
        MEDIA.rec = null; MEDIA.stream = null;
        if (blob.size > 2.5 * 1024 * 1024){ alert('ההקלטה ארוכה מדי (מעל 2.5 מ״ב). נסה הקלטה קצרה יותר.'); draw(); return; }
        const fr = new FileReader();
        fr.onload = () => {

function pickFiles(iso, after){
  const inp = el('input', { type: 'file', multiple: 'multiple', accept: 'image/*,application/pdf,.txt,.csv' });
  inp.addEventListener('change', async () => {
    const files = Array.from(inp.files || []);
    const limit = (DB.settings.attachLimitMB || 3) * 1024 * 1024;
    for (const f of files){
      if (f.size > limit){ alert(`הקובץ "${f.name}" גדול מ-${DB.settings.attachLimitMB} מ״ב ולא צורף.`); continue; }
      const data = /^image\//.test(f.type) ? await shrinkImage(f) : await readAsDataURL(f);
      dayW(iso).files.push({ name: f.name, type: f.type, size: data.length, data, at: Date.now() });
    }
    saveDB(); if (after) after();
    toast('הקבצים צורפו');
  });
  inp.click();
}
const readAsDataURL = f => new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.readAsDataURL(f); });
/** מקטין תמונות לפני שמירה, כדי לא למלא את אחסון הדפדפן */
function shrinkImage(file){
  return new Promise(async res => {
    const url = await readAsDataURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 1280;
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      if (scale === 1 && url.length < 700000){ res(url); return; }
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.width * scale); cv.height = Math.round(img.height * scale);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      res(cv.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => res(url);
    img.src = url;
  });
}

/* ======================= ניתוח פרודוקטיביות ======================= */
function productivityData(days){
  const grid = Array.from({ length: 7 }, () => Array(24).fill(0));
  const from = isoOf(addDays(new Date(), -(days || 90)));
  Object.entries(DB.days).forEach(([iso, r]) => {
    if (iso < from) return;
    (r.todos || []).forEach(t => {
      if (!t || !t.d || !t.doneAt) return;
      const d = new Date(t.doneAt);
      grid[d.getDay()][d.getHours()]++;
    });
  });
  return grid;
}
function heatmap(grid){
  const max = Math.max(1, ...grid.flat());
  const head = el('tr', {}, [ el('th', { text: '' }) ]);
  for (let h = 0; h < 24; h += 2) head.appendChild(el('th', { colspan: '2', text: pad2(h) }));
  const body = el('tbody');
  grid.forEach((row, dw) => {
    const tr = el('tr', {}, [ el('td', { class: 'lbl', text: DOW_SHORT[dw] }) ]);
    row.forEach((v, h) => {
      const a = v ? (0.18 + 0.82 * v / max) : 0;
      tr.appendChild(el('td', {}, el('i', {
        style: v ? `background:color-mix(in srgb, var(--accent) ${Math.round(a * 100)}%, var(--line))` : '',
        title: `${DOW_LONG[dw]} ${pad2(h)}:00 — ${v} משימות`
      })));
    });
    body.appendChild(tr);
  });
  return el('table', { class: 'heat' }, [ el('thead', {}, head), body ]);
}
function openProductivity(){
  const grid = productivityData(90);
  const total = grid.flat().reduce((a, b) => a + b, 0);
  let bestH = 0, bestHv = 0, bestD = 0, bestDv = 0;
  for (let h = 0; h < 24; h++){ const s = grid.reduce((a, r) => a + r[h], 0); if (s > bestHv){ bestHv = s; bestH = h; } }
  grid.forEach((r, i) => { const s = r.reduce((a, b) => a + b, 0); if (s > bestDv){ bestDv = s; bestD = i; } });
  openModal('ניתוח פרודוקטיביות — 90 יום', [
    total ? el('div', { class: 'imp-stats' }, [
      el('div', { class: 'stat-box good' }, [ el('div', { class: 'v', text: pad2(bestH) + ':00' }), el('div', { class: 'k', text: 'השעה הפרודוקטיבית' }) ]),
      el('div', { class: 'stat-box' }, [ el('div', { class: 'v', text: DOW_LONG[bestD].replace('יום ', '') }), el('div', { class: 'k', text: 'היום החזק' }) ]),
      el('div', { class: 'stat-box' }, [ el('div', { class: 'v', text: String(total) }), el('div', { class: 'k', text: 'משימות הושלמו' }) ])
    ]) : el('div', { class: 'empty-note', text: 'עדיין אין מספיק נתונים. סמן משימות כבוצעו והנתונים ייאספו מעצמם.' }),
    el('div', { class: 'wd-section-label', text: 'מתי אתה באמת מסיים משימות' }),
    heatmap(grid),
    el('div', { class: 'hint', text: 'הנתונים נאספים מרגע שסימנת משימה כבוצעה, ולכן הם מתמלאים עם הזמן. אין כאן שום הערכה או ניחוש.' })
  ], [ el('button', { class: 'btn', onclick: closeModal }, 'סגירה') ]);
}

const Focus = {
  task: null,
  open(task){
    this.task = task || null;
    document.body.classList.add('focus-mode');
    $('#focusScreen').classList.add('open');
    this.paint();
    clearInterval(this._t); this._t = setInterval(() => this.paint(), 1000);
  },
  close(){
    document.body.classList.remove('focus-mode');
    $('#focusScreen').classList.remove('open');
    clearInterval(this._t);
    renderAll(true);
  },
  paint(){
    const s = $('#focusScreen'); if (!s.classList.contains('open')) return;
    s.innerHTML = '';
    if (!this.task){
      const iso = isoOf(State.cursor);
      const open = (dayRec(iso, false).todos || []).filter(t => t && (t.t || '').trim() && !t.d);
      const pick = el('div', { class: 'focus-pick' });

      open.slice(0, 8).forEach(t => pick.appendChild(el('button', { class: 'btn', style: 'justify-content:center',
        onclick: () => { this.task = t; this.paint(); } }, t.t)));
      s.appendChild(pick);
    } else {
      s.appendChild(el('div', { class: 'focus-sub', text: 'מיקוד' }));
      s.appendChild(el('div', { class: 'focus-task', text: this.task.t }));

      ])))
    ]);

    const days = el('table', { class: 'psh-week' }, [
      el('thead', {}, el('tr', {}, [ el('th', { text: 'יום' }), el('th', { text: 'תאריך' }),
                                     el('th', { text: 'מה יש' }) ])),
      el('tbody', {}, Array.from({ length: 7 }, (_, i) => {
        const d = addDays(start, i), iso = isoOf(d), r = DB.days[iso] || {};
        const bits = [];
        jobsForISO(iso).forEach(j => bits.push((j.time ? j.time + ' ' : '') + '📷 ' + (j.title || 'עבודה')));
        sortAppts((r.appts || []).slice()).forEach(a => {
          if (a && (a.what || '').trim()) bits.push((a.time ? a.time + ' ' : '') + a.what);
        });
        (r.todos || []).filter(t => t && !t.d && (t.t || '').trim())
          .slice(0, 3).forEach(t => bits.push('☐ ' + t.t));
        const hol = holidaysForISO(iso).map(e => e.title);
        const qp = quietPeriod(iso);
        return el('tr', { class: d.getDay() === 6 ? 'sat' : '' }, [
          el('td', { text: DOW_LONG[d.getDay()] }),
          el('td', { class: 'n', html: `<bdi dir="ltr">${d.getDate()}/${d.getMonth() + 1}</bdi> · ${hebOf(d).short}` }),
          el('td', { html: [hol.join(' · '), qp ? qp.name : '', bits.join(' · ')]
            .filter(Boolean).join('<br>') })
        ]);
      }))
    ]);
    addSheet([ head, times, days ]);
    return;
  }

  if (kind === 'hebyear'){
    const hy = hebOf(fromISO(fromIso)).y;
    const wrap = el('div', { class: 'pyear' });
    hebMonthOrder(hy).forEach(m => {
      const len = daysInHebMonth(m, hy);
      const first = dateFromHeb(hy, m, 1);
      const tbl = el('table');
      const hr = el('tr');
      DOW_SHORT.forEach(d => hr.appendChild(el('th', { text: d })));
      tbl.appendChild(el('thead', {}, hr));
      const tb = el('tbody');
      let tr = el('tr');
      for (let i = 0; i < first.getDay(); i++) tr.appendChild(el('td', { text: '' }));
      /* V4: אוספים גם את מה שקורה בחודש — חגים, אזכרות, ימי הולדת ועבודות */
      const notes = [];
      for (let d = 1; d <= len; d++){
        const date = dateFromHeb(hy, m, d), iso = isoOf(date);
        const marked = dayMarkLevel(iso) === 2;
        const anniv = hebAnnivForISO(iso);
        const jobs = jobsForISO(iso);
        const cls = [date.getDay() === 6 ? 'sat' : '', marked ? 'hol' : '',
                     (anniv.length || jobs.length) ? 'has' : ''].filter(Boolean).join(' ');
        tr.appendChild(el('td', { class: cls, text: gematriya(d) }));
        holidaysForISO(iso).forEach(e => notes.push([gematriya(d), e.title]));
        anniv.forEach(a => notes.push([gematriya(d),
          (a.kind === 'azkara' ? '🕯 ' : '🎂 ') + (a.name || '')]));
        jobs.forEach(j => notes.push([gematriya(d), '📷 ' + (j.title || 'עבודה')]));
        if (date.getDay() === 6){ tb.appendChild(tr); tr = el('tr'); }
      }
      if (tr.children.length) tb.appendChild(tr);
      tbl.appendChild(tb);
      const noteBox = notes.length
        ? el('div', { class: 'pm-notes' }, notes.slice(0, 12).map(([d, t]) =>
            el('div', {}, [ el('b', { text: d }), el('span', { text: ' ' + t }) ])))
        : null;
      wrap.appendChild(el('div', { class: 'pm' },
        [ el('h3', { text: hebMonthName(m, hy) }), tbl, noteBox ]));
    });
    addSheet([ el('h2', { text: 'לוח שנה עברי ' + gematriya(hy) }),
               el('div', { class: 'sub',
                 text: `${DB.settings.location.name} · מנהג ${(DB.settings.minhag || 'edot') === 'edot' ? 'עדות המזרח' : 'אשכנז'}` }),
               wrap ]);
    return;
  }

  if (kind === 'month'){
    const d = fromISO(fromIso);
    const first = new Date(d.getFullYear(), d.getMonth(), 1);
    const len = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
    const lead = first.getDay(), total = Math.ceil((lead + len) / 7) * 7;
    const tbl = el('table', { class: 'pcal' });
    const hr = el('tr');
    DOW_LONG.forEach(x => hr.appendChild(el('th', { text: x.replace('יום ', '') })));
    tbl.appendChild(el('thead', {}, hr));
    const tb = el('tbody');
    let tr = el('tr');
    for (let i = 0; i < total; i++){
      const date = addDays(first, i - lead), iso = isoOf(date);
      const inM = i >= lead && i < lead + len;
      const evs = holidaysForISO(iso).map(e => e.title).slice(0, 1);
      const rec = dayRec(iso, false);
      tr.appendChild(el('td', { style: inM ? '' : 'background:#fafafa;color:#bbb' }, [
        el('div', { class: 'dn', text: String(date.getDate()) }),
        el('div', { class: 'hd', text: hebOf(date).dLabel }),
        evs.length ? el('div', { class: 'ev', text: evs[0] }) : null,
        rec.note ? el('div', { class: 'ev', text: rec.note.slice(0, 40) }) : null
      ]));
      if ((i + 1) % 7 === 0){ tb.appendChild(tr); tr = el('tr'); }
    }
    tbl.appendChild(tb);
    addSheet([ el('h2', { text: GREG_MONTHS[d.getMonth()] + ' ' + d.getFullYear() }),
               el('div', { class: 'sub', text: hebOf(first).mName + ' ' + hebOf(first).yLabel }), tbl ]);
    return;
  }

  // ימים: דף לכל יום בטווח
  let d = fromISO(fromIso), guard = 0;
  while (isoOf(d) <= toIso && guard++ < 120){
    const iso = isoOf(d), rec = dayRec(iso, false), h = hebOf(d);
    const lines = el('div', { class: 'plines' });
    slotList().forEach(t => lines.appendChild(el('div', { text: t + '   ' + ((rec.schedule || {})[t] || '') })));
    const todos = (rec.todos || []).filter(t => t && (t.t || '').trim());
    const box = el('div');
    if (todos.length){
      box.appendChild(el('div', { style: 'font-weight:700;margin:3mm 0 1mm' }, 'משימות'));
      todos.forEach(t => box.appendChild(el('div', { style: 'font-size:9pt', text: (t.d ? '☑ ' : '☐ ') + t.t })));
    }
    const evs = eventsForISO(iso).filter(e => e.cat === 'holiday' || e.cat === 'candles' || e.cat === 'parashat')
                                 .map(e => e.title + (e.time ? ' ' + e.time : ''));
    addSheet([
      el('h2', { text: `${DOW_LONG[d.getDay()]}, ${d.getDate()} ב${GREG_MONTHS[d.getMonth()]} ${d.getFullYear()}` }),
      el('div', { class: 'sub', text: h.full + (evs.length ? ' · ' + evs.join(' · ') : '') }),
      lines, box
    ]);
    d = addDays(d, 1);
  }
}

/* ======================= תצוגת אג׳נדה ותצוגת כל המשימות ======================= */
function renderAgenda(){
  const v = $('#view-agenda'); v.innerHTML = '';
  const days = DB.settings.agendaDays || 21;
  const start = State.cursor;
  v.appendChild(el('div', { class: 'month-head' }, [
    el('div', { class: 'month-title', html: `אג׳נדה<small>${days} הימים הקרובים מ-${start.getDate()}/${start.getMonth() + 1}</small>` }),
    el('div', { class: 'nav-group no-print' }, [
      mkSelect([[7, 'שבוע'], [14, 'שבועיים'], [21, '3 שבועות'], [30, 'חודש'], [60, 'חודשיים']], days,
        val => { DB.settings.agendaDays = Number(val); saveDB(); renderAgenda(); })
    ])
  ]));
  const wrap = el('div', { class: 'card' }, el('div', { class: 'body' }));
  const body = wrap.querySelector('.body');
  let any = false;
  for (let i = 0; i < days; i++){
    const d = addDays(start, i), iso = isoOf(d), rec = dayRec(iso, false);
    const conflicts = apptConflicts(iso);
    const items = [];
    eventsForISO(iso).filter(e => e.cat === 'holiday' || e.cat === 'candles' || e.cat === 'havdalah')
      .forEach(e => items.push({ t: e.time || '', x: e.title, sub: '', cls: 'hol' }));
    personalEventsForISO(iso).forEach(x => items.push({ t: '', x: evIcon(x.ev) + ' ' + eventTitleFor(x), sub: '' }));
    contactBirthdaysForISO(iso).forEach(x => items.push({ t: '', x: '🎈 ' + x.c.name, sub: 'יום הולדת' }));
    jobsForISO(iso).forEach(j => items.push({ t: j.time || '', x: '📷 ' + (j.title || ''), sub: contactName(j.who) }));
    (rec.appts || []).filter(a => a && (a.what || '').trim())
      .forEach(a => items.push({ t: a.time || '', x: a.what, sub: [a.where, a.note ? a.note.split('\n')[0] : ''].filter(Boolean).join(' · '),
                                 conflict: conflicts.has(a) }));
    (rec.todos || []).filter(t => t && (t.t || '').trim())
      .forEach(t => items.push({ t: '', x: t.t, sub: contactName(t.who), done: t.d }));
    recurringFor(d).forEach(r => items.push({ t: '', x: r.title, sub: 'קבוע', done: !!(rec.recDone || {})[r.id] }));
    if (!items.length) continue;
    any = true;
    items.sort((a, b) => (a.t || 'zz').localeCompare(b.t || 'zz'));
    const head = el('div', { class: 'agenda-head' }, [
      el('b', { text: `${DOW_LONG[d.getDay()]}, ${d.getDate()}/${d.getMonth() + 1}`,
                class: sameISO(d, new Date()) ? 'tdy' : '' }),
      el('span', { text: hebOf(d).short })
    ]);
    const dayBox = el('div', { class: 'agenda-day' }, head);
    items.forEach(it => dayBox.appendChild(el('div', { class: 'agenda-item' + (it.done ? ' done' : ''),
      onclick: () => { State.cursor = d; setView('day'); } }, [
      el('span', { class: 'tm', text: it.t }),
      el('span', { class: 'tx' }, [ document.createTextNode(it.x),
        it.sub ? el('small', { text: it.sub }) : null ]),
      it.conflict ? el('span', { class: 'conflict', text: '⚠ חפיפה' }) : null
    ])));
    body.appendChild(dayBox);
  }
  if (!any) body.appendChild(el('div', { class: 'empty-note', text: 'אין שום דבר מתוכנן בטווח הזה.' }));
  v.appendChild(wrap);
}

const TASK_FILTERS = { q: '', cat: '', who: '', status: 'open', from: '', to: '', tag: '' };
function renderTasks(){
  const v = $('#view-tasks'); v.innerHTML = '';
  v.appendChild(el('div', { class: 'month-head' }, [
    el('div', { class: 'month-title', html: 'כל המשימות<small>מכל התאריכים, במקום אחד</small>' })
  ]));

  const filters = el('div', { class: 'filters no-print' });
  const q = el('input', { type: 'text', placeholder: 'חיפוש…', value: TASK_FILTERS.q });
  q.addEventListener('input', () => { TASK_FILTERS.q = q.value; draw(); });
  filters.appendChild(q);
  const mic = micButton(q); if (mic) filters.appendChild(mic);
  filters.appendChild(mkSelect([['open', 'פתוחות'], ['done', 'הושלמו'], ['all', 'הכול']],
    TASK_FILTERS.status, val => { TASK_FILTERS.status = val; draw(); }));
  filters.appendChild(mkSelect([['', 'כל הקטגוריות']].concat(DB.cats.map(c => [c.id, c.name])),
    TASK_FILTERS.cat, val => { TASK_FILTERS.cat = val; draw(); }));
  filters.appendChild(mkSelect([['', 'כל הלקוחות']].concat(DB.contacts.map(c => [c.id, c.name])),
    TASK_FILTERS.who, val => { TASK_FILTERS.who = val; draw(); }));
  const f1 = el('input', { type: 'date', value: TASK_FILTERS.from, title: 'מתאריך' });
  f1.addEventListener('change', () => { TASK_FILTERS.from = f1.value; draw(); });
  const f2 = el('input', { type: 'date', value: TASK_FILTERS.to, title: 'עד תאריך' });
  f2.addEventListener('change', () => { TASK_FILTERS.to = f2.value; draw(); });
  filters.appendChild(f1); filters.appendChild(f2);
  filters.appendChild(el('button', { class: 'btn sm', onclick: () => {
    TASK_FILTERS.q = ''; TASK_FILTERS.cat = ''; TASK_FILTERS.who = ''; TASK_FILTERS.status = 'open';
    TASK_FILTERS.from = ''; TASK_FILTERS.to = ''; TASK_FILTERS.tag = ''; renderTasks();
  } }, 'ניקוי'));
  v.appendChild(filters);

  /* תגיות */
  const tags = allTags();
  if (tags.length){
    const tb = el('div', { class: 'tag-bar no-print' });
    tags.slice(0, 24).forEach(([t, n]) => tb.appendChild(el('button', {
      class: 'cat-pill', 'aria-pressed': String(TASK_FILTERS.tag === t),
      onclick: () => { TASK_FILTERS.tag = TASK_FILTERS.tag === t ? '' : t; renderTasks(); }
    }, [ el('span', { text: '#' + t + ' · ' + n }) ])));
    v.appendChild(tb);
  }

  /* בחירה מרובה */
  const SEL = new Set();
  const batchBar = el('div', { class: 'batch-bar no-print', style: 'display:none' });
  v.appendChild(batchBar);
  const paintBatch = () => {
    batchBar.style.display = SEL.size ? '' : 'none';
    if (!SEL.size) return;
    batchBar.innerHTML = '';
    batchBar.appendChild(el('span', { html: `נבחרו <b>${SEL.size}</b> משימות` }));
    batchBar.appendChild(el('button', { class: 'btn sm', onclick: () => {
      SEL.forEach(x => { x.t.d = true; x.t.doneAt = Date.now(); });
      SEL.clear(); saveDB(); draw();
    } }, '✓ סמן כבוצע'));
    batchBar.appendChild(el('button', { class: 'btn sm', onclick: () => {
      const target = prompt('להעביר לאיזה תאריך? (YYYY-MM-DD)', todayISO());
      if (!target || !/^\d{4}-\d{2}-\d{2}$/.test(target)) return;
      SEL.forEach(x => {
        const src = DB.days[x.iso];
        if (src) src.todos = src.todos.filter(t => t !== x.t);
        dayW(target).todos.push(x.t);
      });
      SEL.clear(); saveDB(); draw();
    } }, '📅 העבר לתאריך'));
    batchBar.appendChild(mkSelect([['', 'שיוך קטגוריה…']].concat(DB.cats.map(c => [c.id, c.name])), '', val => {
      if (!val) return;
      SEL.forEach(x => { x.t.cat = val; });
      SEL.clear(); saveDB(); draw();
    }));
    batchBar.appendChild(mkSelect([['', 'שיוך לקוח…']].concat(DB.contacts.map(c => [c.id, c.name])), '', val => {
      if (!val) return;
      SEL.forEach(x => { x.t.who = val; });
      SEL.clear(); saveDB(); draw();
    }));
    batchBar.appendChild(el('button', { class: 'btn sm danger', onclick: () => {
      if (!confirm(`למחוק ${SEL.size} משימות? הן יעברו לסל המיחזור.`)) return;
      SEL.forEach(x => {
        trashPush('todo', x.t.t, x.t, { bucket: 'day', iso: x.iso });
        const src = DB.days[x.iso];
        if (src) src.todos = src.todos.filter(t => t !== x.t);
      });
      SEL.clear(); saveDB(); draw();
    } }, '🗑 מחיקה'));
    batchBar.appendChild(el('button', { class: 'btn sm ghost', onclick: () => { SEL.clear(); draw(); } }, 'ביטול בחירה'));
  };

  const card_ = el('div', { class: 'card' }, el('div', { class: 'body' }));
  const body = card_.querySelector('.body');
  const draw = () => {
    body.innerHTML = '';
    const needle = TASK_FILTERS.q.trim().toLowerCase();
    const rows = [];
    Object.entries(DB.days).forEach(([iso, r]) => {
      if (TASK_FILTERS.from && iso < TASK_FILTERS.from) return;
      if (TASK_FILTERS.to && iso > TASK_FILTERS.to) return;
      (r.todos || []).forEach(t => {
        if (!t || !(t.t || '').trim()) return;
        if (TASK_FILTERS.status === 'open' && t.d) return;
        if (TASK_FILTERS.status === 'done' && !t.d) return;
        if (TASK_FILTERS.cat && t.cat !== TASK_FILTERS.cat) return;
        if (TASK_FILTERS.who && t.who !== TASK_FILTERS.who) return;
        if (TASK_FILTERS.tag && !tagsOf(t.t).includes(TASK_FILTERS.tag)) return;
        if (needle && !(t.t + ' ' + contactName(t.who)).toLowerCase().includes(needle)) return;
        rows.push({ iso, t });
      });
    });
    rows.sort((a, b) => a.iso.localeCompare(b.iso));
    const today = todayISO();
    const late = rows.filter(x => !x.t.d && x.iso < today).length;
    body.appendChild(el('div', { class: 'est-summary' + (late ? ' over' : '') }, [
      el('span', { text: `${rows.length} משימות` }),
      el('span', { html: late ? `<b>${late}</b> באיחור` : 'הכול בזמן' })
    ]));
    if (!rows.length){ body.appendChild(el('div', { class: 'empty-note', text: 'אין משימות התואמות לסינון' })); return; }
    paintBatch();
    rows.slice(0, 400).forEach(({ iso, t }) => {
      const c = catById(t.cat);
      const chk = el('input', { class: 'chk', type: 'checkbox', checked: t.d });
      chk.addEventListener('change', () => {
        t.d = chk.checked; t.doneAt = chk.checked ? Date.now() : 0; saveDB(); draw();
      });
      const entry = [...SEL].find(x => x.t === t);
      const selBox = el('input', { class: 'chk', type: 'checkbox', checked: !!entry, title: 'בחירה לפעולה מרוכזת',
                                   style: 'border-radius:50%' });
      selBox.addEventListener('change', () => {
        if (selBox.checked) SEL.add({ iso, t });
        else { const e2 = [...SEL].find(x => x.t === t); if (e2) SEL.delete(e2); }
        paintBatch();
      });
      const blocker = todoBlocked(t);
      body.appendChild(el('div', { class: 'agenda-item' + (t.d ? ' done' : '') + (blocker ? ' blocked' : '') }, [
        selBox, chk,
        blocker ? el('span', { class: 'lock-ic', title: 'ממתין ל: ' + blocker.t.t, text: '🔒' }) : null,
        el('span', { class: 'cat-dot' + (c ? '' : ' none'), style: c ? 'background:' + c.color : '' }),
        el('span', { class: 'tm', text: iso.slice(5).split('-').reverse().join('/'),
                     style: (!t.d && iso < today) ? 'color:var(--danger);font-weight:700' : '' }),
        el('span', { class: 'tx' }, [ document.createTextNode(t.t),
          (t.who || t.est) ? el('small', { text: [contactName(t.who), t.est ? t.est + ' דק׳' : ''].filter(Boolean).join(' · ') }) : null ]),
        el('button', { class: 'btn sm ghost', title: 'מעבר ליום', onclick: () => { State.cursor = fromISO(iso); setView('day'); } }, '↗')
      ]));
    });
    if (rows.length > 400) body.appendChild(el('div', { class: 'hint', text: `מוצגות 400 מתוך ${rows.length}. צמצם את הסינון.` }));
  };
  draw();
  v.appendChild(card_);
}

function applyAppName(){
  const n = ((DB.settings.appName || '').trim()) || 'מתכנן';
  document.title = n + ' — יומי · שבועי · חודשי · שנתי';
  const b = $('#brandName'); if (b) b.textContent = n;
  const m = document.querySelector('meta[name="apple-mobile-web-app-title"]');
  if (m) m.setAttribute('content', n);
}

const isFullscreen = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function toggleFullscreen(){
  try {
    if (isFullscreen()){
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
      const el0 = document.documentElement;
      (el0.requestFullscreen || el0.webkitRequestFullscreen).call(el0);
    }
  } catch(e){ toast('הדפדפן חסם מסך מלא'); }
}
function paintFullscreenBtn(){
  const b = $('#btnFull');
  if (b){ b.textContent = isFullscreen() ? '⛶' : '⛶'; b.title = isFullscreen() ? 'יציאה ממסך מלא' : 'מסך מלא (F)'; }
}

let INSTALL_PROMPT = null;
function setupInstall(){
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    INSTALL_PROMPT = e;
    const b = $('#btnInstall'); if (b) b.hidden = false;
  });
  window.addEventListener('appinstalled', () => {
    INSTALL_PROMPT = null;
    const b = $('#btnInstall'); if (b) b.hidden = true;
    toast('האפליקציה הותקנה');
  });
  const b = $('#btnInstall');
  if (b) b.addEventListener('click', async () => {
    if (!INSTALL_PROMPT){ toast('ההתקנה זמינה מתפריט הדפדפן'); return; }
    INSTALL_PROMPT.prompt();
    try { await INSTALL_PROMPT.userChoice; } catch(e){}
    INSTALL_PROMPT = null; b.hidden = true;
  });
}
/** מצב ה-PWA — מוצג בהגדרות כדי שיהיה ברור מה עובד ומה לא */
async function pwaStatus(){
  const out = { https: location.protocol === 'https:' || location.hostname === 'localhost',
                sw: false, manifest: false, standalone: false, cache: 0 };
  out.standalone = window.matchMedia('(display-mode: standalone)').matches ||
                   window.navigator.standalone === true;
  try {
    if ('serviceWorker' in navigator){
      const reg = await navigator.serviceWorker.getRegistration();
      out.sw = !!(reg && (reg.active || reg.installing || reg.waiting));
    }
  } catch(e){}
  try {
    const res = await fetch('manifest.json', { cache: 'no-cache' });
    out.manifest = res.ok;
  } catch(e){}
  try {
    if (window.caches){
      const keys = await caches.keys();
      for (const k of keys){ const c = await caches.open(k); out.cache += (await c.keys()).length; }
    }
  } catch(e){}
  return out;
}

  const sub = (d.items || []).reduce((s, i) => s + (Number(i.qty) || 0) * (Number(i.price) || 0), 0);
  const afterDisc = sub - (Number(d.discount) || 0);
  const vat = afterDisc * ((Number(d.vat) || 0) / 100);
  return { sub, disc: Number(d.discount) || 0, vat, total: afterDisc + vat };
}

  S.docCounters[kind] = n + 1;
  return (S.docPrefix || '') + DOC_KINDS[kind].prefix + '-' + String(n).padStart(4, '0');
}

/* ==================== 4. תזכורות גבייה אוטומטיות ==================== */
function syncCollections(){
  const days = Math.max(1, DB.settings.collectAfterDays || 21);
  DB.jobs.forEach(job => {
    const owed = Math.max(0, Number(job.price || 0) - Number(job.paid || 0));
    const target = job.iso ? isoOf(addDays(fromISO(job.iso), days)) : '';
    if (job.collectTaskAt && (!owed || job.collectTaskAt !== target)){
      const rec = DB.days[job.collectTaskAt];
      if (rec) rec.todos = (rec.todos || []).filter(t => !(t && t.fromCollect === job.id));
      job.collectTaskAt = '';
    }
    if (!owed || !job.iso) return;
    const rec = DB.days[target];
    if (rec && (rec.todos || []).some(t => t && t.fromCollect === job.id)){ job.collectTaskAt = target; return; }
    const w = dayW(target);
    w.todos.push(Object.assign(TODO_DEFAULT(), {
      t: `גבייה: ${money(owed)} מ${contactName(job.who) || (job.title || 'לקוח')}`,
      cat: 'studio', who: job.who, fromCollect: job.id
    }));
    job.collectTaskAt = target;
  });
}

/* ======================== 5. לוח זמינות ======================== */
const AVAIL = { busy: ['תפוס', 'av-busy'], tentative: ['אופציה', 'av-tent'], free: ['פנוי', 'av-free'] };
const availOf = iso => DB.availability[iso] || '';
function cycleAvail(iso){
  const order = ['', 'busy', 'tentative', 'free'];
  const cur = availOf(iso);
  const next = order[(order.indexOf(cur) + 1) % order.length];
  if (next) DB.availability[iso] = next; else delete DB.availability[iso];
  saveDB();
  return next;
}
/** ימים פנויים בטווח — אין עבודה, אין פגישות, ולא סומן כתפוס */
function freeDays(fromDate, days, opts){
  opts = opts || {};
  const out = [];
  for (let i = 0; i < days; i++){
    const d = addDays(fromDate, i), iso = isoOf(d);
    const av = availOf(iso);
    if (av === 'busy') continue;
    if (opts.skipShabbat && (d.getDay() === 6 || d.getDay() === 5)) continue;
    if (opts.skipHolidays && dayMarkLevel(iso) === 2) continue;
    const rec = dayRec(iso, false);
    const busy = jobsForISO(iso).length ||
                 (rec.appts || []).filter(a => a && (a.what || '').trim()).length;
    if (busy && !opts.includeBusy) continue;
    out.push({ iso, d, av });
  }
  return out;
}

/** מטרות ההתראה שנובעות מהתזכורות היחסיות */
function zmanReminderTargets(){
  const iso = todayISO(), z = zmanimForISO(iso) || {}, out = [];
  const dow = new Date().getDay();
  (DB.zmanReminders || []).forEach(r => {
    if (r.on === false) return;
    if (r.days && r.days.length && !r.days.includes(dow)) return;
    let base = z[r.zman];
    if (!base && r.zman === 'candles'){
      const c = eventsForISO(iso).find(e => e.cat === 'candles');
      base = c && c.time;
    }
    if (!base) return;
    const [hh, mm] = base.split(':').map(Number);
    const total = hh * 60 + mm + (Number(r.offset) || 0);
    if (total < 0 || total > 1439) return;
    out.push({ key: 'zr' + r.id, time: pad2(Math.floor(total / 60)) + ':' + pad2(total % 60),
               title: r.text || 'תזכורת', sub: `${Math.abs(r.offset)} דק׳ ${r.offset < 0 ? 'לפני' : 'אחרי'} ${ZMAN_LABELS[r.zman] || r.zman}` });
  });
  return out;
}

/* ============ 8. מיקום שני להשוואת זמנים ============ */
async function getZmanimFor(lat, lon, tz, iso){
  const key = `z2:${lat.toFixed(3)},${lon.toFixed(3)}:${iso}`;
  if (getZmanimFor._c && getZmanimFor._c[key]) return getZmanimFor._c[key];
  getZmanimFor._c = getZmanimFor._c || {};
  try {
    const url = `https://www.hebcal.com/zmanim?cfg=json&latitude=${lat}&longitude=${lon}` +
                `&tzid=${encodeURIComponent(tz)}&date=${iso}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error();
    const j = await res.json();
    const out = {};
    ZMAN_KEYS.forEach(k => { if (j.times[k]) out[k] = String(j.times[k]).slice(11, 16); });
    getZmanimFor._c[key] = out;
    return out;
  } catch(e){ return null; }
}

/* ============ 10. חיפוש לפי תאריך עברי ============ */
function hebrewRangeISO(hy, hm){
  const out = [];
  if (hm){
    const len = daysInHebMonth(hm, hy);
    for (let d = 1; d <= len; d++) out.push(isoOf(dateFromHeb(hy, hm, d)));
  } else {
    hebMonthOrder(hy).forEach(m => {
      const len = daysInHebMonth(m, hy);
      for (let d = 1; d <= len; d++) out.push(isoOf(dateFromHeb(hy, m, d)));
    });
  }
  return out;
}

/* ==================== 12. תגיות בתוך טקסט המשימה ==================== */
const TAG_RE = /#([֐-׿\w-]{1,24})/g;
function tagsOf(text){
  const out = [];
  String(text || '').replace(TAG_RE, (_, t) => { out.push(t); return ''; });
  return out;
}
function allTags(){
  const c = {};
  Object.values(DB.days).forEach(r => (r.todos || []).forEach(t => {
    if (t) tagsOf(t.t).forEach(x => { c[x] = (c[x] || 0) + 1; });
  }));
  return Object.entries(c).sort((a, b) => b[1] - a[1]);
}

const THEME_VARS = [

  ['--ink', 'טקסט'], ['--ink-strong', 'טקסט מודגש'], ['--ink-soft', 'טקסט משני'],

];
function applyCustomTheme(){
  const root = document.documentElement;
  THEME_VARS.forEach(([v]) => root.style.removeProperty(v));
  const ct = DB.settings.customTheme;
  if (DB.settings.theme !== 'custom' || !ct) return;

function toHex(c){
  c = String(c || '').trim();
  if (/^#[0-9a-f]{6}$/i.test(c)) return c;
  if (/^#[0-9a-f]{3}$/i.test(c)) return '#' + c[1] + c[1] + c[2] + c[2] + c[3] + c[3];
  const m = c.match(/rgba?\((\d+)[ ,]+(\d+)[ ,]+(\d+)/);
  if (m) return '#' + [1, 2, 3].map(i => Number(m[i]).toString(16).padStart(2, '0')).join('');
  return '#888888';
}

function setupSwipe(){
  let x0 = null, y0 = null, t0 = 0;
  const main = document.querySelector('main');
  main.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
  }, { passive: true });
  main.addEventListener('touchend', e => {
    if (x0 == null || !DB.settings.swipeNav) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0, dt = Date.now() - t0;
    x0 = null;
    if (dt > 700 || Math.abs(dx) < 70 || Math.abs(dy) > 60) return;
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || e.target.closest('.sketch-canvas-wrap')) return;
    step(dx < 0 ? 1 : -1);   // החלקה שמאלה = קדימה בזמן
  }, { passive: true });
}

/** מיזוג בטוח: מוסיף מה שחסר, לא מוחק כלום */
function mergeInto(incoming){
  const stats = { days: 0, todos: 0, appts: 0, records: 0 };
  const byId = (arr, list) => {
    const have = new Set(arr.map(x => x && x.id).filter(Boolean));
    (list || []).forEach(x => { if (x && x.id && !have.has(x.id)){ arr.push(x); stats.records++; } });
  };
  ['contacts', 'jobs', 'docs', 'finance', 'timeLogs', 'events', 'recurring',
   'templates', 'weekTemplates', 'bigGoals', 'layers', 'gearLists', 'zmanReminders']
    .forEach(k => { if (Array.isArray(incoming[k])) byId(DB[k], incoming[k]); });

  Object.entries(incoming.days || {}).forEach(([iso, inc]) => {
    const mine = DB.days[iso];
    if (!mine){ DB.days[iso] = inc; stats.days++; return; }
    ['notes', 'reminder', 'gratitude', 'note'].forEach(f => {
      if (!(mine[f] || '').trim() && (inc[f] || '').trim()){ mine[f] = inc[f]; stats.days++; }
    });
    Object.entries(inc.schedule || {}).forEach(([t, v]) => {
      if (v && !((mine.schedule || {})[t] || '').trim()){ mine.schedule = mine.schedule || {}; mine.schedule[t] = v; }
    });
    (inc.goals || []).forEach((g, i) => { if (g && !((mine.goals || [])[i] || '').trim()){ mine.goals = mine.goals || ['','','']; mine.goals[i] = g; } });
    const haveT = new Set((mine.todos || []).map(t => t && t.id).filter(Boolean));
    (inc.todos || []).forEach(t => { if (t && t.id && !haveT.has(t.id)){ mine.todos.push(t); stats.todos++; } });
    const key = a => (a.uid || '') + '|' + (a.time || '') + '|' + (a.what || '');
    const haveA = new Set((mine.appts || []).map(key));
    (inc.appts || []).forEach(a => { if (a && (a.what || '').trim() && !haveA.has(key(a))){ mine.appts.push(a); stats.appts++; } });
    Object.entries(inc.habits || {}).forEach(([h, v]) => { if (v){ mine.habits = mine.habits || {}; mine.habits[h] = true; } });
  });
  Object.entries(incoming.availability || {}).forEach(([iso, v]) => { if (!DB.availability[iso]) DB.availability[iso] = v; });
  ['weeks', 'months', 'hmonths', 'years', 'hyears'].forEach(b => {
    Object.entries(incoming[b] || {}).forEach(([k, v]) => { if (!DB[b][k]) DB[b][k] = v; });
  });
  return stats;
}

/* SpreadsheetML 2003 — XML פשוט שאקסל פותח כגיליון אמיתי, בלי ספריות חיצוניות */
function xmlEsc(s){ return String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function exportXLS(sheets, filename){
  let xml = '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<?mso-application progid="Excel.Sheet"?>\n' +
    '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet"\n' +
    ' xmlns:o="urn:schemas-microsoft-com:office:office"\n' +
    ' xmlns:x="urn:schemas-microsoft-com:office:excel"\n' +
    ' xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n' +
    '<Styles><Style ss:ID="h"><Font ss:Bold="1"/><Interior ss:Color="#EDE6D6" ss:Pattern="Solid"/></Style></Styles>\n';
  sheets.forEach(sh => {
    xml += `<Worksheet ss:Name="${xmlEsc(sh.name).slice(0, 30)}"><Table>\n`;
    (sh.rows || []).forEach((row, ri) => {
      xml += '<Row>' + row.map(cell => {
        const num = typeof cell === 'number' || (cell !== '' && cell != null && !isNaN(cell) && /^-?\d+(\.\d+)?$/.test(String(cell)));
        const type = num ? 'Number' : 'String';
        return `<Cell${ri === 0 ? ' ss:StyleID="h"' : ''}><Data ss:Type="${type}">${xmlEsc(cell)}</Data></Cell>`;
      }).join('') + '</Row>\n';
    });
    xml += '</Table></Worksheet>\n';
  });
  xml += '</Workbook>';
  if (typeof DESKTOP !== 'undefined' && DESKTOP && window.plannerDesktop){
    window.plannerDesktop.saveFile(filename, xml, [{ name: 'Excel', extensions: ['xls'] }])
      .then(p => { if (p) toast('נשמר: ' + p); });
    return;
  }
  const blob = new Blob(['﻿' + xml], { type: 'application/vnd.ms-excel;charset=utf-8' });
  const a = el('a', { href: URL.createObjectURL(blob), download: filename });
  document.body.appendChild(a); a.click(); a.remove();
  toast('הקובץ נוצר');
}

/* ==================== 20. נעילה בסיסמה (אופציונלי) ==================== */
const Lock = {
  key: null, meta: null, unlocked: true,
  /* הנעילה גלובלית — סיסמה אחת לכל הפרופילים */
  metaKey(){ return 'planner_lock_v1'; },
  load(){
    try { this.meta = JSON.parse(localStorage.getItem(this.metaKey()) || 'null'); }
    catch(e){ this.meta = null; }
    return this.meta;
  },
  save(){ try { localStorage.setItem(this.metaKey(), JSON.stringify(this.meta)); } catch(e){} },
  enabled(){ return !!(this.meta && this.meta.enabled); },
  available(){ return !!(window.crypto && window.crypto.subtle); },
  /* המרה בקטעים — String.fromCharCode(...arr) קורס על מערכים גדולים */
  b64(buf){
    const b = new Uint8Array(buf), CH = 0x8000;
    let s = '';
    for (let i = 0; i < b.length; i += CH) s += String.fromCharCode.apply(null, b.subarray(i, i + CH));
    return btoa(s);
  },
  unb64(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); },
  async derive(pass, salt){
    const enc = new TextEncoder();
    const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  },
  async encrypt(text){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const data = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, this.key, new TextEncoder().encode(text));
    return JSON.stringify({ enc: 1, iv: this.b64(iv), data: this.b64(data) });
  },
  async decrypt(raw){
    const o = JSON.parse(raw);
    const plain = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: this.unb64(o.iv) }, this.key, this.unb64(o.data));
    return new TextDecoder().decode(plain);
  },
  isEncrypted(raw){
    if (!raw || raw[0] !== '{') return false;
    try { return JSON.parse(raw).enc === 1; } catch(e){ return false; }
  },
  async enable(pass){
    if (!this.available()){ alert('הדפדפן אינו תומך בהצפנה.'); return false; }
    const salt = crypto.getRandomValues(new Uint8Array(16));
    this.key = await this.derive(pass, salt);
    const check = await this.encrypt('planner-ok');
    this.meta = { enabled: true, salt: this.b64(salt), check };
    this.save();
    await persistEncrypted();
    this.unlocked = true;
    return true;
  },
  async unlock(pass){
    if (!this.meta) return false;
    try {
      this.key = await this.derive(pass, this.unb64(this.meta.salt));
      const v = await this.decrypt(this.meta.check);
      if (v !== 'planner-ok') throw new Error('bad');
      this.unlocked = true;
      return true;
    } catch(e){ this.key = null; return false; }
  },
  async disable(){
    this.meta = { enabled: false };
    this.save();
    this.key = null;
    persistNow();
    return true;
  }
};
async function persistEncrypted(){
  if (!Lock.key) return persistNow();
  DB.meta.updated = new Date().toISOString();
  try {
    const raw = await Lock.encrypt(JSON.stringify(DB));
    localStorage.setItem(storeKey(), raw);
    return true;
  } catch(e){ toast('שגיאת שמירה מוצפנת'); return false; }
}
/** פורס את הנתונים המוצפנים של הפרופיל הפעיל לתוך DB */
async function decryptIntoDB(){
  let raw = null;
  try { raw = localStorage.getItem(storeKey()); } catch(e){}
  if (!raw || !Lock.isEncrypted(raw) || !Lock.key) return false;
  try { DB = deepDefaults(JSON.parse(await Lock.decrypt(raw)), DEFAULTS); return true; }
  catch(e){ return false; }
}

/* ==================== 21. ייצוא ICS מלא עם אירועים חוזרים ==================== */
function icsDT(iso, time){
  const d = iso.replace(/-/g, '');
  return time ? `${d}T${time.replace(':', '')}00` : d;
}
function exportFullICS(){
  const tz = DB.settings.location.tz;
  const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//planner//HE//', 'CALSCALE:GREGORIAN',
             'X-WR-CALNAME:' + icsEscape((DB.settings.appName || 'מתכנן'))];
  let n = 0;
  const ev = (uid, start, end, allDay, summary, loc, desc, rrule) => {
    L.push('BEGIN:VEVENT', `UID:${uid}@planner`, `DTSTAMP:${stamp}`,
      allDay ? `DTSTART;VALUE=DATE:${start}` : `DTSTART;TZID=${tz}:${start}`,
      allDay ? `DTEND;VALUE=DATE:${end}` : `DTEND;TZID=${tz}:${end}`,
      `SUMMARY:${icsEscape(summary)}`);
    if (loc) L.push(`LOCATION:${icsEscape(loc)}`);
    if (desc) L.push(`DESCRIPTION:${icsEscape(String(desc).replace(/\n/g, '\\n'))}`);
    if (rrule) L.push('RRULE:' + rrule);
    L.push('END:VEVENT');
    n++;
  };
  // פגישות
  Object.entries(DB.days).forEach(([iso, r]) => {
    (r.appts || []).forEach((a, i) => {
      if (!a || !(a.what || '').trim()) return;
      const start = icsDT(iso, a.time);
      let end;
      if (a.time){
        if (a.end) end = icsDT(iso, a.end);
        else {
          const [hh, mm] = a.time.split(':').map(Number);
          const e2 = new Date(fromISO(iso)); e2.setHours(hh + 1, mm);
          end = icsDT(isoOf(e2), pad2(e2.getHours()) + ':' + pad2(e2.getMinutes()));
        }
      } else end = icsDT(isoOf(addDays(fromISO(iso), 1)), '');
      ev(a.uid || (iso + '-' + i), start, end, !a.time, a.what, a.where, a.note, '');
    });
  });
  // עבודות
  DB.jobs.forEach(j => {
    if (!j.iso) return;
    const start = icsDT(j.iso, j.time);
    const end = j.time ? icsDT(j.iso, j.time) : icsDT(isoOf(addDays(fromISO(j.iso), 1)), '');
    ev('job-' + j.id, start, end, !j.time, '📷 ' + (j.title || 'עבודה'),
       contactName(j.who), [j.kind, j.note].filter(Boolean).join('\n'), '');
  });
  // משימות חוזרות → אירועים עם RRULE אמיתי
  DB.recurring.forEach(r => {
    if (r.active === false) return;
    const startIso = r.from || todayISO();
    let rule = '';
    if (r.freq === 'daily') rule = 'FREQ=DAILY';
    else if (r.freq === 'weekdays') rule = 'FREQ=WEEKLY;BYDAY=SU,MO,TU,WE,TH';
    else if (r.freq === 'weekly'){
      const names = ['SU','MO','TU','WE','TH','FR','SA'];
      rule = 'FREQ=WEEKLY;BYDAY=' + (r.dows || []).map(i => names[i]).join(',');
    }
    else if (r.freq === 'monthly') rule = 'FREQ=MONTHLY;BYMONTHDAY=' + (r.dom || 1);
    else return;   // חודש עברי אינו ניתן לביטוי ב-RRULE — מדלגים במקום לייצא משהו שגוי
    if (r.to) rule += ';UNTIL=' + r.to.replace(/-/g, '') + 'T000000Z';
    const d0 = isoOf(addDays(fromISO(startIso), 0));
    ev('rec-' + r.id, icsDT(d0, ''), icsDT(isoOf(addDays(fromISO(d0), 1)), ''), true, r.title, '', '', rule);
  });
  // אירועים אישיים ותאריכים עבריים — כל מופע בנפרד, כי אין להם RRULE נכון
  [State.cursor.getFullYear(), State.cursor.getFullYear() + 1, State.cursor.getFullYear() + 2].forEach(gy => {
    Object.entries(personalEventsByDate(gy)).forEach(([iso, arr]) => arr.forEach((x, i) => {
      ev('pe-' + x.ev.id + '-' + iso + i, icsDT(iso, ''), icsDT(isoOf(addDays(fromISO(iso), 1)), ''),
         true, eventTitleFor(x), '', '', '');
    }));
  });
  L.push('END:VCALENDAR');
  const content = L.join('\r\n');
  const name = `מתכנן-מלא-${todayISO()}.ics`;
  if (typeof DESKTOP !== 'undefined' && DESKTOP && window.plannerDesktop){
    window.plannerDesktop.saveFile(name, content, [{ name: 'iCalendar', extensions: ['ics'] }])
      .then(p => { if (p) toast(`יוצאו ${n} אירועים`); });
    return;
  }
  const blob = new Blob([content], { type: 'text/calendar;charset=utf-8' });
  const a = el('a', { href: URL.createObjectURL(blob), download: name });
  document.body.appendChild(a); a.click(); a.remove();
  toast(`יוצאו ${n} אירועים`);
}

/* ==================== 1. צנרת פניות (לידים) ==================== */
function leadStats(){
  const total = DB.leads.length;
  const won = DB.leads.filter(l => l.stage === 'won').length;
  const lost = DB.leads.filter(l => l.stage === 'lost').length;
  const closed = won + lost;
  const replied = DB.leads.filter(l => l.repliedAt && l.iso);
  let avgHours = null;
  if (replied.length){
    const sum = replied.reduce((s, l) => s + Math.max(0, l.repliedAt - fromISO(l.iso).getTime()), 0);
    avgHours = Math.round(sum / replied.length / 3600e3);
  }
  const value = DB.leads.filter(l => l.stage === 'won').reduce((s, l) => s + Number(l.price || 0), 0);
  return { total, won, lost, closed, rate: closed ? Math.round(won / closed * 100) : null, avgHours, value };
}

function openLeads(){
  const body = el('div', { style: 'display:flex;flex-direction:column;gap:12px' });
  const statsBox = el('div', { class: 'imp-stats' });
  const board = el('div', { class: 'lead-board' });
  let filterKind = '';

  const draw = () => {
    const s = leadStats();
    statsBox.innerHTML = '';
    [[String(s.total), 'פניות', ''], [String(s.won), 'נסגרו', 'good'],
     [s.rate == null ? '—' : s.rate + '%', 'אחוז המרה', s.rate >= 50 ? 'good' : ''],
     [s.avgHours == null ? '—' : s.avgHours + ' ש׳', 'זמן תגובה ממוצע', ''],
     [money(s.value), 'שווי שנסגר', 'good']].forEach(([v, k, cls]) => {
      statsBox.appendChild(el('div', { class: 'stat-box ' + cls },
        [ el('div', { class: 'v', text: v }), el('div', { class: 'k', text: k }) ]));
    });

    board.innerHTML = '';
    LEAD_STAGES.forEach(st => {
      const col = el('div', { class: 'lead-col' });
      let rows = DB.leads.filter(l => l.stage === st.id);
      if (filterKind) rows = rows.filter(l => (l.kind || '') === filterKind);
      rows.sort((a, b) => (b.iso || '').localeCompare(a.iso || ''));
      col.appendChild(el('h5', {}, [
        el('span', { text: st.name }),
        el('span', { class: 'cnt', text: String(rows.length) })
      ]));
      rows.forEach(l => {
        const c = el('div', { class: 'lead-card ' + st.cls, onclick: () => openLeadEditor(l, draw) }, [
          el('div', { class: 'ttl', text: l.name || '(ללא שם)' }),
          el('div', { class: 'meta', text: [l.kind, l.eventIso ? l.eventIso.split('-').reverse().join('/') : '',
                                            l.price ? money(l.price) : ''].filter(Boolean).join(' · ') })
        ]);
        if (st.id !== 'won' && st.id !== 'lost'){
          const i = LEAD_STAGES.findIndex(x => x.id === st.id);
          c.appendChild(el('button', { class: 'btn sm', title: 'לשלב הבא',
            onclick: e => {
              e.stopPropagation();
              l.stage = LEAD_STAGES[i + 1].id;
              if (l.stage === 'quoted' && !l.repliedAt) l.repliedAt = Date.now();
              saveDB(); draw();
            } }, '→'));
        }
        col.appendChild(c);
      });
      board.appendChild(col);
    });
  };

  const kinds = Array.from(new Set(DB.leads.map(l => l.kind).filter(Boolean)));
  body.appendChild(el('div', { class: 'filters' }, [
    mkSelect([['', 'כל הסוגים']].concat(kinds.map(k => [k, k])), '', v => { filterKind = v; draw(); }),
    el('button', { class: 'btn sm primary', onclick: () => openLeadEditor(LEAD_DEFAULT(), draw) }, '＋ פנייה חדשה')
  ]));
  body.appendChild(statsBox);
  body.appendChild(board);
  body.appendChild(el('div', { class: 'hint',
    text: 'פנייה שנסגרת יכולה להפוך לעבודה בלחיצה אחת — כל הפרטים עוברים אליה.' }));
  draw();
  openModal('צנרת פניות', body, [ el('button', { class: 'btn', onclick: closeModal }, 'סגירה') ]);
}

function openLeadEditor(lead, after){
  const isNew = !DB.leads.includes(lead);

/* ==================== 3. תזרים 12 חודשים קדימה ==================== */
function cashflowMonths(n){
  n = n || 12;
  const out = [];
  const base = new Date(); base.setDate(1); base.setHours(0, 0, 0, 0);
  for (let i = 0; i < n; i++){
    const d = new Date(base.getFullYear(), base.getMonth() + i, 1);
    const key = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
    let expected = 0, secured = 0, crewCost = 0;
    DB.jobs.forEach(j => {
      if (!j.iso || j.iso.slice(0, 7) !== key) return;
      expected += Number(j.price || 0);
      secured  += Number(j.paid || 0);
      (j.crew || []).forEach(c => { crewCost += Number(c.pay || 0); });
    });
    // הוצאות קבועות שנרשמו באותו חודש בשנים קודמות אינן נחזות — רק מה שכבר נרשם
    let logged = 0;
    DB.finance.forEach(f => {
      if (!f.iso || f.iso.slice(0, 7) !== key) return;
      logged += (f.kind === 'in' ? 1 : -1) * Number(f.amount || 0);
    });
    out.push({ key, d, expected, secured, open: Math.max(0, expected - secured), crewCost, logged });
  }
  return out;
}

function openCashflow(){
  const rows = cashflowMonths(12);
  const max = Math.max(1, ...rows.map(r => r.expected));
  const body = el('div', { style: 'display:flex;flex-direction:column;gap:12px' });

  const totalExp = rows.reduce((s, r) => s + r.expected, 0);

  const stats = el('div', { class: 'imp-stats' });
  [[money(totalExp), 'צפוי ב-12 חודשים', ''], [money(totalOpen), 'טרם נגבה', totalOpen ? '' : 'good'],
   [money(totalCrew), 'עלות צוות', 'muted'],
   [money(totalExp - totalCrew), 'נטו צפוי', 'good']].forEach(([v, k, cls]) => {
    stats.appendChild(el('div', { class: 'stat-box ' + cls },
      [ el('div', { class: 'v', text: v }), el('div', { class: 'k', text: k }) ]));
  });
  body.appendChild(stats);

  const chart = el('div', { class: 'cf-chart' });
  rows.forEach(r => {
    const h = Math.round(r.expected / max * 100);
    const hp = r.expected ? Math.round(r.secured / r.expected * 100) : 0;
    chart.appendChild(el('div', { class: 'cf-col', title: `${GREG_MONTHS[r.d.getMonth()]} ${r.d.getFullYear()}\n` +
        `צפוי ${money(r.expected)} · נגבה ${money(r.secured)}` }, [
      el('div', { class: 'cf-val', text: r.expected ? money(r.expected) : '' }),
      el('div', { class: 'cf-bar', style: `height:${Math.max(h, r.expected ? 4 : 0)}%` },
        el('div', { class: 'cf-paid', style: `height:${hp}%` })),

    ]));
  });
  body.appendChild(chart);
  body.appendChild(el('div', { class: 'hint',
    html: 'הגובה = ההכנסה הצפויה מעבודות שכבר רשומות. החלק הכהה = מה שכבר שולם בפועל.' }));

  const tbl = el('table', { class: 'imp-table' }, [
    el('thead', {}, el('tr', {}, ['חודש', 'צפוי', 'נגבה', 'פתוח', 'עלות צוות'].map(t => el('th', { text: t })))),
    el('tbody', {}, rows.filter(r => r.expected || r.logged).map(r => el('tr', {}, [
      el('td', { text: GREG_MONTHS[r.d.getMonth()] + ' ' + r.d.getFullYear() }),
      el('td', { class: 'd', text: money(r.expected) }),
      el('td', { class: 'd', text: money(r.secured) }),
      el('td', { class: 'd', style: r.open ? 'color:var(--danger)' : '', text: money(r.open) }),
      el('td', { class: 'd', text: r.crewCost ? money(r.crewCost) : '—' })
    ])))

  body.appendChild(el('div', { class: 'imp-scroll' }, tbl));

/* ==================== 4. רווחיות לעבודה ==================== */
function jobProfit(job){
  const income = Number(job.price || 0);
  const collected = Number(job.paid || 0);
  const crewCost = (job.crew || []).reduce((s, c) => s + Number(c.pay || 0), 0);
  let expenses = 0;
  DB.finance.forEach(f => {
    if (f.kind === 'out' && (f.jobId === job.id || (job.iso && f.iso === job.iso && f.who && f.who === job.who)))
      expenses += Number(f.amount || 0);
  });
  let minutes = 0;
  DB.timeLogs.forEach(t => {
    if (t.jobId === job.id || (t.project && job.title && t.project === job.title)) minutes += Number(t.minutes || 0);
  });
  const net = income - crewCost - expenses;
  return { income, collected, crewCost, expenses, net, minutes,
           perHour: minutes ? Math.round(net / (minutes / 60)) : null };
}

/* ==================== 5. מעקב מסירה ==================== */
function deliveriesDue(withinDays){
  const today = todayISO();
  const limit = isoOf(addDays(new Date(), withinDays == null ? 60 : withinDays));
  return DB.jobs
    .filter(j => j.deliverBy && !j.delivered && j.status !== 'paid' && j.deliverBy <= limit)
    .map(j => ({ job: j, late: j.deliverBy < today,
                 days: Math.round((fromISO(j.deliverBy) - fromISO(today)) / 864e5) }))
    .sort((a, b) => a.job.deliverBy.localeCompare(b.job.deliverBy));
}

function deliveriesCard(){
  const box = el('div');
  const due = deliveriesDue(45);
  if (!due.length){ box.appendChild(el('div', { class: 'empty-note', text: 'אין מסירות פתוחות' })); return box; }
  due.slice(0, 8).forEach(({ job, late, days }) => {
    box.appendChild(el('div', { class: 'del-row' + (late ? ' late' : days <= (DB.settings.deliveryWarnDays || 3) ? ' soon' : ''),
      onclick: () => openJobEditor(job) }, [

        el('div', { class: 'ttl', text: job.title || '(ללא שם)' }),
        el('div', { class: 'meta', text: [contactName(job.who), job.kind].filter(Boolean).join(' · ') })
      ]),
      el('span', { class: 'del-when',
        text: late ? `באיחור ${Math.abs(days)} ימים` : days === 0 ? 'היום' : `בעוד ${days} ימים` }),
      el('button', { class: 'btn sm', title: 'סימון כנמסר', onclick: e => {

        if (job.status === 'booked' || job.status === 'shot' || job.status === 'edited') job.status = 'delivered';
        saveDB(); renderAll(true); toast('סומן כנמסר');
      } }, '✓')
    ]));
  });
  return box;
}

/* ==================== 9. זמן נסיעה בין עבודות ==================== */
/** מחזיר אזהרות על ימים שבהם אין מספיק זמן להגיע מעבודה לעבודה */
function travelWarnings(iso){
  const items = [];
  jobsForISO(iso).forEach(j => {
    const m = toMin(j.time);
    if (m != null) items.push({ min: m, label: j.title || 'עבודה', where: j.where || '',
                                travel: Number(j.travel || 0) || (DB.settings.travelDefault || 0) });
  });
  ((DB.days[iso] || {}).appts || []).forEach(a => {
    const m = toMin(a && a.time);
    if (m != null && (a.what || '').trim())
      items.push({ min: m, label: a.what, where: a.where || '', travel: DB.settings.travelDefault || 0,
                   endMin: toMin(a.end) });
  });
  items.sort((a, b) => a.min - b.min);
  const out = [];
  for (let i = 1; i < items.length; i++){
    const prev = items[i - 1], cur = items[i];
    const prevEnd = prev.endMin != null && prev.endMin > prev.min ? prev.endMin : prev.min + 60;
    const gap = cur.min - prevEnd;
    const need = cur.travel;
    if (need > 0 && gap < need && (prev.where || cur.where) && prev.where !== cur.where)
      out.push({ from: prev, to: cur, gap, need });
  }
  return out;
}

/* ==================== 10. אזכרות ==================== */
/** התאריך הלועזי של תאריך עברי בשנה עברית מסוימת, עם התאמות:
    תאריך שאינו קיים באותה שנה (ל׳ בחשוון/כסלו) יורד ליום האחרון של החודש,
    ואדר בשנה מעוברת — לפי מנהג עדות המזרח האזכרה נערכת באדר ב׳. */
function hebDateInYear(hy, hm, hd){
  let m = hm, d = hd;
  if (m === 12 && isHebrewLeapYear(hy)) m = 13;          // אדר → אדר ב׳
  if (m === 13 && !isHebrewLeapYear(hy)) m = 12;          // אדר ב׳ → אדר
  const len = daysInHebMonth(m, hy);
  if (d > len) d = len;
  return dateFromHeb(hy, m, d);
}

/** כל האזכרות וימי ההולדת שנופלים בתאריך לועזי מסוים.
    ימי ההולדת נלקחים ממבנה אנשי הקשר הקיים מ-V2.5 (c.bday עם cal/gm/gd/hm/hd/hy),
    כדי שלא יהיו שני מקומות שונים לאותו מידע. */
function hebAnnivForISO(iso){
  const out = [];
  const d = fromISO(iso), h = hebOf(d);
  DB.azkarot.forEach(y => {
    if (!y || !y.hm) return;
    if (isoOf(hebDateInYear(h.y, y.hm, y.hd)) === iso)
      out.push({ kind: 'azkara', name: y.name, note: y.note, src: y });
  });
  DB.contacts.forEach(c => {
    const b = c && c.bday;
    if (!b || !b.cal) return;
    let hit = false, years = null;
    if (b.cal === 'greg' && b.gm && b.gd){
      hit = (d.getMonth() + 1) === b.gm && d.getDate() === b.gd;
      if (hit && b.gy) years = d.getFullYear() - b.gy;
    } else if (b.cal === 'heb' && b.hm && b.hd){
      hit = isoOf(hebDateInYear(h.y, b.hm, b.hd)) === iso;
      if (hit && b.hy) years = h.y - b.hy;
    }
    if (hit) out.push({ kind: 'bday', name: c.name,
                        years: years > 0 && years < 130 ? years : null, src: c });
  });
  return out;
}

/** אזכרות קרובות — לכל אזכרה טווח התזכורת שהוגדר לה עצמה (openAzkarot), לא טווח משותף */
function azkarotUpcoming(){
  const out = [];
  const today = todayISO();
  const hy = hebOf(new Date()).y;
  DB.azkarot.forEach(y => {
    if (!y || !y.hm) return;
    let next = hebDateInYear(hy, y.hm, y.hd);
    if (isoOf(next) < today) next = hebDateInYear(hy + 1, y.hm, y.hd);
    const nextIso = isoOf(next);
    const inDays = Math.round((fromISO(nextIso) - fromISO(today)) / 864e5);
    const remind = y.remindDays == null ? 7 : y.remindDays;
    if (inDays > 0 && inDays <= remind)
      out.push({ kind: 'azkara', iso: nextIso, inDays, name: y.name, note: y.note, src: y });
  });
  return out.sort((a, b) => a.inDays - b.inDays);
}

/** ימי הולדת קרובים — טווח משותף מההגדרות (bdayRemindDays) */
function birthdaysUpcoming(days){
  const out = [];
  for (let i = 0; i <= (days || 3); i++){
    const iso = isoOf(addDays(new Date(), i));
    hebAnnivForISO(iso).forEach(a => { if (a.kind === 'bday') out.push(Object.assign({ iso, inDays: i }, a)); });
  }
  return out;
}

/* ==================== 11. ימי הולדת של אנשי קשר ====================
   מבנה יום ההולדת של איש הקשר קיים מ-V2.5 (לועזי או עברי, עם שנה לחישוב גיל).
   כאן הוא מקבל תזכורת מראש וכרטיס ייעודי בתצוגת היום, יחד עם האזכרות. */

/* ==================== 12. תקופות בלי אירועים ==================== */
/** ימי הספירה ובין המצרים — התקופות שבהן כמעט אין חתונות ואירועים.
    ברירת המחדל היא **מנהג עדות המזרח** (פסיקת מרן), ואפשר להחליף בהגדרות.

    עדות המזרח:
      · ספירת העומר — ימי אבלות מאחרי פסח ועד **בוקר ל״ד בעומר**.
        ל״ג בעומר עצמו עדיין בכלל האבלות; ההיתר מתחיל בבוקר ל״ד.
      · בין המצרים — חתונות מותרות עד **ר״ח אב**; תשעת הימים הם התקופה המחמירה.
    אשכנז (אם נבחר בהגדרות):
      · ספירת העומר — עד ל״ג בעומר, ורבים ממשיכים עד ראש חודש סיוון.
      · בין המצרים — כל שלושת השבועות.
    זו הצגה של מנהג, לא פסיקה — בשאלה למעשה יש לפנות לרב. */
function quietPeriod(iso){
  if (!DB.settings.noEventPeriods) return null;
  const d = fromISO(iso);
  const h = hebOf(d);
  const rd = gregorianToRD(d.getFullYear(), d.getMonth() + 1, d.getDate());
  const edot = (DB.settings.minhag || 'edot') === 'edot';

  /* --- ספירת העומר --- */
  const omerFrom = hebrewToRD(h.y, 1, 16);        // ט״ז בניסן
  const lag  = hebrewToRD(h.y, 2, 18);            // ל״ג בעומר
  const lamedDalet = hebrewToRD(h.y, 2, 19);      // ל״ד בעומר
  const roshSivan  = hebrewToRD(h.y, 3, 1);
  const omerTo = edot ? lag : roshSivan - 1;
  if (rd >= omerFrom && rd <= omerTo){
    if (rd === lag)
      return edot
        ? { name: 'ל״ג בעומר · עדיין בימי הספירה', cls: 'qp-quiet' }
        : { name: 'ל״ג בעומר', cls: 'qp-ok' };
    return { name: 'ימי ספירת העומר', cls: 'qp-quiet' };
  }
  if (edot && rd === lamedDalet)
    return { name: 'ל״ד בעומר · מותר מהבוקר', cls: 'qp-ok' };

  /* --- בין המצרים --- */
  const bmFrom = hebrewToRD(h.y, 4, 17);          // י״ז בתמוז
  const nine   = hebrewToRD(h.y, 5, 1);           // ר״ח אב
  const bmTo   = hebrewToRD(h.y, 5, 9);           // ט׳ באב
  if (rd >= bmFrom && rd <= bmTo){
    if (rd >= nine) return { name: 'תשעת הימים', cls: 'qp-quiet' };
    return edot
      ? { name: 'בין המצרים · חתונות מותרות עד ר״ח אב', cls: 'qp-ok' }
      : { name: 'שלושת השבועות', cls: 'qp-quiet' };
  }

  /* --- אלול: סליחות מר״ח אלול (מנהג עדות המזרח) --- */
  if (edot){
    const elulFrom = hebrewToRD(h.y, 6, 1), elulTo = hebrewToRD(h.y, 6, 29);
    if (rd >= elulFrom && rd <= elulTo) return { name: 'ימי הסליחות', cls: 'qp-ok' };
  }
  return null;
}

/* ==================== 15. הוספה מהירה בעברית טבעית ==================== */
const HEB_NUMS = { 'אחת': 1, 'אחד': 1, 'שתיים': 2, 'שתים': 2, 'שניים': 2, 'שתי': 2, 'שלוש': 3, 'שלושה': 3,
  'ארבע': 4, 'ארבעה': 4, 'חמש': 5, 'חמישה': 5, 'שש': 6, 'שישה': 6, 'שבע': 7, 'שבעה': 7,
  'שמונה': 8, 'תשע': 9, 'תשעה': 9, 'עשר': 10, 'עשרה': 10, 'אחת עשרה': 11, 'שתים עשרה': 12 };
const DOW_WORDS = { 'ראשון': 0, 'שני': 1, 'שלישי': 2, 'רביעי': 3, 'חמישי': 4, 'שישי': 5, 'שבת': 6 };

/** רשימת המקומות שהמנתח מכיר — מילון בסיס + כל מיקום שכבר השתמשת בו.
    ככל שתשתמש ביישום, הזיהוי משתפר מעצמו. */
const BASE_PLACES = ['אולם','אולמי','משרד','בית','ביתי','בית כנסת','בית הכנסת','סטודיו','גן','גן אירועים',
  'מלון','חוף','פארק','גינה','כנסייה','מסעדה','קניון','חצר','גג','מרפאה','בית ספר','גן ילדים','מושב','קיבוץ',
  'ירושלים','תל אביב','אשקלון','אשדוד','באר שבע','חיפה','נתניה','ראשון לציון','רחובות','רמת גן','חולון',
  'בת ים','פתח תקווה','הרצליה','כפר סבא','רעננה','מודיעין','בית שמש','אילת','טבריה','צפת','קריית גת',
  'נס ציונה','יבנה','גדרה','אופקים','נתיבות','שדרות','קריית מלאכי','לוד','רמלה','בני ברק','אלעד'];
let _placesCache = null;
function knownPlaces(){
  if (_placesCache) return _placesCache;
  const set = new Set(BASE_PLACES);
  const add = v => { const t = String(v || '').trim(); if (t && t.length <= 30) set.add(t); };
  DB.jobs.forEach(j => add(j.where));
  Object.values(DB.days).forEach(r => (r.appts || []).forEach(a => a && add(a.where)));
  DB.contacts.forEach(c => add(c.city));
  _placesCache = set;
  return set;
}
function invalidatePlacesCache(){ _placesCache = null; }

/** מפרק משפט עברי לפגישה/משימה. מחזיר { iso, time, end, what, where, kind } */
function parseQuickAdd(text){
  let s = ' ' + String(text || '').trim() + ' ';
  const base = new Date(State.cursor || new Date());
  let iso = isoOf(base), time = '', end = '', where = '', kind = 'appt';
  const eat = re => { const m = s.match(re); if (m){ s = s.replace(m[0], ' '); } return m; };

  // סוג הפריט
  if (/(^|\s)(משימה|לעשות|תזכורת)(\s|$)/.test(s)){ kind = 'todo'; eat(/(^|\s)(משימה|לעשות|תזכורת)(\s|$)/); }
  if (/(^|\s)(עבודה|צילום של|הזמנה)(\s|$)/.test(s) && /₪|שקל/.test(s)) kind = 'job';

  /* חלק היום נקרא מראש — הוא קובע אם "ב-4" הוא 04:00 או 16:00 */
  let partOfDay = '';
  if (/(^|\s)(בבוקר|בוקר)(\s|$)/.test(s)){ partOfDay = 'am'; eat(/(^|\s)(בבוקר|בוקר)(\s|$)/); }
  else if (/(^|\s)(בצהריים|בצהרים)(\s|$)/.test(s)){ partOfDay = 'noon'; eat(/(^|\s)(בצהריים|בצהרים)(\s|$)/); }
  else if (/(^|\s)(בערב|בלילה|אחה״צ|אחהצ|אחר הצהריים)(\s|$)/.test(s)){
    partOfDay = 'pm'; eat(/(^|\s)(בערב|בלילה|אחה״צ|אחהצ|אחר הצהריים)(\s|$)/);
  }

  // תאריך יחסי
  let m;
  const SEP = '[\\s\\-־–]*';                 // אחרי "ב" יכול לבוא מקף: ב-4 · ב־4 · ב 4 · ב4
  if ((m = eat(/(^|\s)היום(\s|$)/)))            iso = todayISO();
  else if ((m = eat(/(^|\s)מחר(תיים)?(\s|$)/))) iso = isoOf(addDays(new Date(), m[2] ? 2 : 1));
  else if ((m = eat(/(^|\s)אתמול(\s|$)/)))      iso = isoOf(addDays(new Date(), -1));
  else if ((m = eat(/(^|\s)(?:בעוד|עוד)\s+(?:(\d+|[א-ת]+)\s+)?(ימים|יום|שבועות|שבוע|חודשים|חודש)(\s|$)/))){
    const raw = m[2];
    const n = raw ? (/^\d+$/.test(raw) ? +raw : (HEB_NUMS[raw] || 1)) : 1;
    const unit = m[3];
    const d = new Date();
    if (/חודש/.test(unit)) d.setMonth(d.getMonth() + n);
    else d.setDate(d.getDate() + n * (/שבוע/.test(unit) ? 7 : 1));
    iso = isoOf(d);
  }
  else if ((m = eat(/(^|\s)(?:ביום\s+|ב)?(ראשון|שני|שלישי|רביעי|חמישי|שישי|שבת)(\s|$)/))){
    const want = DOW_WORDS[m[2]];
    const d = new Date(); let add = (want - d.getDay() + 7) % 7;
    if (add === 0) add = 7;                       // "ביום שלישי" = השלישי הבא
    eat(/(^|\s)הקרוב(\s|$)/);
    iso = isoOf(addDays(d, add));
  }
  else if ((m = eat(/(^|\s)(\d{1,2})[./](\d{1,2})(?:[./](\d{2,4}))?(\s|$)/))){
    const y = m[4] ? (m[4].length === 2 ? 2000 + +m[4] : +m[4]) : base.getFullYear();
    iso = `${y}-${pad2(+m[3])}-${pad2(+m[2])}`;
  }

  /* שעה. "ב-4" בעברית מדוברת הוא 16:00, אלא אם נאמר "בבוקר". */
  const toHour = h => {
    if (partOfDay === 'am') return h % 24;
    if (partOfDay === 'pm' || partOfDay === 'noon') return h < 12 ? h + 12 : h;
    return h >= 1 && h <= 7 ? h + 12 : h;          // 1–7 ללא ציון = אחר הצהריים
  };
  if ((m = eat(new RegExp('(^|\\s)(?:בשעה|ב)' + SEP + '(\\d{1,2})[:.](\\d{2})(\\s|$)')))){
    let h = +m[2];
    if (partOfDay === 'pm' && h < 12) h += 12;
    if (partOfDay === 'am' && h >= 13) h -= 12;
    time = pad2(h % 24) + ':' + m[3];
  }
  else if ((m = eat(new RegExp('(^|\\s)(?:בשעה|ב)' + SEP + '(\\d{1,2})(\\s|$)')))){
    time = pad2(toHour(+m[2])) + ':00';
    if (eat(/(^|\s)ו(חצי|רבע)(\s|$)/)) time = time.slice(0, 3) + (RegExp.$2 === 'חצי' ? '30' : '15');
  }
  else if ((m = eat(/(^|\s)(\d{1,2}):(\d{2})(\s|$)/)))
    time = pad2(+m[2] % 24) + ':' + m[3];
  else if ((m = eat(new RegExp('(^|\\s)(?:בשעה|ב)' + SEP + '(' +
           Object.keys(HEB_NUMS).join('|') + ')(\\s|$)')))){
    const n = HEB_NUMS[m[2]];
    if (n) time = pad2(toHour(n)) + ':00';
  }

  // משך
  if ((m = eat(/(^|\s)ל(שעה|שעתיים|חצי שעה|\d+\s*שעות|\d+\s*דקות)(\s|$)/)) && time){
    const t = m[2];
    let mins = 60;
    if (t === 'שעתיים') mins = 120;
    else if (t === 'חצי שעה') mins = 30;
    else if (/דקות/.test(t)) mins = parseInt(t, 10) || 30;
    else if (/שעות/.test(t)) mins = (parseInt(t, 10) || 1) * 60;
    const tot = toMin(time) + mins;
    end = pad2(Math.floor(tot / 60) % 24) + ':' + pad2(tot % 60);
  }

  /* מיקום — "ב<מקום>" בסוף המשפט.
     נלקח רק אם המילה באמת נראית כמו מקום, אחרת "לחדש ביטוח" היה הופך
     את "יטוח" למיקום. הרשימה לומדת מהמיקומים שכבר השתמשת בהם. */
  const words = s.trim().split(/\s+/).filter(Boolean);
  const places = knownPlaces();
  for (let start = words.length - 1; start >= 0 && start >= words.length - 4; start--){
    if (!/^ב[א-ת]/.test(words[start])) continue;
    const phrase = [words[start].slice(1)].concat(words.slice(start + 1)).join(' ');
    if (places.has(phrase)){
      where = phrase;
      words.splice(start);
      break;
    }
  }
  s = ' ' + words.join(' ') + ' ';

  const what = s.replace(/\s+/g, ' ').trim() || 'ללא כותרת';
  return { iso, time, end, what, where, kind };
}

function quickAddCommit(parsed){
  const w = dayW(parsed.iso);
  if (parsed.kind === 'todo'){
    w.todos.push(Object.assign(TODO_DEFAULT(), { t: parsed.what }));
  } else if (parsed.kind === 'job'){
    const job = Object.assign(JOB_DEFAULT(), { title: parsed.what, iso: parsed.iso,
                                               time: parsed.time, where: parsed.where });
    if (DB.settings.deliveryDays) job.deliverBy = isoOf(addDays(fromISO(parsed.iso), DB.settings.deliveryDays));
    DB.jobs.push(job);
  } else {
    w.appts = (w.appts || []).filter(a => a && (a.time || a.what || a.where));
    w.appts.push(Object.assign(APPT_DEFAULT(), { time: parsed.time, end: parsed.end,
                                                 what: parsed.what, where: parsed.where }));
    sortAppts(w.appts);
  }
  invalidatePlacesCache();   // מיקום חדש נכנס למילון לפעם הבאה
  saveDB();
}

  openModal('הוספה מהירה', [

      'דוגמאות: <b>מחר ב-4 צילום משפחה באשקלון</b> · <b>ביום שלישי ב-16:30 פגישה עם דני לשעתיים</b> · ' +
      '<b>בעוד שבוע משימה לשלוח אלבום</b> · <b>12/9 ב-9 בבוקר סיור באולם</b>' })
  ], [

/* ==================== 16. דחיית משימה בלחיצה ==================== */
function snoozeTargets(){
  const now = new Date();
  const nextDow = w => { let a = (w - now.getDay() + 7) % 7; if (!a) a = 7; return isoOf(addDays(now, a)); };
  return [
    ['מחר',        isoOf(addDays(now, 1))],
    ['ראשון הבא',  nextDow(0)],
    ['בעוד שבוע',  isoOf(addDays(now, 7))],
    ['בעוד חודש',  (() => { const d = new Date(now); d.setMonth(d.getMonth() + 1); return isoOf(d); })()]
  ];
}

/** מעביר משימה ליום אחר. fromCtx = { bucket, iso, key } */
function snoozeTodo(item, fromCtx, toIso, after){
  const src = fromCtx.bucket === 'day' || !fromCtx.bucket
    ? (DB.days[fromCtx.iso] || {}).todos
    : (DB[fromCtx.bucket] || {})[fromCtx.key] && DB[fromCtx.bucket][fromCtx.key].todos;
  if (src){ const i = src.indexOf(item); if (i >= 0) src.splice(i, 1); }
  dayW(toIso).todos.push(item);
  saveDB();
  if (after) after();
  toast('הועברה ל' + fromISO(toIso).toLocaleDateString('he-IL'));
}

function openSnooze(item, ctx, after){
  const body = el('div', { style: 'display:flex;flex-direction:column;gap:7px' });
  snoozeTargets().forEach(([label, iso]) => {
    const d = fromISO(iso);
    body.appendChild(el('button', { class: 'btn', style: 'justify-content:space-between;width:100%',
      onclick: () => { closeModal(); snoozeTodo(item, ctx, iso, after); } }, [
      el('span', { text: label }),
      el('span', { class: 'hint', text: `${DOW_SHORT[d.getDay()]}׳ ${d.toLocaleDateString('he-IL')}` })
    ]));
  });
  const pick = el('input', { type: 'date', value: isoOf(addDays(new Date(), 1)) });
  body.appendChild(el('div', { class: 'row' }, [ pick,
    el('button', { class: 'btn sm primary', onclick: () => {
      if (!pick.value) return;
      closeModal(); snoozeTodo(item, ctx, pick.value, after);
    } }, 'העברה') ]));
  openModal('דחיית "' + (item.t || 'משימה') + '"', body,
    [ el('button', { class: 'btn', onclick: closeModal }, 'ביטול') ]);
}

/* ==================== 17. תכנון אוטומטי של היום ==================== */
function autoPlanDay(iso, opts){
  opts = opts || {};
  const rec = dayW(iso);
  const step = DB.settings.slotMinutes || 30;
  const slots = slotList();
  const taken = new Set();
  // שעות שכבר תפוסות: לוח הזמנים עצמו, פגישות ועבודות
  slots.forEach(t => { if ((rec.schedule || {})[t]) taken.add(t); });
  const block = (startMin, mins) => {
    for (let m = startMin; m < startMin + mins; m += step){
      const t = pad2(Math.floor(m / 60) % 24) + ':' + pad2(m % 60);
      taken.add(t);
    }
  };
  (rec.appts || []).forEach(a => {
    const m = toMin(a && a.time); if (m == null) return;
    const e = toMin(a.end);
    block(m, e != null && e > m ? e - m : 60);
  });
  jobsForISO(iso).forEach(j => { const m = toMin(j.time); if (m != null) block(m, 180); });

  const todos = (rec.todos || []).filter(t => t && !t.d && (t.t || '').trim() && !todoBlocked(t));
  const withEst = todos.filter(t => t.est > 0).sort((a, b) => b.est - a.est);
  const noEst   = todos.filter(t => !t.est);
  const plan = [];
  const free = slots.filter(t => !taken.has(t));
  let fi = 0;
  const place = (t, mins) => {
    const need = Math.max(1, Math.ceil(mins / step));
    while (fi < free.length){
      // דורשים רצף פנוי
      const startIdx = slots.indexOf(free[fi]);
      let ok = true;
      for (let k = 0; k < need; k++){
        const s = slots[startIdx + k];
        if (!s || taken.has(s)){ ok = false; break; }
      }
      if (ok){
        for (let k = 0; k < need; k++) taken.add(slots[startIdx + k]);
        plan.push({ slot: slots[startIdx], todo: t, mins });
        while (fi < free.length && slots.indexOf(free[fi]) < startIdx + need) fi++;
        return true;
      }
      fi++;
    }
    return false;
  };
  withEst.forEach(t => place(t, t.est));
  if (opts.includeUnestimated) noEst.forEach(t => place(t, step));
  return plan;
}

function openAutoPlan(){
  const iso = isoOf(State.cursor);
  let includeUnestimated = false;
  const body = el('div', { style: 'display:flex;flex-direction:column;gap:11px' });
  const listBox = el('div');
  let plan = [];
  const draw = () => {
    plan = autoPlanDay(iso, { includeUnestimated });
    listBox.innerHTML = '';
    if (!plan.length){
      listBox.appendChild(el('div', { class: 'empty-note',
        text: 'אין משימות פתוחות עם הערכת זמן, או שאין חלונות פנויים ביום הזה.' }));
      return;
    }
    plan.forEach(p => {
      listBox.appendChild(el('div', { class: 'row plan-row' }, [
        el('span', { class: 'ltr-num plan-t', text: p.slot }),
        el('span', { class: 'grow', text: p.todo.t }),

      ]));
    });
  };
  draw();
  body.appendChild(el('div', { class: 'field' }, [
